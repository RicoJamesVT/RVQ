<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shadow of the Shogun — Shinobi Sidescroller</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#07090e;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{touch-action:none}
  #wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#202a34 0,#0b1118 55%,#05070a 100%)}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
  #hud{position:absolute;inset:0;pointer-events:none;color:#f4efe2;text-shadow:0 2px 3px #000}
  #topbar{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}
  .panel{background:rgba(8,11,16,.65);border:1px solid rgba(255,218,130,.3);backdrop-filter:blur(5px);border-radius:10px;padding:8px 12px}
  #title{font-weight:800;letter-spacing:.08em;font-size:12px;color:#e7c76b}
  #hp{width:180px;height:12px;border:1px solid #806d3d;background:#151515;border-radius:8px;overflow:hidden;margin-top:5px}
  #hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b32323,#e46a3e);transition:width .12s}
  #score{font-size:13px;font-weight:700;line-height:1.35}#wave{font-size:11px;color:#e7c76b;letter-spacing:.08em}
  #hint{position:absolute;left:50%;top:78px;transform:translateX(-50%);font-size:12px;opacity:.7;text-align:center;white-space:nowrap}
  #mobile{display:none;position:absolute;inset:auto 0 18px 0;padding:0 18px;justify-content:space-between;align-items:end;pointer-events:none}
  .cluster{display:flex;gap:10px;pointer-events:auto}
  .btn{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,218,130,.35);background:rgba(10,13,18,.62);color:#f7e7b2;font-weight:900;font-size:20px;display:grid;place-items:center;box-shadow:0 5px 18px #0007;user-select:none}
  .btn.big{width:74px;height:74px}
  .btn.on,.btn:active{background:rgba(141,39,24,.78);transform:scale(.96)}
  #center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  #gameover{display:none;pointer-events:auto;text-align:center;background:rgba(5,7,10,.9);border:1px solid #806d3d;border-radius:14px;padding:26px 34px;box-shadow:0 15px 50px #000}
  #gameover h1{margin:0 0 8px;font-size:28px;color:#e7c76b}
  #gameover p{margin:6px 0 18px;color:#c7c5bc}
  #restart{border:0;border-radius:8px;background:#a23c27;color:white;font-weight:800;padding:12px 22px;font-size:15px}
  @media (pointer:coarse),(max-width:800px){#mobile{display:flex}#hint{top:68px}.btn{width:58px;height:58px}.btn.big{width:70px;height:70px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <div id="topbar">
    <div class="panel"><div id="title">影 • SHADOW OF THE SHOGUN</div><div id="hp"><i></i></div></div>
    <div class="panel" id="score">SCORE 000000<br><span id="wave">WAVE 1</span></div>
  </div>
  <div id="hint">A/D or ←/→ move • Space jump • J slash • K shuriken • S crouch</div>
  <div id="center"><div id="gameover"><h1>DEFEATED</h1><p id="final">Score 000000</p><button id="restart">RUN AGAIN</button></div></div>
</div>
<div id="mobile">
  <div class="cluster">
    <div class="btn" data-key="left">◀</div><div class="btn" data-key="right">▶</div>
  </div>
  <div class="cluster">
    <div class="btn" data-key="jump">▲</div><div class="btn big" data-key="attack">刀</div><div class="btn" data-key="throw">✦</div>
  </div>
</div>
</div>
<script>

// Sprite atlases. Keep paths relative so the game works when the ZIP is opened locally.
const ATLAS = new Image();
const ZOMBIE = new Image();
const ELITE = new Image();
ATLAS.src = "shinobi_ninja_atlas.png";
ZOMBIE.src = "zombie_enemy_atlas.png";
ELITE.src = "elite_enemy_atlas.png";

// The supplied ninja atlas is a 5x2 grid; the zombie atlas is a 5-frame strip.
const META = {
  idle:   {x:0,   y:0,   w:240, h:220},
  run1:   {x:240, y:0,   w:240, h:220},
  run2:   {x:480, y:0,   w:240, h:220},
  jump:   {x:720, y:0,   w:240, h:220},
  fall:   {x:960, y:0,   w:240, h:220},
  slash:  {x:0,   y:220, w:240, h:220},
  attack: {x:240, y:220, w:240, h:220},
  throw:  {x:480, y:220, w:240, h:220},
  crouch: {x:720, y:220, w:240, h:220}
};
const ZMETA = {
  idle:  {x:0,   y:0, w:128, h:176},
  walk1: {x:128, y:0, w:128, h:176},
  walk2: {x:256, y:0, w:128, h:176},
  walk3: {x:384, y:0, w:128, h:176}
};
const EMETA = {
  idle:  {x:0,   y:0, w:392, h:456},
  walk1: {x:392, y:0, w:392, h:456},
  walk2: {x:784, y:0, w:392, h:456},
  walk3: {x:1176,y:0, w:392, h:456}
};


/* Enemy death explosion: enemies disappear immediately, while the explosion
   continues independently as a visible effect. */
function createEnemyExplosion(x, y) {
  if (!window.enemyExplosions) window.enemyExplosions = [];
  window.enemyExplosions.push({x:x,y:y,life:.34,maxLife:.34});
  const colors=["#fff7b2","#ffd23f","#ff8a00","#ff3b16","#b51f18"];
  for(let i=0;i<34;i++){
    const a=Math.random()*Math.PI*2;
    const speed=90+Math.random()*360;
    window.enemyExplosions.push({
      x:x+Math.cos(a)*4,y:y+Math.sin(a)*4,
      vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-100,
      life:.25+Math.random()*.35,maxLife:.6,
      size:3+Math.random()*7,color:colors[(Math.random()*colors.length)|0],spark:true
    });
  }
}
function updateEnemyExplosions(dt){
  if(!window.enemyExplosions)return;
  for(let i=window.enemyExplosions.length-1;i>=0;i--){
    const p=window.enemyExplosions[i];
    p.life-=dt;
    if(p.spark){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy+=700*dt;}
    if(p.life<=0)window.enemyExplosions.splice(i,1);
  }
}
function drawEnemyExplosions(){
  if(!window.enemyExplosions)return;
  for(const p of window.enemyExplosions){
    const a=Math.max(0,p.life/p.maxLife),sx=worldToScreenX(p.x);
    ctx.save();ctx.globalAlpha=a;
    if(!p.spark){
      const t=1-a;
      ctx.fillStyle="#fff7b2";ctx.beginPath();ctx.arc(sx,p.y,10+55*t,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=a*.8;ctx.fillStyle="#ff6a00";ctx.beginPath();ctx.arc(sx,p.y,6+25*t,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle=p.color;ctx.fillRect(sx-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.restore();
  }
}
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=true;
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
  // The canvas's CSS box is now pinned to its container with inset:0/100%
  // (see the stylesheet) - it always exactly fills #wrap, full stop. So
  // instead of computing a size independently from innerWidth/innerHeight
  // and pushing it back in as an inline style (two separate calculations
  // that can disagree by a sliver and leave the container's own background
  // peeking through at an edge), read the box's *actual* rendered size back
  // and drive everything - the backing store and the game's own W/H used
  // for drawing/physics - from that single source of truth.
  const box=canvas.getBoundingClientRect();
  W=box.width;H=box.height;
  DPR=Math.min(devicePixelRatio||1,2);
  // Round the backing-store size explicitly. Letting the assignment itself
  // truncate a fractional W*DPR/H*DPR (common with 125%/150% browser zoom or
  // moving the window between monitors with different pixel ratios) can leave
  // a sliver of the physical canvas outside the area the CSS box maps back
  // onto, which is exactly the kind of stray, never-cleared strip that shows
  // up as "pixelation buildup" along an edge.
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",resize);
if(window.visualViewport) window.visualViewport.addEventListener("resize",resize);
// Some browsers change devicePixelRatio (page zoom, dragging the window to a
// different-DPI display) without firing a window "resize" event at all. Watch
// for that directly so the canvas backing store is always re-synced instead
// of silently drifting out of alignment with what's actually on screen.
(function watchDPR(){
  const mq=matchMedia(`(resolution: ${devicePixelRatio}dppx)`);
  mq.addEventListener("change",()=>{resize();watchDPR();},{once:true});
})();
resize();

const keys={left:false,right:false,jump:false,attack:false,throw:false,crouch:false};
const pressed={jump:false,attack:false,throw:false};
function setKey(k,v){if(v&&!keys[k]&&pressed[k]!==undefined)pressed[k]=true;keys[k]=v}
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowleft","a"].includes(k))setKey("left",true);
  if(["arrowright","d"].includes(k))setKey("right",true);
  if(["arrowup","w"," "].includes(k)){e.preventDefault();setKey("jump",true)}
  if(k==="j")setKey("attack",true);
  if(k==="k")setKey("throw",true);
  if(["arrowdown","s"].includes(k))setKey("crouch",true);
  if(k==="r" && gameOver)reset();
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(["arrowleft","a"].includes(k))setKey("left",false);
  if(["arrowright","d"].includes(k))setKey("right",false);
  if(["arrowup","w"," "].includes(k))setKey("jump",false);
  if(k==="j")setKey("attack",false);
  if(k==="k")setKey("throw",false);
  if(["arrowdown","s"].includes(k))setKey("crouch",false);
});
document.querySelectorAll(".btn").forEach(b=>{
  const k=b.dataset.key;
  const down=e=>{e.preventDefault();b.classList.add("on");setKey(k,true)};
  const up=e=>{e.preventDefault();b.classList.remove("on");setKey(k,false)};
  b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
document.getElementById("restart").onclick=reset;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const rect=(x,y,w,h)=>({x,y,w,h});
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

let player,enemies,shurikens,particles,scrollX,score,gameOver,time,spawnTimer,shake,wave,waveQueue,wavePause,waveBanner,waveBannerLife;
// The camera offset actually used for drawing. scrollX itself is a raw float
// that moves by a different fractional-pixel amount every frame; if every
// layer (mountains, ground hatching, lanterns, sprites) each computed its own
// offset from that raw float independently, they'd each round to a slightly
// different sub-pixel position relative to one another from frame to frame -
// which is what reads as the frame "sliding" / shimmering at edges. Snapping
// once per frame here and having everything draw from this single value keeps
// every layer locked together on the same whole pixel.
let renderScrollX=0;

function reset(){
  player={x:220,y:0,w:76,h:122,vx:0,vy:0,onGround:false,face:1,hp:100,inv:0,attack:0,attackId:0,throw:0,anim:0};
  enemies=[];shurikens=[];particles=[];scrollX=0;renderScrollX=0;score=0;gameOver=false;time=0;
  wave=0;waveQueue=0;wavePause=0;waveBanner="";waveBannerLife=0;spawnTimer=.5;shake=0;
  document.getElementById("gameover").style.display="none";
  startNextWave();
}
reset();

function groundY(){return H*0.78}
function worldToScreenX(x){return x-renderScrollX}

function startNextWave(){
  wave++;
  waveQueue=4+wave*2;
  wavePause=1.35;
  waveBanner="WAVE "+wave;
  waveBannerLife=1.8;
  spawnTimer=.15;
  document.getElementById("wave").textContent="WAVE "+wave;
}

function spawnEnemy(){
  if(waveQueue<=0)return;
  const x=scrollX+W+rand(80,360);
  const difficulty=Math.min(1,(wave-1)/10);
  const eliteChance=Math.min(.48,.10+wave*.035);
  const elite=Math.random()<eliteChance || (wave>=6 && waveQueue===1);
  if(elite){
    const hp=5+Math.floor((wave-1)/3);
    enemies.push({
      type:"elite",x,y:groundY()-118,w:82,h:118,
      vx:-rand(52,88)-difficulty*32,
      hp,attack:rand(.65,1.45),anim:rand(0,6),dead:0,deathSpin:0,lastHitAttack:-1,
      maxHp:hp,contactDamage:24+Math.min(10,Math.floor(wave/4))
    });
  }else{
    const hp=2+Math.floor((wave-1)/5);
    enemies.push({
      type:"zombie",x,y:groundY()-94,w:66,h:94,
      vx:-rand(35,75)-difficulty*28,
      hp,attack:rand(.75,2.0),anim:rand(0,6),dead:0,deathSpin:0,lastHitAttack:-1,
      maxHp:hp,contactDamage:18+Math.min(8,Math.floor(wave/4))
    });
  }
  waveQueue--;
}

function burst(x,y,n=10){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-120,120),vy:rand(-170,30),life:rand(.25,.6),r:rand(1,4)});
}
function killEnemy(e){
  if(e.dead!==0)return;
  const ex=e.x+e.w/2, ey=e.y+e.h*.45;
  createEnemyExplosion(ex,ey);
  burst(ex,ey,18);
  shake=Math.max(shake,.12);
  e.dead=-1; // remove the enemy immediately; only the explosion remains visible
}
// Collision boxes are kept separate from the large sprite art so attacks feel
// accurate to the character's actual position while still being easy to connect.
function playerBox(){return {x:player.x+18,y:player.y+18,w:player.w-36,h:player.h-22}}
function enemyBox(e){
  // Use the full gameplay body rather than a small inset box.  The zombie
  // artwork contains transparent/padded pixels, so tying damage to the
  // visible pixels can make an enemy look reachable while its collider is not.
  return {x:e.x-8,y:e.y-6,w:e.w+16,h:e.h+12};
}

function meleeHitBox(){
  // Direction-neutral attack volume.  It deliberately overlaps the complete
  // enemy body so every enemy uses the same hit rules regardless of animation,
  // facing direction, or sprite padding.
  const range=player.crouch?118:190;
  const top=player.y+4;
  const bottom=player.y+player.h-4;
  return {
    x:player.x+player.w/2-range/2,
    y:top,
    w:range,
    h:Math.max(1,bottom-top)
  };
}

function damageEnemy(e, source){
  // One universal damage path for every enemy type and every attack type.
  // Rendering is never consulted here, so sprite frames can never make an
  // enemy immune to damage.
  if(!e || e.dead>0)return false;
  if(e.hp<=0){killEnemy(e);return false;}

  e.hp-=1;
  if(source==="melee"){
    const dir=(e.x+e.w/2 >= player.x+player.w/2)?1:-1;
    e.vx+=dir*190;
    burst(e.x+e.w/2,e.y+e.h*.4,10);
    score+=100;
    if(e.hp<=0){killEnemy(e);score+=300;}
  }else{
    e.vx+=Math.sign(source?.vx||player.face)*150;
    burst(e.x+e.w/2,e.y+e.h*.4,6);
    score+=150;
    if(e.hp<=0){killEnemy(e);score+=350;}
  }
  return true;
}

function applyMeleeHits(){
  if(player.attack<=0)return;
  const box=meleeHitBox();
  enemies.forEach(e=>{
    if(e.dead>0)return;
    if(hit(box,enemyBox(e))){
      // Every enemy can be hit once per attack swing, with no dependency on
      // enemy facing, animation frame, or sprite visibility.
      if(e.lastHitAttack===player.attackId)return;
      e.lastHitAttack=player.attackId;
      damageEnemy(e,"melee");
    }
  });
}

function doAttack(){
  player.attack=.26;
  player.attackId=(player.attackId||0)+1;
  applyMeleeHits();
}
function doThrow(){
  player.throw=.18;
  shurikens.push({x:player.x+player.w/2+player.face*34,y:player.y+45,vx:player.face*640,life:1.8,r:9});
}
function hurt(damage=18){
  if(player.inv>0)return;
  player.hp-=damage;player.inv=1.0;player.vx=-player.face*170;player.vy=-230;shake=.18;burst(player.x+38,player.y+55,12);
  if(player.hp<=0){gameOver=true;document.getElementById("final").textContent="Score "+String(score).padStart(6,"0");document.getElementById("gameover").style.display="block"}
}

function update(dt){
  updateEnemyExplosions(dt);
  if(gameOver)return;
  time+=dt; scrollX=Math.max(0,player.x-W*.3);
  renderScrollX=Math.round(scrollX);
  player.inv=Math.max(0,player.inv-dt);
  player.attack=Math.max(0,player.attack-dt);
  player.throw=Math.max(0,player.throw-dt);
  player.crouch=keys.crouch&&player.onGround;
  const accel=player.crouch?900:1450, max=player.crouch?95:285;
  if(keys.left){player.vx-=accel*dt;player.face=-1}
  if(keys.right){player.vx+=accel*dt;player.face=1}
  if(!keys.left&&!keys.right)player.vx*=Math.pow(.0008,dt);
  player.vx=clamp(player.vx,-max,max);
  if(pressed.jump&&player.onGround&&!player.crouch){player.vy=-610;player.onGround=false;burst(player.x+38,groundY(),5)}
  if(pressed.attack)doAttack();
  if(pressed.throw)doThrow();
  // Keep the hit volume live for the whole slash animation. This makes contact
  // forgiving at any angle and prevents frame-timing from deciding the result.
  applyMeleeHits();
  pressed.jump=pressed.attack=pressed.throw=false;
  player.vy+=1550*dt;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  if(player.y+player.h>=groundY()){player.y=groundY()-player.h;player.vy=0;player.onGround=true}else player.onGround=false;
  player.x=Math.max(30,player.x);

  if(waveBannerLife>0)waveBannerLife=Math.max(0,waveBannerLife-dt);
  if(wavePause>0){
    wavePause-=dt;
  }else if(waveQueue>0){
    const maxAlive=Math.min(8,2+Math.floor(wave*.65));
    spawnTimer-=dt;
    if(spawnTimer<=0 && enemies.length<maxAlive){
      spawnEnemy();
      const pressure=Math.min(.28,(wave-1)*.018);
      spawnTimer=rand(.42,.78)-pressure;
    }
  }else if(enemies.length===0 && wavePause<=0){
    startNextWave();
  }
  enemies.forEach(e=>{
    e.anim+=dt*(e.type==="elite"?6.5:8);
    if(e.dead<0)return;
    if(e.dead>0){
      e.dead-=dt;
      e.deathSpin += dt*11;
      e.vy += 900*dt;
      e.x += e.vx*dt;
      e.y += e.vy*dt;
    } else {
      e.attack-=dt;
      const dx=player.x-e.x;
      const difficulty=Math.min(1,(wave-1)/10);
      const chase=e.type==="elite" ? 105+difficulty*35 : 80+difficulty*20;
      const maxSpeed=e.type==="elite" ? 145+difficulty*35 : 120+difficulty*25;
      if(Math.abs(dx)<560)e.vx+=(Math.sign(dx)*chase-e.vx)*dt*(e.type==="elite"?1.8:1.5);
      e.vx=clamp(e.vx,-maxSpeed,maxSpeed);e.x+=e.vx*dt;
      const attackRange=e.type==="elite"?96:78;
      const verticalRange=e.type==="elite"?86:72;
      if(e.attack<=0&&player.attack<=0&&Math.abs(dx)<attackRange&&Math.abs((player.y+player.h/2)-(e.y+e.h/2))<verticalRange){
        const base=e.type==="elite"?0.8:1.1;
        const spread=e.type==="elite"?1.0:0.9;
        e.attack=rand(base,spread)-difficulty*.18;
        hurt(e.contactDamage)
      }
    }
  });
  // Dead enemies are removed immediately; the explosion is rendered independently.
  enemies=enemies.filter(e=>e.dead===0 && e.x>scrollX-180);
  enemies=enemies.filter(e=>e.dead===0 && e.x<scrollX+W+500);
  shurikens.forEach(s=>{
    s.x+=s.vx*dt;s.life-=dt;
    enemies.forEach(e=>{
      if(!e.dead&&hit({x:s.x-7,y:s.y-7,w:14,h:14},enemyBox(e))){
        if(damageEnemy(e,s))s.life=0;
      }
    })
  });
  shurikens=shurikens.filter(s=>s.life>0&&s.x>scrollX-50&&s.x<scrollX+W+100);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt});
  particles=particles.filter(p=>p.life>0);
  shake=Math.max(0,shake-dt);
  document.querySelector("#hp i").style.width=player.hp+"%";
  document.querySelector("#score").textContent="SCORE "+String(score).padStart(6,"0");
}

function drawSprite(name,x,y,w,h,flip=false,alpha=1){
  const m=META[name]; if(!m||!ATLAS.complete)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+(flip?w:0),y);if(flip)ctx.scale(-1,1);
  ctx.drawImage(ATLAS,m.x,m.y,m.w,m.h,0,0,w,h);ctx.restore();
}
function drawZombieSprite(name,x,y,w,h,flip=false,alpha=1){
  const m=ZMETA[name]; if(!m||!ZOMBIE.complete)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+(flip?w:0),y);if(flip)ctx.scale(-1,1);
  ctx.drawImage(ZOMBIE,m.x,m.y,m.w,m.h,0,0,w,h);ctx.restore();
}
function drawEliteSprite(name,x,y,w,h,flip=false,alpha=1){
  const m=EMETA[name]; if(!m||!ELITE.complete)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+(flip?w:0),y);if(flip)ctx.scale(-1,1);
  ctx.drawImage(ELITE,m.x,m.y,m.w,m.h,0,0,w,h);ctx.restore();
}
function drawBackground(){
  // layered parallax mountains
  const gy=groundY();
  // Overdraw a hair past every edge (instead of an exact 0,0,W,H rect) so
  // sub-pixel rounding from the DPR transform can never leave a thin,
  // never-repainted seam at the border for old pixel data to accumulate in.
  ctx.fillStyle="#0c141a";ctx.fillRect(-2,-2,W+4,H+4);
  for(let layer=0;layer<3;layer++){
    const off=-(renderScrollX*(.08+layer*.06))%360;
    ctx.beginPath();ctx.moveTo(-400+off,gy);
    for(let x=-400+off;x<W+500;x+=120){
      const peak=gy-80-layer*65-Math.abs(Math.sin((x+renderScrollX*.01)/180))*90;
      ctx.lineTo(x+60,peak);ctx.lineTo(x+120,gy);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    ctx.fillStyle=["#111d24","#16242b","#1d2c32"][layer];ctx.fill();
  }
  // moon
  ctx.globalAlpha=.8;ctx.fillStyle="#d6cda9";ctx.beginPath();ctx.arc(W*.78,100,42,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#162027";ctx.beginPath();ctx.arc(W*.8,92,42,0,Math.PI*2);ctx.fill();
  // ground (overdrawn a hair past the bottom/side edges for the same reason)
  ctx.fillStyle="#101417";ctx.fillRect(-2,gy,W+4,H-gy+4);
  ctx.strokeStyle="#5c4d30";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
  for(let x=-(renderScrollX%80);x<W;x+=80){ctx.strokeStyle="rgba(220,190,115,.12)";ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+35,gy+H*.22);ctx.stroke()}
}

function draw(){
  // Reset to the raw pixel grid and clear the *entire* physical backing
  // buffer (canvas.width/height, not just the logical W/H the game draws
  // in). drawBackground()'s fillRect covers the logical frame, but if the
  // backing store is ever a pixel or two larger than that (DPR rounding,
  // a resize event landing mid-frame, etc.) those extra physical pixels
  // never get repainted and old frames' pixels sit there and accumulate -
  // which is exactly the "pixelation buildup" this clear eliminates.
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  drawBackground();
  ctx.save();
  if(shake>0)ctx.translate(rand(-5,5),rand(-4,4));
  // lanterns
  for(let x=-40-(renderScrollX%300);x<W+300;x+=300){
    const y=groundY()-150;ctx.strokeStyle="#2c2720";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+35);ctx.lineTo(x,y+110);ctx.stroke();
    ctx.fillStyle="#d27d32";ctx.fillRect(x-11,y+20,22,32);ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(x,y+36,35,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
  enemies.forEach(e=>{
    const sx=worldToScreenX(e.x);
    if(sx<-160||sx>W+160)return;
    // Dead enemies are removed from the list immediately. Therefore only living
    // enemies reach this renderer and there is no fade/knockdown death frame.
    const zframe=["idle","walk1","walk2","walk3"][Math.floor(e.anim*1.7)%4];
    if(e.type==="elite"){
      drawEliteSprite(zframe,sx-18,e.y-6,e.w*1.35,e.h*1.35,e.vx>0);
      // Small health pips make the tougher enemy's extra durability readable.
      const barW=72, ratio=clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle="#120f0d";ctx.fillRect(sx+e.w/2-barW/2,e.y-12,barW,5);
      ctx.fillStyle="#c86b3c";ctx.fillRect(sx+e.w/2-barW/2,e.y-12,barW*ratio,5);
    }else{
      drawZombieSprite(zframe,sx-18,e.y-8,e.w*1.15,e.h*1.15,e.vx>0);
    }
  });
  // Main character
  // Render the player from the original shinobi atlas.  This was accidentally
  // omitted when the wave renderer was added, leaving the character invisible.
  let pframe="idle";
  if(player.crouch) pframe="crouch";
  else if(player.throw>0) pframe="throw";
  else if(player.attack>0) pframe=(player.attack>.13?"slash":"attack");
  else if(!player.onGround) pframe=player.vy<0?"jump":"fall";
  else if(Math.abs(player.vx)>35) pframe=(Math.floor(time*9)%2===0?"run1":"run2");
  const psx=worldToScreenX(player.x);
  const palpha=(player.inv>0 && Math.floor(player.inv*18)%2===0)?.42:1;
  drawSprite(pframe,psx-25,player.y-25,125,165,player.face<0,palpha);

  drawEnemyExplosions();
  // Draw thrown shuriken clearly on top of the action so they remain visible
  // against dark backgrounds and never disappear behind the player/enemies.
  shurikens.forEach(s=>{
    const sx=worldToScreenX(s.x);
    if(sx < -40 || sx > W+40) return;
    ctx.save();
    ctx.translate(sx,s.y);
    ctx.rotate(time*18);
    ctx.shadowColor="rgba(255,255,255,.65)";
    ctx.shadowBlur=5;
    ctx.fillStyle="#e9edf0";
    ctx.strokeStyle="#111";
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      const r=i%2?5:14;
      ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#3a4248";ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  if(waveBannerLife>0){
    const a=Math.max(0,Math.min(1,waveBannerLife/.35,(1.8-waveBannerLife)/.35));
    ctx.save();ctx.globalAlpha=a;ctx.textAlign="center";
    ctx.font="900 34px system-ui,sans-serif";ctx.fillStyle="#e7c76b";
    ctx.shadowColor="#000";ctx.shadowBlur=12;
    ctx.fillText(waveBanner,W/2,H*.28);
    ctx.font="700 12px system-ui,sans-serif";ctx.fillStyle="#f4efe2";
    ctx.fillText(wave%5===0?"ELITE ASSAULT":"ENEMIES APPROACH",W/2,H*.28+24);
    ctx.restore();
  }
}
let last=performance.now();
let rafId=0;
function loop(now){
  // Clamp frame time so a tab switch, resize, or temporary browser hitch can
  // never produce a giant physics step. Keep the game loop alive even if a
  // non-critical frame operation throws.
  let dt=(now-last)/1000;
  last=now;
  if(!Number.isFinite(dt) || dt<0) dt=0;
  dt=Math.min(0.033,dt);
  try{
    update(dt);
    draw();
  }catch(err){
    // Do not let one transient rendering/HUD error permanently stop RAF.
    // Keep the simulation alive on the next frame.
    console.error("Game frame recovered from error:",err);
  }
  rafId=requestAnimationFrame(loop);
}
rafId=requestAnimationFrame(loop);
</script>
