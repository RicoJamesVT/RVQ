<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exotic Blooms — Claw Machine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{
    --void: #0b0318;
    --cabinet-dark: #1c1033;
    --cabinet-mid: #2f1b52;
    --pink: #ff2e88;
    --teal: #00e6c3;
    --gold: #ffc93c;
    --glass: rgba(140, 220, 255, 0.10);
    /* No web fonts: everything works offline, so these are pure system stacks
       (Baloo 2 / Nunito are used automatically if the device already has them). */
    --font-display: 'Baloo 2','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
    --font-body: Nunito,'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--void);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    font-family:var(--font-body);
  }
  html,body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0;
    padding: calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index:10;
  }
  #title{
    font-family:var(--font-display);
    font-weight:800;
    font-size: clamp(16px, 4vw, 26px);
    color: var(--gold);
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(255,201,60,0.55), 0 0 2px rgba(0,0,0,0.6);
    line-height:1.05;
  }
  #title small{
    display:block;
    font-family:var(--font-body);
    font-weight:700;
    font-size: clamp(9px, 2vw, 12px);
    color: var(--teal);
    letter-spacing: 2px;
    text-shadow:none;
    margin-top:2px;
  }
  #scorepill{
    background: linear-gradient(180deg, rgba(47,27,82,0.92), rgba(28,16,51,0.92));
    border: 1.5px solid rgba(255,201,60,0.4);
    border-radius: 999px;
    padding: 8px 18px;
    color: #fff8ea;
    font-family:var(--font-display);
    font-weight:700;
    font-size: clamp(13px, 3vw, 17px);
    box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px;
  }
  #scorepill .dot{ color: var(--pink); }

  /* ---------- Message banner ---------- */
  #msgWrap{
    position:fixed; left:0; right:0; top: calc(58px + var(--safe-t));
    display:flex; justify-content:center; pointer-events:none; z-index:9;
  }
  #msg{
    max-width: min(86vw, 480px);
    text-align:center;
    background: rgba(11,3,24,0.55);
    backdrop-filter: blur(3px);
    border: 1px solid rgba(0,230,195,0.35);
    color:#eafffb;
    font-weight:700;
    font-size: clamp(12px, 2.6vw, 15px);
    padding: 8px 16px;
    border-radius: 14px;
    opacity:0;
    transform: translateY(-6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #msg.show{ opacity:1; transform:translateY(0); }

  /* ---------- Controls ---------- */
  #controls{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding: 0 calc(18px + var(--safe-r)) calc(16px + var(--safe-b)) calc(18px + var(--safe-l));
    z-index:10;
    pointer-events:none;
  }
  #joyZone{
    pointer-events:auto;
    width: clamp(100px, 26vw, 132px);
    height: clamp(100px, 26vw, 132px);
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.08), rgba(0,0,0,0.35) 70%);
    border: 2px solid rgba(0,230,195,0.4);
    box-shadow: inset 0 4px 14px rgba(0,0,0,0.5), 0 0 18px rgba(0,230,195,0.15);
    position:relative;
    touch-action:none;
  }
  #joyKnob{
    position:absolute; width:44%; height:44%; left:28%; top:28%;
    border-radius:50%;
    background: linear-gradient(180deg, #ffe9b0, var(--gold));
    box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 -3px 6px rgba(150,100,0,0.35);
    pointer-events:none;
  }
  #dropBtn{
    pointer-events:auto;
    width: clamp(84px, 20vw, 108px);
    height: clamp(84px, 20vw, 108px);
    border-radius:50%;
    border: none;
    background: radial-gradient(circle at 35% 28%, #ff6fb0, var(--pink) 65%, #b8005c 100%);
    color:#fff;
    font-family:var(--font-display);
    font-weight:800;
    font-size: clamp(14px, 3.4vw, 18px);
    letter-spacing:1px;
    box-shadow: 0 6px 0 #8f0046, 0 8px 18px rgba(255,46,136,0.35);
    transform: translateY(0);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #dropBtn:active{ transform: translateY(5px); box-shadow: 0 1px 0 #8f0046, 0 3px 8px rgba(255,46,136,0.3); }
  #dropBtn:disabled{ filter: grayscale(0.6) brightness(0.7); }

  /* Landscape / portrait tweaks */
  @media (orientation: landscape){
    #controls{ padding-bottom: calc(14px + var(--safe-b)); }
  }
  @media (orientation: portrait){
    #joyZone{ margin-bottom: 6px; }
  }

  #startOverlay{
    position:fixed; inset:0; z-index:20;
    background: radial-gradient(ellipse at 50% 30%, #2f1b52 0%, #0b0318 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding: calc(20px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));
    overflow:auto;
  }
  #splashArt{
    width:100%;
    max-width: min(92vw, 620px);
    max-height: 62vh;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 0 0 1.5px rgba(0,230,195,0.35), 0 0 34px rgba(0,230,195,0.25), 0 14px 30px rgba(0,0,0,0.55);
  }
  #startOverlay p{
    font-family:var(--font-body); font-weight:600;
    color:#dcefff; max-width:420px; font-size: clamp(13px,3.2vw,16px);
    margin:0; line-height:1.5;
  }
  #startBtn{
    border:none; background:none; padding:0; margin:0;
    cursor:pointer;
    flex-shrink:0;
    line-height:0;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.55)) drop-shadow(0 8px 16px rgba(255,46,46,0.35));
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  #startBtn img{
    display:block;
    width: clamp(150px, 34vw, 220px);
    height:auto;
    image-rendering: pixelated;
  }
  #startBtn:active{
    transform: translateY(4px);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.55)) drop-shadow(0 3px 8px rgba(255,46,46,0.3));
  }
  .hidden{ display:none !important; }

  /* Start screen: centre when it fits, scroll (never clip the top) when it doesn't */
  #startOverlay{ justify-content:flex-start; -webkit-overflow-scrolling:touch; }
  #startOverlay > :first-child{ margin-top:auto; }
  #startOverlay > :last-child{ margin-bottom:auto; }

  /* Short landscape screens (phones on their side) */
  @media (orientation: landscape) and (max-height: 480px){
    #hud{ padding-top: calc(6px + var(--safe-t)); }
    #title{ font-size: 16px; }
    #msgWrap{ top:auto; bottom: calc(10px + var(--safe-b)); }
    #msg{ max-width: min(52vw, 420px); }
    #joyZone{ width:104px; height:104px; }
    #dropBtn{ width:88px; height:88px; }
    #controls{ padding-bottom: calc(8px + var(--safe-b)); }
    #startOverlay{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); grid-template-rows:1fr auto;
      align-items:center; justify-items:center; gap:6px 22px; justify-content:stretch; }
    #startOverlay > :first-child, #startOverlay > :last-child{ margin:0; }
    #splashArt{ grid-column:1; grid-row:1 / span 2; width:auto; height:auto; max-width:100%;
      max-height: calc(100vh - 24px - var(--safe-t) - var(--safe-b)); }
    #startOverlay p{ grid-column:2; grid-row:1; align-self:end; font-size:13px; max-width:340px; }
    #startBtn{ grid-column:2; grid-row:2; align-self:start; }
    #startBtn img{ width: clamp(120px, 24vw, 170px); }
  }
</style>
</head>

</div>

<div id="msgWrap"><div id="msg"></div></div>

<div id="controls">
  <div id="joyZone"><div id="joyKnob"></div></div>
  <button id="dropBtn">DROP</button>

<!-- Same locally-vendored three.js the main game already ships (lib/three.min.js), so no network is needed. -->
<script src="../../lib/three.min.js"></script>
<script>
(function(){
"use strict";

// Fail loudly instead of silently if anything below throws, so the screen
// never just sits blank with no explanation.
window.addEventListener('error', function(e){
  showFatalError((e && e.message) ? e.message : 'Unknown error');
});
function showFatalError(msg){
  let el = document.getElementById('fatalError');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalError';
    el.style.cssText = 'position:fixed;inset:0;z-index:999;background:#0b0318;color:#ffdede;'+
      'font-family:sans-serif;display:flex;flex-direction:column;align-items:center;'+
      'justify-content:center;text-align:center;padding:24px;gap:10px;';
    el.innerHTML = '<div style="font-size:20px;font-weight:700;">The game failed to load</div>'+
      '<div style="max-width:480px;font-size:14px;opacity:0.85;">'+ (msg||'') +'</div>'+
      '<div style="font-size:13px;opacity:0.6;">Close the claw machine and try opening it again.</div>';
    document.body.appendChild(el);
  }
}
if(typeof THREE === 'undefined'){
  showFatalError('The bundled 3D library (lib/three.min.js) could not be loaded.');
  return;
}
if(!window.WebGLRenderingContext){
  showFatalError('Your browser/device does not appear to support WebGL, which this game needs.');
  return;
}

/* =========================================================
   BASIC SETUP
========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

canvas.addEventListener('webglcontextlost', e=>{ e.preventDefault(); }, false); // lets three.js restore it
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0318);
scene.fog = new THREE.Fog(0x0b0318, 12, 30);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
const cabinetCenterTarget = new THREE.Vector3(0, 2.6, 0);

const clock = new THREE.Clock();

/* =========================================================
   LIGHTING
========================================================= */
scene.add(new THREE.AmbientLight(0x8899ff, 0.55));

const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(3, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
keyLight.shadow.camera.left = -6; keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);

const pinkLight = new THREE.PointLight(0xff2e88, 1.4, 14, 2);
pinkLight.position.set(-3.5, 5.5, 3);
scene.add(pinkLight);

const tealLight = new THREE.PointLight(0x00e6c3, 1.4, 14, 2);
tealLight.position.set(3.5, 5.5, 3);

function makeFlower(paletteEntry){
  const group = new THREE.Group();

  const stemMat = new THREE.MeshStandardMaterial({color:0x2f9e44, roughness:0.7});
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.07,0.55,8), stemMat);
  stem.position.y = 0.275;
  stem.castShadow = true;
  group.add(stem);

  // leaves
  for(let i=0;i<2;i++){
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8), stemMat);
    leaf.scale.set(1,0.28,0.55);
    const ang = i===0 ? 0.6 : -2.4;
    leaf.position.set(Math.cos(ang)*0.14, 0.2+i*0.05, Math.sin(ang)*0.14);
    leaf.rotation.y = ang;
    leaf.rotation.z = 0.3;
    leaf.castShadow = true;
    group.add(leaf);
  }

  // bloom
  const bloom = new THREE.Group();
  bloom.position.y = 0.62;
  group.add(bloom);

  const petalMat = new THREE.MeshStandardMaterial({color:paletteEntry.petal, roughness:0.5, emissive:paletteEntry.petal, emissiveIntensity:0.08, side:THREE.DoubleSide});
  const petalMat2 = new THREE.MeshStandardMaterial({color:paletteEntry.petal2, roughness:0.5, emissive:paletteEntry.petal2, emissiveIntensity:0.06, side:THREE.DoubleSide});
  const petalCount = 6;
  for(let i=0;i<petalCount;i++){
    const ang = (i/petalCount)*Math.PI*2;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.19,10,8), i%2===0?petalMat:petalMat2);
    petal.scale.set(1.0, 0.32, 0.55);
    petal.position.set(Math.cos(ang)*0.2, 0.02, Math.sin(ang)*0.2);
    petal.rotation.y = -ang;
    petal.rotation.x = 0.25;
    petal.castShadow = true;
    bloom.add(petal);
  }
  // second layer, smaller & rotated offset for fullness
  for(let i=0;i<petalCount;i++){
    const ang = (i/petalCount)*Math.PI*2 + Math.PI/petalCount;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.13,8,8), petalMat);
    petal.scale.set(1.0, 0.3, 0.5);
    petal.position.set(Math.cos(ang)*0.11, 0.09, Math.sin(ang)*0.11);
    petal.rotation.y = -ang;
    petal.rotation.x = 0.15;
    bloom.add(petal);
  }

  const centerMat = new THREE.MeshStandardMaterial({color:paletteEntry.center, roughness:0.4, emissive:paletteEntry.center, emissiveIntensity:0.35});
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.11,12,12), centerMat);
  center.position.y = 0.1;
  bloom.add(center);

  for(let i=0;i<4;i++){
    const ang = (i/4)*Math.PI*2;
    const stamen = new THREE.Mesh(new THREE.SphereGeometry(0.025,6,6), centerMat);
    stamen.position.set(Math.cos(ang)*0.09, 0.2, Math.sin(ang)*0.09);
    bloom.add(stamen);
  }

  group.userData.swayPhase = Math.random()*Math.PI*2;
  group.userData.baseRotY = Math.random()*Math.PI*2;
  group.rotation.y = group.userData.baseRotY;
  group.userData.paletteName = paletteEntry.name;
  return group;
}

function tooClose(x,z){
  return flowers.some(f=>{
    const dx=f.position.x-x, dz=f.position.z-z;
    return Math.sqrt(dx*dx+dz*dz) < 0.65;
  }) || (Math.hypot(x-CHUTE_POS.x, z-CHUTE_POS.z) < 0.9);
}

  f.position.set(pos.x, FLOOR_Y, pos.z);
  scene.add(f);
  flowers.push(f);
}

/* =========================================================
   GAME STATE MACHINE
========================================================= */
const STATE = { IDLE:'idle', DESCEND:'descend', CLOSE:'close', ASCEND:'ascend', TOCHUTE:'tochute', OPEN_RELEASE:'open_release', RETURN:'return' };
let state = STATE.IDLE;
let stateT = 0;
let heldFlower = null;
let wins = 0, tries = 0;
const HOME_POS = {x:0, z:0};

function clampToBounds(x,z){
  return {
    x: THREE.MathUtils.clamp(x, BOUNDS.minX, BOUNDS.maxX),
    z: THREE.MathUtils.clamp(z, BOUNDS.minZ, BOUNDS.maxZ)
  };
}

const winEl = document.getElementById('winCount');
const tryEl = document.getElementById('tryCount');
const msgEl = document.getElementById('msg');
let msgTimeout = null;
function showMsg(text, ms){
  msgEl.textContent = text;
  msgEl.classList.add('show');
  if(msgTimeout) clearTimeout(msgTimeout);
  msgTimeout = setTimeout(()=>msgEl.classList.remove('show'), ms||2200);
}

function startDrop(){
  if(state !== STATE.IDLE) return;
  tries++; tryEl.textContent = tries;
  state = STATE.DESCEND; stateT = 0;
  beep(440, 0.08);
}

function tryGrab(){
  let best = null, bestDist = Infinity;
  flowers.forEach(f=>{
    const dx = f.position.x - clawRig.position.x;
    const dz = f.position.z - clawRig.position.z;
    const d = Math.sqrt(dx*dx+dz*dz);
    if(d < bestDist){ bestDist = d; best = f; }
  });
  const GRAB_RADIUS = 0.55;
  if(best && bestDist < GRAB_RADIUS){
    const chance = THREE.MathUtils.clamp(1 - (bestDist/GRAB_RADIUS), 0, 1) * 0.8 + 0.12;
    if(Math.random() < chance){
      heldFlower = best;
      return true;
    }
  }
  return false;
}

function attachHeldFlower(){
  if(!heldFlower) return;
  scene.remove(heldFlower);
  heldFlower.position.set(0, -0.55, 0);
  heldFlower.rotation.y = Math.random()*Math.PI*2;
  clawHead.add(heldFlower);
}
function detachHeldFlowerToChute(){
  if(!heldFlower) return;
  clawHead.remove(heldFlower);
  scene.remove(heldFlower);
  const idx = flowers.indexOf(heldFlower);
  if(idx>=0) flowers.splice(idx,1);
  heldFlower = null;
  wins++; winEl.textContent = wins;
  setTimeout(spawnFlower, 350);
}
function dropHeldFlowerOnFloor(){
  if(!heldFlower) return;
  const world = new THREE.Vector3();
  heldFlower.getWorldPosition(world);
  clawHead.remove(heldFlower);
  scene.add(heldFlower);
  const p = clampToBounds(world.x, world.z);
  heldFlower.position.set(p.x, FLOOR_Y, p.z);
  heldFlower = null;
}

const SPEED = 3.1; // units/sec for X/Z travel
const DESCEND_SPEED = 3.0;

function updateStateMachine(dt){
  switch(state){
    case STATE.IDLE:
      break;
    case STATE.DESCEND: {
      clawHead.position.y = THREE.MathUtils.clamp(clawHead.position.y - DESCEND_SPEED*dt, -(RAIL_Y-GRAB_Y), 0);
      if(clawHead.position.y <= -(RAIL_Y-GRAB_Y)+0.001){
        state = STATE.CLOSE; stateT = 0;
      }
      break;
    }
    case STATE.CLOSE: {
      stateT += dt;
      const t = Math.min(stateT/0.45, 1);
      setClawOpenness(1-t);
      if(t>=1){
        const success = tryGrab();
        if(success){ attachHeldFlower(); showMsg('Got it! Lifting your bloom…', 1800); beep(660,0.1); }
        else { showMsg('Missed — reposition and try again!', 2200); beep(220,0.12); }
        state = STATE.ASCEND; stateT = 0;
      }
      break;
    }
    case STATE.ASCEND: {
      clawHead.position.y = THREE.MathUtils.clamp(clawHead.position.y + DESCEND_SPEED*dt, -(RAIL_Y-GRAB_Y), 0);
      if(clawHead.position.y >= -0.001){
        clawHead.position.y = 0;
        state = heldFlower ? STATE.TOCHUTE : STATE.RETURN;
        stateT = 0;
      }
      break;
    }
    case STATE.TOCHUTE: {
      const dx = CHUTE_POS.x - clawRig.position.x;
      const dz = CHUTE_POS.z - clawRig.position.z;
      const dist = Math.sqrt(dx*dx+dz*dz);
      if(dist < 0.03){
        state = STATE.OPEN_RELEASE; stateT = 0;
      } else {
        const step = Math.min(SPEED*dt, dist);
        clawRig.position.x += (dx/dist)*step;
        clawRig.position.z += (dz/dist)*step;
      }
      break;
    }
    case STATE.OPEN_RELEASE: {
      stateT += dt;
      const t = Math.min(stateT/0.4, 1);
      setClawOpenness(t);
      if(t>=1){
        detachHeldFlowerToChute();
        showMsg('Bloom collected! 🌸 Added to your bouquet.', 2400);
        state = STATE.RETURN; stateT = 0;
      }
      break;
    }
    case STATE.RETURN: {
      const dx = HOME_POS.x - clawRig.position.x;
      const dz = HOME_POS.z - clawRig.position.z;
      const dist = Math.sqrt(dx*dx+dz*dz);
      if(dist < 0.03){
        clawRig.position.x = HOME_POS.x; clawRig.position.z = HOME_POS.z;
        state = STATE.IDLE;
      } else {
        const step = Math.min(SPEED*dt, dist);
        clawRig.position.x += (dx/dist)*step;
        clawRig.position.z += (dz/dist)*step;
      }
      break;
    }
  }
  cable.scale.y = Math.max(0.05, -clawHead.position.y || 0.05);
  cable.position.y = clawHead.position.y/2;
}

/* =========================================================
   INPUT: JOYSTICK + KEYBOARD
========================================================= */
let inputX = 0, inputZ = 0; // -1..1
const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false, joyId = null, joyCenter = {x:0,y:0};
const JOY_RADIUS_FRAC = 0.5;

function joyRect(){ return joyZone.getBoundingClientRect(); }

function joyStart(e){
  const r = joyRect();
  joyCenter = {x:r.left+r.width/2, y:r.top+r.height/2};
  joyActive = true;
  joyId = e.pointerId;
  joyZone.setPointerCapture(e.pointerId);
  joyMove(e);
}
function joyMove(e){
  if(!joyActive || e.pointerId !== joyId) return;
  const r = joyRect();
  const maxR = r.width*JOY_RADIUS_FRAC;
  let dx = e.clientX - joyCenter.x;
  let dy = e.clientY - joyCenter.y;
  const len = Math.sqrt(dx*dx+dy*dy);
  if(len > maxR){ dx = dx/len*maxR; dy = dy/len*maxR; }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  inputX = dx/maxR;
  inputZ = dy/maxR;
}
function joyEnd(e){
  if(e && e.pointerId !== joyId) return;
  joyActive = false; joyId = null;
  joyKnob.style.transform = 'translate(0px,0px)';
  inputX = 0; inputZ = 0;
}
joyZone.addEventListener('pointerdown', joyStart);
joyZone.addEventListener('pointermove', joyMove);
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);

const keys = {};
window.addEventListener('keydown', e=>{
  const k = (e.key || '').toLowerCase();
  if(k === 'escape'){
    // The parent game's own Esc handler can't see keys typed while this iframe has focus.
    try{ window.parent.postMessage({ricoClawMachine:'close'}, '*'); }catch(_){}
    return;
  }
  if(k.startsWith('arrow')) e.preventDefault(); // never scroll/move the page behind the game
  keys[k] = true;
  ensureAudio();
  if(e.key === ' ') {
    e.preventDefault();
    const overlay = document.getElementById('startOverlay');
    if(!overlay.classList.contains('hidden')){
      document.getElementById('startBtn').click();
    } else {
      startDrop();
    }
  }
});
window.addEventListener('keyup', e=>{ keys[(e.key || '').toLowerCase()] = false; });
// Never leave a direction "stuck on" if focus moves away mid-press (alt-tab, tapping the parent page, etc.)
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });
document.addEventListener('contextmenu', e=>e.preventDefault()); // long-press on touch screens

function keyboardVector(){
  let x=0,z=0;
  if(keys['arrowleft']||keys['a']) x -= 1;
  if(keys['arrowright']||keys['d']) x += 1;
  if(keys['arrowup']||keys['w']) z -= 1;
  if(keys['arrowdown']||keys['s']) z += 1;
  return {x,z};
}

const dropBtn = document.getElementById('dropBtn');
dropBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); startDrop(); });

/* =========================================================
   AUDIO (tiny WebAudio beeps, best-effort)
========================================================= */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  } else if(actx.state === 'suspended'){ actx.resume(); }
}
function beep(freq, dur){
  if(!actx) return;
  try{
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime+dur);
  }catch(e){}
}
// Every gesture (not just the first) re-arms audio, since iOS/Android can suspend it again.
document.body.addEventListener('pointerdown', ()=>{ ensureAudio(); try{ window.focus(); }catch(_){} });
try{ window.focus(); }catch(_){}

  document.getElementById('startOverlay').classList.add('hidden');

/* =========================================================
   CAMERA / RESIZE
========================================================= */
// Given the box we need to frame, the camera's (vertical) field of view,
// and the viewport aspect ratio, returns how far back along the view
// direction the camera must sit so BOTH the width and the height of the
// box fit inside the frustum (plus half the box depth, since the near
// face of the box sits that much closer to the camera than its center).
function fitDistanceForBox(size, vFovDeg, aspect){
  const vFov = THREE.MathUtils.degToRad(vFovDeg);
  const distForHeight = (size.y/2) / Math.tan(vFov/2);
  const distForWidth = (size.x/2) / (Math.tan(vFov/2) * aspect);
  return Math.max(distForHeight, distForWidth) + size.z/2;
}

function updateCamera(){
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w/h;
  camera.aspect = aspect;

  // fov/elevation still vary by orientation for a nice viewing angle,
  // but the DISTANCE is now solved for, rather than a fixed guess —
  // so however narrow (tall phone) or wide (ultrawide desktop) the
  // viewport is, the full cabinet frame stays on screen.
  let vFov, elev;
  if(aspect < 0.85){       // portrait
    vFov = 58; elev = 0.42;
  } else if(aspect < 1.2){ // squarish
    vFov = 50; elev = 0.38;
  } else {                 // landscape
    vFov = 42; elev = 0.33;
  }
  camera.fov = vFov;

  const MARGIN = 1.08; // a little breathing room so the frame never touches the edges
  const dist = fitDistanceForBox(focusSize, vFov, aspect) * MARGIN;
  const dir = new THREE.Vector3(0, elev, 1).normalize();
  camera.position.copy(focusCenter).addScaledVector(dir, dist);

  camera.lookAt(cabinetCenterTarget);

  // Portrait / squarish screens: the HUD sits above and the joystick + DROP button sit below the
  // cabinet, so nudge the picture toward the middle of the *free* space between them.
  let yOff = 0;
  if(aspect < 1.0){
    const hudBottom = document.getElementById('hud').getBoundingClientRect().bottom;
    const ctrlTop = joyZone.getBoundingClientRect().top;
    yOff = Math.round(((h - ctrlTop) - hudBottom)/2);
    yOff = Math.max(0, Math.min(yOff, h*0.18));
  }
  if(yOff) camera.setViewOffset(w, h, 0, yOff, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', updateCamera);
window.addEventListener('orientationchange', ()=> setTimeout(updateCamera, 200));
updateCamera();

/* =========================================================
   MAIN LOOP
========================================================= */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // movement input (joystick has priority, else keyboard)
  let mx = inputX, mz = inputZ;
  if(mx===0 && mz===0){
    const kv = keyboardVector();
    mx = kv.x; mz = kv.z;
  }
  if(state === STATE.IDLE && (mx!==0 || mz!==0)){
    const nx = clawRig.position.x + mx*SPEED*dt;
    const nz = clawRig.position.z + mz*SPEED*dt;
    const clamped = clampToBounds(nx, nz);
    clawRig.position.x = clamped.x;
    clawRig.position.z = clamped.z;
  }

  updateStateMachine(dt);

  // flower idle sway
  flowers.forEach(f=>{
    if(f === heldFlower) return;
    f.rotation.y = f.userData.baseRotY + Math.sin(t*0.6 + f.userData.swayPhase)*0.06;
    f.position.y = FLOOR_Y + Math.sin(t*1.1 + f.userData.swayPhase)*0.02;
  });
  if(heldFlower){
    heldFlower.rotation.y += dt*0.6;
  }

  // marquee bulb blink
  bulbs.forEach(b=>{
    const v = (Math.sin(t*4 + b.userData.phase)+1)/2;
    b.material.emissiveIntensity = 0.4 + v*1.2;
  });

  // light shimmer
  pinkLight.intensity = 1.2 + Math.sin(t*1.3)*0.2;
  tealLight.intensity = 1.2 + Math.sin(t*1.3+Math.PI)*0.2;

  renderer.render(scene, camera);
}
animate();

})();
