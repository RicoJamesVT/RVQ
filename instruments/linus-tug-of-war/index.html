<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Linus Tug of War</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#8fd0e8;--ink:#2b1d14;--olive:#5b6b2e;--cream:#fff1cf;--red:#d8432b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#8fd0e8}}
:root[data-theme="dark"]{--bg:#8fd0e8}
html,body{height:100%;margin:0;background:#8fd0e8;overflow:hidden;font-family:"Lilita One","Trebuchet MS",Impact,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(16px,3.4vmin,26px)}
#bar{width:min(80vw,520px);height:16px;margin:6px auto 0;background:#fff8;border:3px solid var(--ink);border-radius:10px;position:relative;overflow:hidden}
#bar i{position:absolute;top:0;bottom:0;left:50%;width:14px;margin-left:-7px;background:var(--red);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
#pull{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);font:inherit;font-size:clamp(24px,6vmin,44px);padding:.35em 1.6em;background:var(--olive);color:var(--cream);border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);touch-action:none}
#pull:active,#pull.on{transform:translateX(-50%) translateY(5px);box-shadow:0 1px 0 var(--ink)}
#pull:focus-visible{outline:4px solid #fff}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#2b1d14b8;color:var(--cream);padding:20px}
#ov.h{display:none}
#ov h1{margin:0;font-size:clamp(34px,9vmin,72px);font-weight:400;line-height:1}
#ov p{margin:0;max-width:30ch;font-family:"Trebuchet MS",sans-serif;font-size:clamp(15px,3vmin,20px);line-height:1.4}
#go{font:inherit;font-size:clamp(22px,5vmin,36px);padding:.3em 1.4em;background:var(--red);color:var(--cream);border:4px solid var(--cream);border-radius:14px;margin-top:8px}
#go:focus-visible{outline:4px solid #fff;outline-offset:3px}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="lv">Round 1</div><div id="bar"><i id="mk"></i></div></div>
<button id="pull" aria-label="Pull">PULL!</button>
<div id="ov"><h1 id="t">Linus Tug of War</h1><p id="m">Tap PULL (or mash Space) faster than Johnny to drag him over the line.</p><button id="go">Play</button></div>

let ac;function beep(fr,d){try{ac=ac||new (window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=fr;o.type='square';v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function pull(){if(state!='play')return;const gap=t-lastTap;combo=gap<.28?Math.min(combo+1,10):0;lastTap=t;f-=.05*(1+combo*.04);lean=1;shake=Math.max(shake,2);
for(let i=0;i<3;i++)parts.push({x:linX(),y:gy(),vx:-Math.random()*90-20,vy:-Math.random()*70,l:.5});
if(combo>=4)pops.push({s:combo>=8?'MEGA PULL!':'Pull!',x:linX(),y:gy()-dh()*1.05,l:.6});beep(200+combo*30,.05)}
function start(n){lvl=n;f=0;combo=0;state='play';ov.classList.add('h');document.getElementById('lv').textContent='Round '+lvl+(best?'  ·  Best '+best:'')}
function end(win){state=win?'won':'lost';if(win&&lvl>best){best=lvl;try{localStorage.setItem('linusBest',best)}catch(e){}}
document.getElementById('t').textContent=win?'Linus wins!':'Johnny wins!';
document.getElementById('m').textContent=win?'Round '+lvl+' cleared. Johnny is getting stronger.':'Linus got dragged over the line. Try again!';
document.getElementById('go').textContent=win?'Next round':'Rematch';ov.classList.remove('h');ov.dataset.n=win?lvl+1:1;beep(win?600:120,.4)}
document.getElementById('go').onclick=()=>start(+ov.dataset.n||1);
const pb=document.getElementById('pull');
pb.addEventListener('pointerdown',e=>{e.preventDefault();pb.classList.add('on');pull()});
['pointerup','pointercancel','pointerleave'].forEach(k=>pb.addEventListener(k,()=>pb.classList.remove('on')));
cv.addEventListener('pointerdown',e=>{e.preventDefault();pull()});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='ArrowLeft'||e.code=='KeyA'){e.preventDefault();if(!e.repeat){if(state=='play')pull();else if(ov.classList.contains('h')==false&&e.code=='Space')document.getElementById('go').click()}}});
const dh=()=>Math.min(H*.38,W*.36/.595),dw=()=>dh()*.595,gy=()=>H*(H>W?.66:.74);
const linX=()=>W*.27+f*W*.2,oppX=()=>W*.73+f*W*.2;
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;t+=dt;
if(state=='play'){const surge=1+.7*Math.max(0,Math.sin(t*1.9+lvl));f+=(.11+.03*lvl)*surge*dt;if(t-lastTap>.4)combo=0;
if(f<=-1)end(true);else if(f>=1)end(false)}
lean=Math.max(0,lean-dt*4);shake=Math.max(0,shake-dt*10);
mk.style.left=(50+f*50)+'%';draw(dt);requestAnimationFrame(loop)}
function draw(dt){g.clearRect(0,0,W,H);const s=shake?[(Math.random()-.5)*shake,(Math.random()-.5)*shake]:[0,0];g.save();g.translate(s[0],s[1]);
let sk=g.createLinearGradient(0,0,0,gy());sk.addColorStop(0,'#7cc6e6');sk.addColorStop(1,'#d9f1f7');g.fillStyle=sk;g.fillRect(-10,-10,W+20,H+20);
g.fillStyle='#9ec5a1';const hy=gy()-dh()*.5;for(let i=0;i<5;i++){g.beginPath();g.arc(W*(.1+i*.22),hy+H*.14,W*.16,Math.PI,0);g.fill()}
g.fillStyle='#7fae4d';g.fillRect(-10,gy()-6,W+20,H);g.fillStyle='#6a9a3d';for(let i=0;i<W;i+=28)g.fillRect(i,gy()+12+(i*7%5)*9,14,4);
g.fillStyle='#6b4a2f';g.beginPath();g.ellipse(W/2,gy()+dh()*.03,W*.09,dh()*.05,0,0,7);g.fill();
g.strokeStyle='#fff';g.lineWidth=4;g.setLineDash([10,8]);g.beginPath();g.moveTo(W/2,gy()-dh()*1.1);g.lineTo(W/2,gy()+dh()*.05);g.stroke();g.setLineDash([]);
const ry=gy()-dh()*.42,lx=linX()+dw()*.3,rx=oppX()-dw()*.3;
g.strokeStyle='#2b1d14';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(lx,ry);g.quadraticCurveTo(W/2,ry+H*.02+Math.sin(t*9)*2,rx,ry);g.stroke();
g.strokeStyle='#d6a85c';g.lineWidth=5;g.setLineDash([9,6]);g.stroke();g.setLineDash([]);
const mx=W/2+f*W*.25*0+(lx+rx)/2-W/2;g.fillStyle='#d8432b';g.strokeStyle='#2b1d14';g.lineWidth=3;g.beginPath();g.moveTo(mx,ry+2);g.lineTo(mx+16,ry+30);g.lineTo(mx-16,ry+30);g.closePath();g.fill();g.stroke();
const tug=state=='play'?Math.sin(t*14)*.02:0;
spr(L,linX(),-(.06+.14*lean)+tug,1);spr(R,oppX(),.06+Math.max(0,-f)*.1-tug,1);
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;if(p.l<=0){parts.splice(i,1);continue}g.fillStyle='rgba(120,90,55,'+p.l*1.6+')';g.fillRect(p.x,p.y,6,6)}
g.font=Math.round(dh()*.16)+'px "Lilita One",Impact,sans-serif';g.textAlign='center';g.lineWidth=5;
for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.l-=dt;p.y-=40*dt;if(p.l<=0){pops.splice(i,1);continue}g.strokeStyle='#2b1d14';g.strokeText(p.s,p.x,p.y);g.fillStyle='#fff1cf';g.fillText(p.s,p.x,p.y)}
g.restore()}
function spr(img,x,rot,dir){const h=dh(),w=img.naturalWidth?h*img.naturalWidth/img.naturalHeight:dw();g.save();g.translate(x,gy());g.rotate(rot*dir*-1*-1);
g.fillStyle='#0003';g.beginPath();g.ellipse(0,0,w*.42,h*.035,0,0,7);g.fill();
g.imageSmoothingEnabled=false;if(img.complete)g.drawImage(img,-w/2,-h,w,h);g.restore()}
requestAnimationFrame(loop);
// Esc while this iframe has focus never reaches the parent game's key handler, so ask it to close us.
addEventListener('keydown',e=>{if(e.code=='Escape'){try{parent.postMessage({ricoLinusTug:'close'},'*')}catch(_){}}});
</script></body></html>
