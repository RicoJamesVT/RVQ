<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HYPER SWIM '96 DELUXE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html,body {
    height:100%; overflow:hidden; background:#000;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #wrap {
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, #23104a 0%, #050014 75%);
  }
  #gameCanvas {
    background:#000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width:98vw;
    height:98vh;
    max-width: calc(98vh * 1.5);
    max-height: calc(98vw * 0.6667);
    border: 4px solid #333;
    box-shadow: 0 0 0 2px #9a8fd0, 0 0 50px rgba(255,0,180,0.45), inset 0 0 60px rgba(0,0,0,0.5);
    border-radius: 4px;
  }
  #controls {
    position:absolute;
    bottom:0; left:0; right:0;
    display:none;
    justify-content:space-between;
    padding: 0 18px 22px 18px;
    pointer-events:none;
    z-index: 10;
  }
  #controls.active { display:flex; }
  .btnpad {
    display:flex;
    gap:16px;
    pointer-events:auto;
  }
  .swimbtn {
    width:86px; height:86px;
    border-radius:50%;
    border: 3px solid #fff;
    background: linear-gradient(180deg, #ff3d7f, #a3004a);
    color:#fff;
    font-weight:bold;
    font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 0 #6a0033, 0 6px 14px rgba(0,0,0,0.6);
    font-family: 'Courier New', monospace;
    opacity:0.92;
  }
  .swimbtn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #6a0033;
  }
  .swimbtn.left { background: linear-gradient(180deg, #33d1ff, #005c8a); box-shadow: 0 6px 0 #003a58, 0 6px 14px rgba(0,0,0,0.6); }
  .swimbtn.left:active { box-shadow: 0 1px 0 #003a58; }
  #startHint {
    position:absolute;
    top:12px; left:0; right:0;
    text-align:center;
    color:#ffd400;
    font-size:13px;
    letter-spacing:1.5px;
    text-shadow: 2px 2px 0 #000;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas" width="960" height="640"></canvas>
  <div id="startHint">TAP SCREEN OR PRESS SPACE TO START</div>
  <div id="controls">
    <div class="btnpad">
      <div class="swimbtn left" id="btnLeft">&#9668;</div>
      <div class="swimbtn" id="btnRight">&#9658;</div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const controlsEl = document.getElementById('controls');
  const startHint = document.getElementById('startHint');

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) controlsEl.classList.add('active');

  // ---------- Audio (tiny synthesized SFX, no files) ----------
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  function beep(freq, dur, type, gainVal, startFreq){
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(startFreq || freq, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq), t0 + dur);
    gain.gain.setValueAtTime(gainVal||0.08, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function sfxStroke(){ beep(220, 0.08, 'square', 0.06); }
  function sfxGood(){ beep(440, 0.09, 'square', 0.07); }
  function sfxPerfect(){ beep(880, 0.16, 'triangle', 0.09, 520); }
  function sfxOops(){ beep(90, 0.18, 'sawtooth', 0.08, 160); }
  function sfxFalseStart(){ beep(60, 0.35, 'sawtooth', 0.09, 220); }
  function sfxRocket(){ beep(1200, 0.22, 'triangle', 0.1, 300); }
  function sfxFinish(){
    if(!audioCtx) return;
    [523,659,784,1047].forEach((f,i)=>{
      setTimeout(()=>beep(f,0.18,'triangle',0.08), i*90);
    });
  }

  // ---------- Palette (Genesis-ish, extended) ----------
  const PAL = {
    sky1: '#180735', sky2: '#3b1370', sky3: '#8a2f9e', skyHorizon: '#ff6fae',
    sun: '#ffe680', sunCore: '#fffbe6',
    water1: '#052a5c', water2: '#0a4a92', water3: '#136fc2',
    waterFoam: '#eafcff', waterDeep: '#031c3d',
    lane: '#ffffff',
    deck1: '#cdc4e6', deck2: '#a191c9',
    crowd: ['#e03c31','#ffd400','#2ecc71','#3399ff','#ff8c00','#ff3399','#8a5cff','#00e0c0'],
    text: '#ffffff',
    shadow: '#000000',
    hud1: '#160c33', hud2: '#2a1660', hudBorder: '#8a5cff',
    perfect: '#4dffb8', good: '#33c2ff', slow: '#c9c9d8', oops: '#ff4d6d', gold:'#ffd400'
  };

  // ---------- Game State ----------
  const STATE = { MENU:0, READY:1, SET:2, GO:3, RACE:4, FINISH:5 };
  let state = STATE.MENU;
  let stateTimer = 0;

  const NUM_LANES = 5;
  const RACE_DIST = 50; // meters
  const LANE_H = 68;
  const TRACK_TOP = 190;
  const POOL_H = NUM_LANES * LANE_H;
  const POOL_BOTTOM = TRACK_TOP + POOL_H;
  const HUD_H = 82;
  const HUD_TOP = H - HUD_H;

  function makeSwimmer(laneIdx, isPlayer, name, skill){
    return {
      lane: laneIdx,
      isPlayer,
      name,
      skill,
      progress: 0,
      speed: 0,
      stamina: 100,
      strokePhase: 0,
      animT: Math.random()*10,
      finished:false,
      finishTime:0,
      wakeTimer: 0,
    };
  }

  let swimmers = [];
  let raceTime = 0;
  let playerRank = 0;

  // player mechanics state
  let playerNextExpected = 'L';
  let playerStrokeCooldown = 0;
  let lastStrokeTime = -999;
  let streak = 0;
  let bestStreak = 0;
  let comboMult = 1;
  let strokeHistory = []; // last few quality tags for HUD trail
  let hasStrokedThisRace = false;
  let falseStartFlag = false;
  let falseStartPenaltyT = 0;
  let raceStartClock = 0;

  function resetRace(){
    swimmers = [];
    swimmers.push(makeSwimmer(0, true, 'YOU', 0.5));
    const names = ['RIVAL','TORPEDO','SHARKY','BLAZE'];
    for(let i=0;i<4;i++){
      swimmers.push(makeSwimmer(i+1, false, names[i], 0.45 + Math.random()*0.35));
    }
    raceTime = 0;
    playerRank = 0;
    playerNextExpected = 'L';
    playerStrokeCooldown = 0;
    lastStrokeTime = -999;
    streak = 0; bestStreak = 0; comboMult = 1;
    strokeHistory = [];
    hasStrokedThisRace = false;
    falseStartFlag = false;
    falseStartPenaltyT = 0;
    raceStartClock = 0;
    floatingTexts.length = 0;
    splashes.length = 0;
    bubbles.length = 0;
  }

  // ---------- Floating popup text (PERFECT!/GOOD/OOPS etc) ----------
  let floatingTexts = [];
  function spawnPopup(x, y, text, color, big){
    floatingTexts.push({x, y, text, color, life: 42, vy: -0.9, big: !!big});
  }
  function updatePopups(){
    for (let i=floatingTexts.length-1;i>=0;i--){
      const p = floatingTexts[i];
      p.y += p.vy; p.vy *= 0.98; p.life--;
      if (p.life<=0) floatingTexts.splice(i,1);
    }
  }

  // ---------- Screen shake ----------
  let shakeT = 0, shakeMag = 0;
  function triggerShake(mag, dur){ shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, dur); }

  // ---------- Input / stroke classification ----------
  let keyLeftDown=false, keyRightDown=false;

  function classify(side, now){
    if (side !== playerNextExpected) return 'OOPS_ORDER';
    const dt = now - lastStrokeTime;
    if (dt < 0.11) return 'OOPS_FAST';
    if (dt >= 0.20 && dt <= 0.40) return 'PERFECT';
    if (dt > 0.40 && dt <= 0.65) return 'GOOD';
    if (dt < 0.20) return 'GOOD';
    return 'SLOW';
  }

  function doStroke(side){
    ensureAudio();
    if (state === STATE.MENU) { startSequence(); return; }
    if (state === STATE.READY || state === STATE.SET) {
      // false start! pressing before GO
      if (!falseStartFlag) {
        falseStartFlag = true;
        spawnPopup(W/2, H/2+30, 'FALSE START!', PAL.oops, true);
        sfxFalseStart();
        triggerShake(6, 14);
      }
      return;
    }
    if (state !== STATE.RACE) return;
    const p = swimmers[0];
    if (p.finished) return;
    if (playerStrokeCooldown > 0) return;
    playerStrokeCooldown = 4;

    const now = raceTime;
    const quality = classify(side, now);
    const x = laneX(p.progress);
    const y = TRACK_TOP + p.lane*LANE_H + LANE_H/2;

    if (quality === 'OOPS_ORDER' || quality === 'OOPS_FAST') {
      p.speed += 0.5;
      p.stamina -= 4.5;
      streak = 0; comboMult = 1;
      spawnPopup(x, y-40, quality==='OOPS_ORDER' ? 'WRONG ARM!' : 'TOO FAST!', PAL.oops);
      sfxOops();
      strokeHistory.push('oops');
    } else {
      // correct alternation
      playerNextExpected = (side === 'L') ? 'R' : 'L';
      let rocket = false;
      if (!hasStrokedThisRace) {
        hasStrokedThisRace = true;
        if (!falseStartFlag && raceTime <= 0.4) rocket = true;
      }
      let penalty = 1;
      if (falseStartPenaltyT > 0) penalty = 0.35;

      if (quality === 'PERFECT') {
        streak++; bestStreak = Math.max(bestStreak, streak);
        comboMult = Math.min(1.6, 1 + streak*0.06);
        const power = (2.6 + (p.stamina/100)*0.6) * comboMult * penalty;
        p.speed += power;
        p.stamina -= 1.5;
        spawnPopup(x, y-40, streak>=5 ? `PERFECT! x${streak}` : 'PERFECT!', PAL.perfect, streak>=3);
        sfxPerfect();
        triggerShake(3, 8);
        spawnSplash(p, 6, true);
      } else if (quality === 'GOOD') {
        const power = (2.0 + (p.stamina/100)*0.5) * comboMult * penalty;
        p.speed += power;
        p.stamina -= 2.4;
        spawnPopup(x, y-40, 'GOOD', PAL.good);
        sfxGood();
        spawnSplash(p, 4, false);
      } else { // SLOW
        streak = 0; comboMult = 1;
        const power = (1.3) * penalty;
        p.speed += power;
        p.stamina -= 2.8;
        spawnPopup(x, y-40, 'SLOW...', PAL.slow);
        sfxStroke();
        spawnSplash(p, 3, false);
      }
      strokeHistory.push(quality==='PERFECT'?'perfect':(quality==='GOOD'?'good':'slow'));

      if (rocket) {
        p.speed += 5.5;
        spawnPopup(x, y-64, 'ROCKET START!', PAL.gold, true);
        sfxRocket();
        triggerShake(5, 12);
      }
    }
    if (strokeHistory.length > 10) strokeHistory.shift();
    lastStrokeTime = now;
    p.stamina = Math.max(0, Math.min(100, p.stamina));
  }

  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === STATE.MENU) startSequence();
      else if (state === STATE.FINISH) { resetRace(); state = STATE.MENU; startHint.style.display='block'; }
      return;
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyZ') { e.preventDefault(); if(!keyLeftDown){keyLeftDown=true; doStroke('L');} }
    if (e.code === 'ArrowRight' || e.code === 'KeyX') { e.preventDefault(); if(!keyRightDown){keyRightDown=true; doStroke('R');} }
  });
  window.addEventListener('keyup', (e)=>{
    if (e.code === 'ArrowLeft' || e.code === 'KeyZ') keyLeftDown=false;
    if (e.code === 'ArrowRight' || e.code === 'KeyX') keyRightDown=false;
  });

  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  function touchDown(side){
    return function(e){ e.preventDefault(); doStroke(side); };
  }
  btnLeft.addEventListener('touchstart', touchDown('L'), {passive:false});
  btnRight.addEventListener('touchstart', touchDown('R'), {passive:false});
  btnLeft.addEventListener('mousedown', touchDown('L'));
  btnRight.addEventListener('mousedown', touchDown('R'));

  canvas.addEventListener('touchstart', (e)=>{
    if (state === STATE.MENU) { e.preventDefault(); startSequence(); }
    else if (state === STATE.FINISH) { e.preventDefault(); resetRace(); state = STATE.MENU; startHint.style.display='block'; }
  }, {passive:false});
  canvas.addEventListener('mousedown', (e)=>{
    ensureAudio();
    if (state === STATE.MENU) startSequence();
    else if (state === STATE.FINISH) { resetRace(); state = STATE.MENU; startHint.style.display='block'; }
  });

  function startSequence(){
    ensureAudio();
    resetRace();
    state = STATE.READY;
    stateTimer = 0;
    startHint.style.display = 'none';
  }

  // ---------- Particles: splashes / bubbles ----------
  let splashes = [];
  let bubbles = [];
  function spawnSplash(sw, count, big){
    const y = TRACK_TOP + sw.lane*LANE_H + LANE_H/2;
    const x = laneX(sw.progress);
    const n = count || 4;
    for(let i=0;i<n;i++){
      const sz = big ? (2+Math.random()*3) : (1.5+Math.random()*2);
      splashes.push({
        x: x+ (Math.random()*14-7), y: y+(Math.random()*10-5),
        vx:(Math.random()*2.4-1.2), vy:-Math.random()*(big?2.4:1.6)-0.5,
        life:16+Math.random()*10, size:sz
      });
    }
  }
  function updateSplashes(dt){
    for(let i=splashes.length-1;i>=0;i--){
      const s = splashes[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.14; s.life--;
      if (s.life<=0) splashes.splice(i,1);
    }
    // ambient bubbles in the pool
    if (state === STATE.RACE && Math.random() < 0.35) {
      const lane = Math.floor(Math.random()*NUM_LANES);
      bubbles.push({
        x: Math.random()*W, y: TRACK_TOP + lane*LANE_H + LANE_H*0.7,
        vy: -0.3-Math.random()*0.4, life: 60+Math.random()*40, r: 1+Math.random()*1.5
      });
    }
    for (let i=bubbles.length-1;i>=0;i--){
      const b = bubbles[i];
      b.y += b.vy; b.life--;
      if (b.life<=0) bubbles.splice(i,1);
    }
  }

  // ---------- AI ----------
  // AI pace is tuned to the speed a human can realistically sustain with the
  // stroke-timing system (roughly 5-11 units/sec at good rhythm), not an
  // arbitrary faster scale - plus mild rubber-banding so the pack stays close.
  function updateAI(sw, dt){
    if (sw.finished) return;
    const t = raceTime;
    const fatigue = Math.max(0.65, sw.stamina/100);
    sw.stamina -= 0.10;
    if (sw.stamina < 30) sw.stamina += 0.06;

    let target = (3.6 + sw.skill*6.2) * fatigue;
    target += Math.sin(t*2.4 + sw.lane*1.7) * 0.6;

    const player = swimmers[0];
    const gap = sw.progress - player.progress; // positive = AI ahead of player
    const band = Math.max(0.82, Math.min(1.18, 1 - gap*0.012));
    target *= band;

    const smoothing = 1 - Math.exp(-dt*2.5);
    sw.speed += (target - sw.speed) * smoothing;

    if (Math.random() < 0.04) spawnSplash(sw, 1, false);
  }

  function laneX(progressMeters){
    const startX = 96;
    const endX = W - 90;
    const t = Math.min(1, progressMeters / RACE_DIST);
    return startX + t*(endX-startX);
  }

  // ---------- Background decor (clouds/crowd) ----------
  let clouds = [];
  for (let i=0;i<6;i++){
    clouds.push({ x: Math.random()*W, y: 20+Math.random()*90, scale: 0.7+Math.random()*1.1, speed: 4+Math.random()*8 });
  }
  const CROWD_COUNT = 34;
  let crowdPeople = [];
  for (let i=0;i<CROWD_COUNT;i++){
    crowdPeople.push({ phase: Math.random()*Math.PI*2, color: PAL.crowd[i%PAL.crowd.length] });
  }
  let buoyBob = 0;

  // ---------- Main update ----------
  let lastT = performance.now();
  function update(dt){
    stateTimer += dt;
    for (const c of clouds){ c.x += c.speed*dt; if (c.x > W+80) c.x = -80; }
    buoyBob += dt;

    if (playerStrokeCooldown>0) playerStrokeCooldown--;
    if (shakeT>0){ shakeT -= dt*60; if (shakeT<=0){shakeT=0; shakeMag=0;} }
    updatePopups();

    if (state === STATE.READY) {
      if (stateTimer > 0.9) { state = STATE.SET; stateTimer = 0; }
    } else if (state === STATE.SET) {
      if (stateTimer > 0.9) { state = STATE.GO; stateTimer = 0; }
    } else if (state === STATE.GO) {
      if (stateTimer > 0.6) {
        state = STATE.RACE; stateTimer = 0; raceStartClock = 0;
        if (falseStartFlag) falseStartPenaltyT = 1.1;
      }
    } else if (state === STATE.RACE) {
      raceTime += dt;
      if (falseStartPenaltyT > 0) falseStartPenaltyT -= dt;

      const p = swimmers[0];
      p.speed *= 0.975;
      p.stamina = Math.min(100, p.stamina + 0.04);

      for (const sw of swimmers) {
        if (!sw.isPlayer) updateAI(sw, dt);
        if (!sw.finished) {
          sw.progress += sw.speed * dt;
          sw.animT += dt * (1 + sw.speed*0.02);
          if (sw.progress >= RACE_DIST) {
            sw.progress = RACE_DIST;
            sw.finished = true;
            sw.finishTime = raceTime;
          }
        }
      }
      updateSplashes(dt);

      const allDone = swimmers.every(s=>s.finished);
      if (allDone) {
        const ranked = [...swimmers].sort((a,b)=>a.finishTime-b.finishTime);
        playerRank = ranked.findIndex(s=>s.isPlayer) + 1;
        state = STATE.FINISH;
        stateTimer = 0;
        sfxFinish();
      }
    } else {
      updateSplashes(dt);
    }
  }

  // ---------- Drawing helpers ----------
  function pixRect(x,y,w,h,color){
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function pixCircle(x,y,r,color,alpha){
    ctx.save();
    if (alpha!==undefined) ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawText(str, x, y, size, color, align, shadow){
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    if (shadow !== false) {
      ctx.fillStyle = '#000';
      ctx.fillText(str, x+2, y+2);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function lerpColor(c1, c2, t){
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r + (b.r-a.r)*t);
    const g = Math.round(a.g + (b.g-a.g)*t);
    const bl = Math.round(a.b + (b.b-a.b)*t);
    return `rgb(${r},${g},${bl})`;
  }
  function hexToRgb(hex){
    const v = parseInt(hex.slice(1),16);
    return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 };
  }

  function drawBackground(t){
    const bands = 18;
    const skyH = TRACK_TOP - 40;
    for(let i=0;i<bands;i++){
      const tt = i/bands;
      let c;
      if (tt < 0.75) c = lerpColor(PAL.sky1, PAL.sky2, tt/0.75);
      else c = lerpColor(PAL.sky2, PAL.skyHorizon, (tt-0.75)/0.25);
      pixRect(0, i*(skyH/bands), W, skyH/bands+1, c);
    }
    // sun glow
    const sx = W-130, sy = 60;
    const grad = ctx.createRadialGradient(sx, sy, 4, sx, sy, 90);
    grad.addColorStop(0, 'rgba(255,251,230,0.9)');
    grad.addColorStop(0.4, 'rgba(255,230,128,0.35)');
    grad.addColorStop(1, 'rgba(255,230,128,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(sx, sy, 90, 0, Math.PI*2); ctx.fill();
    pixCircle(sx, sy, 26, PAL.sunCore);

    // clouds
    for (const c of clouds){
      ctx.globalAlpha = 0.5;
      pixRect(c.x-24*c.scale, c.y, 48*c.scale, 10*c.scale, '#ffffff');
      pixRect(c.x-14*c.scale, c.y-8*c.scale, 32*c.scale, 12*c.scale, '#ffffff');
      pixRect(c.x, c.y+4*c.scale, 26*c.scale, 8*c.scale, '#ffd9ec');
      ctx.globalAlpha = 1;
    }

    // stadium light poles
    for (let i=0;i<4;i++){
      const px = 60 + i*(W-120)/3;
      pixRect(px-2, 10, 4, skyH-70, '#241245');
      pixCircle(px, 10, 8, '#fff8d6', 0.9);
      const lg = ctx.createRadialGradient(px,10,2,px,10,30);
      lg.addColorStop(0,'rgba(255,248,214,0.6)');
      lg.addColorStop(1,'rgba(255,248,214,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(px,10,30,0,Math.PI*2); ctx.fill();
    }

    // crowd stand
    const crowdY = TRACK_TOP - 42;
    pixRect(0, crowdY-6, W, 48, '#2a1650');
    const segW = W/CROWD_COUNT;
    for (let i=0;i<CROWD_COUNT;i++){
      const person = crowdPeople[i];
      const bounce = Math.sin(t*4 + person.phase) * 3;
      pixRect(i*segW+2, crowdY + 14 + bounce, segW-4, 22-bounce*0.4, person.color);
      pixRect(i*segW+segW/2-3, crowdY+6+bounce, 6, 8, '#ffd9b3');
    }
  }

  function drawDeck(){
    // pool deck strip between crowd and water
    const deckY = TRACK_TOP - 22;
    const tile = 18;
    for (let x=0;x<W;x+=tile){
      const idx = Math.floor(x/tile);
      pixRect(x, deckY, tile, 22, idx%2===0 ? PAL.deck1 : PAL.deck2);
    }
    pixRect(0, TRACK_TOP-2, W, 2, '#1a1030');
  }

  function drawStartBlocks(){
    if (state===STATE.RACE || state===STATE.FINISH || state===STATE.MENU) return;
    for (let i=0;i<NUM_LANES;i++){
      const y = TRACK_TOP + i*LANE_H;
      const bx = laneX(0) - 34;
      pixRect(bx, y+LANE_H/2-16, 26, 20, '#3a2a5e');
      pixRect(bx, y+LANE_H/2-20, 26, 5, '#5a3f96');
      drawText(String(i+1), bx+9, y+LANE_H/2-14, 10, '#ffd400', 'left', true);
    }
  }

  function drawPool(t){
    for (let i=0;i<NUM_LANES;i++){
      const y = TRACK_TOP + i*LANE_H;
      pixRect(0, y, W, LANE_H/2, i%2===0 ? PAL.water2 : PAL.water3);
      pixRect(0, y+LANE_H/2, W, LANE_H/2, i%2===0 ? PAL.water1 : PAL.water2);
    }
    // caustic light blobs
    ctx.globalAlpha = 0.10;
    for (let i=0;i<10;i++){
      const cx = ((i*137 + t*30) % (W+120)) - 60;
      const cy = TRACK_TOP + (i*53)%POOL_H + 10;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46, 12, 0.3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // ripple wave lines (two layers)
    ctx.globalAlpha = 0.45;
    for (let i=0;i<NUM_LANES;i++){
      const y = TRACK_TOP + i*LANE_H;
      for (let x=0; x<W; x+=18){
        const w1 = Math.sin(t*1.6 + x*0.045 + i)*3;
        pixRect(x, y+LANE_H*0.32+w1, 9, 2, PAL.waterFoam);
        const w2 = Math.cos(t*1.1 - x*0.03 + i*1.3)*3;
        pixRect(x+9, y+LANE_H*0.68+w2, 7, 2, 'rgba(234,252,255,0.6)');
      }
    }
    ctx.globalAlpha = 1;
    // rising bubbles
    for (const b of bubbles){
      pixCircle(b.x, b.y, b.r, 'rgba(255,255,255,0.55)');
    }
    // lane dividers with buoys
    for (let i=0;i<=NUM_LANES;i++){
      const y = TRACK_TOP + i*LANE_H;
      pixRect(0, y-1, W, 2, PAL.lane);
      if (i<NUM_LANES){
        for (let x=20; x<W; x+=34){
          const bob = Math.sin(buoyBob*3 + x*0.1)*1.5;
          const col = (Math.floor(x/34)%2===0) ? '#ff3355' : '#ffffff';
          pixCircle(x, y+bob, 3.2, col);
        }
      }
    }
    // distance markers every 10m
    for (let d=10; d<RACE_DIST; d+=10){
      const x = laneX(d);
      pixRect(x, TRACK_TOP, 2, POOL_H, 'rgba(255,255,255,0.25)');
      drawText(`${d}m`, x+4, TRACK_TOP+4, 9, 'rgba(255,255,255,0.5)', 'left', false);
    }
    // finish flag
    const fx = laneX(RACE_DIST);
    pixRect(fx, TRACK_TOP-14, 4, POOL_H+14, '#ffffff');
    for(let i=0;i<NUM_LANES*2;i++){
      pixRect(fx+ (i%2===0?4:0), TRACK_TOP + i*(LANE_H/2), 4, LANE_H/2, i%2===0? '#111':'#fff');
    }
    pixRect(fx-2, TRACK_TOP-30, 30, 16, '#ff3355');
    drawText('FINISH', fx-2, TRACK_TOP-28, 8, '#fff', 'left', false);
  }

  function drawSwimmer(sw, colorBody, colorCap){
    const x = laneX(sw.progress);
    const y = TRACK_TOP + sw.lane*LANE_H + LANE_H/2;
    const bob = Math.sin(sw.animT*8) * 3;
    const armAngle = Math.sin(sw.animT*8) * 0.7;
    const legPhase = Math.cos(sw.animT*8);
    const moving = (state===STATE.RACE) && sw.speed > 4;

    // wake trail
    if (moving) {
      ctx.globalAlpha = 0.35;
      pixRect(x-34, y+10+bob*0.3, 20, 4, PAL.waterFoam);
      pixRect(x-50, y+10+bob*0.3, 12, 3, 'rgba(234,252,255,0.4)');
      ctx.globalAlpha = 1;
    }

    // glow ring under player
    if (sw.isPlayer){
      ctx.globalAlpha = 0.25;
      pixCircle(x+2, y+2+bob, 22, '#33d1ff');
      ctx.globalAlpha = 1;
    }

    // legs (kicking, drawn behind body)
    pixRect(x-22, y-3+bob+legPhase*3, 12, 5, colorBody);
    pixRect(x-22, y+3+bob-legPhase*3, 12, 5, colorBody);

    // body
    pixRect(x-14, y-9+bob, 30, 16, colorBody);
    pixRect(x-14, y-9+bob, 30, 4, lerpColor(colorBody,'#ffffff',0.25));

    // head + cap + goggle
    pixRect(x+12, y-15+bob, 13, 13, '#ffd9b3');
    pixRect(x+12, y-19+bob, 13, 8, colorCap);
    pixRect(x+18, y-11+bob, 4, 3, '#111');

    // arm swinging via rotation
    ctx.save();
    ctx.translate(x-2, y-2+bob);
    ctx.rotate(armAngle);
    pixRect(0, -2, 22, 5, colorBody);
    ctx.restore();

    if (Math.abs(armAngle) > 0.5 && moving) {
      spawnBubbleChance(x+16, y+bob);
      pixRect(x+16, y+2+bob, 5, 4, PAL.waterFoam);
    }

    // name tag with plate
    ctx.globalAlpha = 0.55;
    pixRect(x-24, y-38+bob, sw.name.length*7+6, 13, '#000');
    ctx.globalAlpha = 1;
    drawText(sw.name, x-21, y-36+bob, 9, sw.isPlayer? PAL.gold:'#ffffff', 'left', false);
  }

  function spawnBubbleChance(x,y){
    if (Math.random() < 0.5) bubbles.push({x, y, vy:-0.6, life:20, r:1+Math.random()});
  }

  const AI_COLORS = [
    {body:'#ff5555', cap:'#aa0000'},
    {body:'#55ff9c', cap:'#008a4a'},
    {body:'#5599ff', cap:'#003f8a'},
    {body:'#ffcc33', cap:'#a5720a'},
  ];

  function drawHUD(){
    const g = ctx.createLinearGradient(0,HUD_TOP,0,H);
    g.addColorStop(0, PAL.hud2);
    g.addColorStop(1, PAL.hud1);
    ctx.fillStyle = g;
    ctx.fillRect(0, HUD_TOP, W, HUD_H);
    pixRect(0, HUD_TOP, W, 3, PAL.hudBorder);

    const p = swimmers[0];
    // stamina bar
    drawText('STAMINA', 16, HUD_TOP+10, 10, '#fff', 'left');
    pixRect(16, HUD_TOP+26, 190, 16, '#0a0a1e');
    pixRect(17, HUD_TOP+27, 188, 14, '#222');
    const stW = Math.max(0, p.stamina);
    const stColor = stW>50 ? '#33e07a' : (stW>20 ? '#ffd400' : '#ff4444');
    pixRect(19, HUD_TOP+29, stW*1.84, 10, stColor);

    // streak / combo
    drawText('COMBO', 230, HUD_TOP+10, 10, '#fff', 'left');
    const comboColor = streak>=5 ? PAL.gold : (streak>=1 ? PAL.perfect : '#888');
    drawText(`x${comboMult.toFixed(2)}  (${streak} streak)`, 230, HUD_TOP+26, 13, comboColor, 'left');
    // stroke history trail
    for (let i=0;i<strokeHistory.length;i++){
      const q = strokeHistory[i];
      const col = q==='perfect'?PAL.perfect:(q==='good'?PAL.good:(q==='slow'?PAL.slow:PAL.oops));
      pixRect(230 + i*14, HUD_TOP+44, 10, 10, col);
    }

    // distance
    const distLeft = Math.max(0, RACE_DIST - p.progress).toFixed(0);
    drawText(`${distLeft}m TO GO`, 470, HUD_TOP+10, 13, '#fff', 'left');
    drawText(`TIME ${raceTime.toFixed(2)}`, 470, HUD_TOP+30, 13, PAL.gold, 'left');

    // rank
    const ranked = [...swimmers].sort((a,b)=> b.progress - a.progress);
    const rank = ranked.findIndex(s=>s.isPlayer)+1;
    drawText(`RANK ${rank}/${swimmers.length}`, W-210, HUD_TOP+10, 15, '#ff66cc', 'left');

    // next stroke hint
    const hintColor = playerNextExpected==='L' ? '#33d1ff' : '#ff3d7f';
    drawText(playerNextExpected==='L' ? 'PRESS \u25C4 NEXT' : 'PRESS \u25BA NEXT', W-210, HUD_TOP+34, 12, hintColor, 'left');

    if (falseStartPenaltyT > 0) {
      drawText('RECOVERING FROM FALSE START', W/2, HUD_TOP+58, 11, PAL.oops, 'center');
    }
  }

  function drawFloatingTexts(){
    for (const ft of floatingTexts){
      const alpha = Math.max(0, ft.life/42);
      ctx.globalAlpha = alpha;
      drawText(ft.text, ft.x, ft.y, ft.big?18:12, ft.color, 'center');
      ctx.globalAlpha = 1;
    }
  }

  function drawSplashes(){
    for (const s of splashes){
      ctx.globalAlpha = Math.max(0, s.life/20);
      pixCircle(s.x, s.y, s.size, PAL.waterFoam);
      ctx.globalAlpha = 1;
    }
  }

  function drawCountdown(){
    let label = '';
    if (state === STATE.READY) label = 'READY...';
    if (state === STATE.SET) label = 'SET...';
    if (state === STATE.GO) label = 'GO!!!';
    if (label){
      ctx.globalAlpha = 0.001; // no-op to keep style consistent
      ctx.globalAlpha = 1;
      pixRect(W/2-140, H/2-70, 280, 50, 'rgba(0,0,0,0.4)');
      drawText(label, W/2, H/2-58, 32, state===STATE.GO?'#33e07a':'#ffd400', 'center');
    }
  }

  function drawMenu(t){
    drawBackground(t);
    drawDeck();
    drawPool(t);
    drawStartBlocks();
    pixRect(0, H/2-100, W, 150, 'rgba(0,0,0,0.55)');
    drawText("HYPER SWIM '96", W/2, H/2-84, 40, PAL.gold, 'center');
    drawText('D E L U X E   E D I T I O N', W/2, H/2-38, 14, '#ff66cc', 'center');
    drawText('ALTERNATE \u25C4 \u25BA IN RHYTHM FOR PERFECT STROKES', W/2, H/2-8, 13, '#ffffff', 'center');
    drawText('TAP OR PRESS SPACE TO DIVE IN', W/2, H/2+16, 12, '#33e07a', 'center');
  }

  function drawFinish(){
    pixRect(0,0,W,H,'rgba(0,0,0,0.62)');
    const ranked = [...swimmers].sort((a,b)=>a.finishTime-b.finishTime);
    drawText('RACE RESULTS', W/2, 50, 30, PAL.gold, 'center');
    let medal = playerRank===1?'GOLD!':(playerRank===2?'SILVER!':(playerRank===3?'BRONZE':'FINISH'));
    drawText(medal, W/2, 92, 20, playerRank<=3?PAL.gold:'#ffffff', 'center');
    ranked.forEach((sw, i)=>{
      const y = 150 + i*36;
      const col = sw.isPlayer ? PAL.gold : '#ffffff';
      drawText(`${i+1}. ${sw.name}`, W/2-180, y, 16, col, 'left');
      drawText(`${sw.finishTime.toFixed(2)}s`, W/2+120, y, 16, col, 'left');
    });
    drawText(`BEST COMBO STREAK: ${bestStreak}`, W/2, 150+ranked.length*36+20, 13, '#33c2ff', 'center');
    drawText('TAP OR PRESS SPACE TO RACE AGAIN', W/2, H-40, 13, '#33e07a', 'center');
  }

  function drawScanlines(){
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#000';
    for (let y=0;y<H;y+=4){ ctx.fillRect(0,y,W,2); }
    ctx.globalAlpha = 1;
    // vignette
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }

  // ---------- Render ----------
  function render(now){
    ctx.save();
    if (shakeT > 0) {
      ctx.translate((Math.random()*2-1)*shakeMag, (Math.random()*2-1)*shakeMag);
    }
    ctx.clearRect(-20,-20,W+40,H+40);

    const t = now/1000;

    if (state === STATE.MENU) {
      drawMenu(t);
      drawScanlines();
      ctx.restore();
      return;
    }

    drawBackground(t);
    drawDeck();
    drawPool(t);
    drawStartBlocks();

    for (const sw of swimmers) {
      if (sw.isPlayer) drawSwimmer(sw, '#33d1ff', PAL.gold);
      else drawSwimmer(sw, AI_COLORS[sw.lane-1].body, AI_COLORS[sw.lane-1].cap);
    }
    drawSplashes();
    drawFloatingTexts();

    if (state === STATE.RACE || state===STATE.READY || state===STATE.SET || state===STATE.GO) {
      drawHUD();
    }
    drawCountdown();

    if (state === STATE.FINISH) {
      drawFinish();
    }

    drawScanlines();
    ctx.restore();
  }

  function loop(now){
    const dt = Math.min(0.05, (now-lastT)/1000);
    lastT = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  resetRace();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
