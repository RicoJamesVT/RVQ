<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hip Hop Library</title>
<style>
  :root{
    --bg0:#0e0a06; --bg1:#1c1420; --panel:#241a12; --panel2:#2c1f14;
    --gold:#ffd23c; --gold-dim:#e0b040; --red:#e04858; --cyan:#4ad0ff;
    --green:#7ad04a; --cream:#f4ecd8; --dim:#c9bfa6; --line:rgba(224,176,64,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg0); color:var(--cream);
    font-family:'Courier New', ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---- header / tab nav ---- */
  #topbar{
    flex:0 0 auto; padding:10px 10px 0 10px;
    background:linear-gradient(#241a0e, #140d06);
    border-bottom:2px solid var(--gold-dim);
  }
  #titleRow{ display:flex; align-items:baseline; gap:10px; padding:2px 4px 8px; }
  #titleRow .mark{ font-size:20px; }
  #titleRow h1{
    margin:0; font-size:15px; letter-spacing:1px; color:var(--gold);
    text-shadow:0 0 8px rgba(255,210,60,0.35);
  }
  #titleRow .sub{ font-size:10px; color:var(--dim); letter-spacing:0.5px; }
  #tabs{ display:flex; gap:4px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  #tabs::-webkit-scrollbar{ display:none; }
  .tabBtn{
    flex:0 0 auto; cursor:pointer; padding:7px 12px; font:bold 11px monospace;
    letter-spacing:0.5px; color:var(--dim); background:rgba(255,255,255,0.03);
    border:1.5px solid transparent; border-radius:8px 8px 0 0; white-space:nowrap;
  }
  .tabBtn.active{
    color:var(--gold); background:var(--bg1);
    border:1.5px solid var(--line); border-bottom:1.5px solid var(--bg1);
  }
  .tabBtn:active{ background:rgba(255,210,60,0.15); }

  /* ---- content ---- */
  #content{ flex:1 1 auto; overflow-y:auto; background:var(--bg1); padding:14px 14px 34px; }
  .fadeIn{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  h2.sectionTitle{
    margin:2px 0 10px; font-size:13px; letter-spacing:1px; color:var(--gold);
    border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  p.blurb{ font-size:11.5px; line-height:1.55; color:var(--dim); margin:0 0 14px; }

  /* ---- ticker ---- */
  #ticker{
    font-size:10px; color:var(--cyan); padding:5px 10px; background:rgba(74,208,255,0.08);
    border:1px solid rgba(74,208,255,0.3); border-radius:6px; margin-bottom:12px;
    display:flex; gap:8px; align-items:center;
  }
  #ticker .lbl{ color:var(--gold); font-weight:bold; }

  /* ---- timeline ---- */
  #timelineTrack{ display:flex; gap:0; overflow-x:auto; padding:6px 2px 18px; scrollbar-width:thin; }
  .eraNode{ flex:0 0 auto; width:118px; cursor:pointer; text-align:center; padding:0 6px; position:relative; }
  .eraNode .dot{
    width:14px; height:14px; border-radius:50%; background:var(--panel2);
    border:2px solid var(--gold-dim); margin:0 auto 6px; transition:transform .15s;
  }
  .eraNode.active .dot{ background:var(--gold); box-shadow:0 0 10px rgba(255,210,60,0.7); transform:scale(1.15); }
  .eraNode .years{ font-size:9.5px; color:var(--gold-dim); font-weight:bold; }
  .eraNode .label{ font-size:9.5px; color:var(--dim); margin-top:2px; line-height:1.3; }
  .eraNode.active .label{ color:var(--cream); }
  .eraNode:not(:last-child)::after{
    content:''; position:absolute; top:6px; left:calc(50% + 14px); width:calc(100% - 14px);
    height:2px; background:var(--line);
  }
  #eraDetail{
    background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:14px;
  }
  #eraDetail h3{ margin:0 0 4px; color:var(--gold); font-size:14px; }
  #eraDetail .years{ font-size:10px; color:var(--gold-dim); margin-bottom:10px; letter-spacing:0.5px; }
  #eraDetail p{ font-size:11.5px; line-height:1.6; color:var(--cream); margin:0 0 10px; }
  #eraDetail .who{ font-size:10.5px; color:var(--dim); }
  #eraDetail .who b{ color:var(--cyan); }

  /* ---- elements ---- */
  #elGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-bottom:14px; }
  .elCard{
    background:var(--panel); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 8px; text-align:center; cursor:pointer; transition:border-color .15s;
  }
  .elCard.active{ border-color:var(--gold); box-shadow:0 0 10px rgba(255,210,60,0.25); }
  .elCard .ic{ font-size:26px; }
  .elCard .nm{ font-size:10px; color:var(--cream); margin-top:6px; letter-spacing:0.5px; }
  #elDetail{ background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:14px; }
  #elDetail h3{ margin:0 0 8px; color:var(--gold); font-size:14px; }
  #elDetail p{ font-size:11.5px; line-height:1.6; color:var(--cream); margin:0 0 10px; }
  #elDetail .pios{ font-size:10.5px; color:var(--dim); margin-bottom:10px; }
  #elDetail .pios b{ color:var(--cyan); }
  #elDetail .fact{
    font-size:10.5px; color:var(--green); background:rgba(122,208,74,0.1);
    border:1px solid rgba(122,208,74,0.3); border-radius:6px; padding:8px 10px;
  }

  /* ---- break pad ---- */
  #breakPad{ margin-top:12px; background:var(--panel2); border:1.5px solid var(--line); border-radius:10px; padding:12px; }
  #breakPad .bpTitle{ font-size:11px; color:var(--gold); margin-bottom:8px; letter-spacing:0.5px; }
  .bpRow{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .bpRow .bpName{ width:44px; font-size:9.5px; color:var(--dim); flex:0 0 auto; }
  .bpSteps{ display:flex; gap:4px; flex:1 1 auto; }
  .bpStep{
    flex:1 1 auto; aspect-ratio:1/1; max-width:26px; border-radius:4px; cursor:pointer;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
  }
  .bpStep.on{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 6px rgba(255,210,60,0.6); }
  .bpStep.now{ outline:2px solid var(--cyan); }
  .bpControls{ display:flex; gap:8px; align-items:center; margin-top:10px; }
  .bpBtn{
    cursor:pointer; padding:7px 14px; font:bold 11px monospace; border-radius:8px;
    background:rgba(224,176,64,0.15); border:1.5px solid var(--gold-dim); color:var(--cream);
  }
  .bpBtn:active{ background:rgba(224,176,64,0.4); }
  .bpBtn.playing{ background:rgba(122,208,74,0.25); border-color:var(--green); }
  .bpHint{ font-size:9.5px; color:var(--dim); margin-top:8px; line-height:1.5; }

  /* ---- legends ---- */
  #legFilter{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filChip{
    font-size:9.5px; padding:5px 10px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--dim);
  }
  .filChip.active{ background:var(--gold); color:#1c1420; border-color:var(--gold); font-weight:bold; }
  #legGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .cardWrap{ perspective:800px; height:150px; cursor:pointer; }
  .cardInner{
    position:relative; width:100%; height:100%; transition:transform .5s;
    transform-style:preserve-3d;
  }
  .cardWrap.flipped .cardInner{ transform:rotateY(180deg); }
  .cardFace{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
    border:1.5px solid var(--line); padding:10px; display:flex; flex-direction:column;
  }
  .cardFront{ background:linear-gradient(160deg,var(--panel),var(--panel2)); align-items:center; justify-content:center; text-align:center; }
  .cardFront .av{ font-size:30px; }
  .cardFront .nm{ font-size:10.5px; color:var(--gold); margin-top:8px; font-weight:bold; }
  .cardFront .era{ font-size:9px; color:var(--dim); margin-top:2px; }
  .cardFront .tap{ font-size:8.5px; color:var(--cyan); margin-top:10px; }
  .cardBack{ background:var(--panel); transform:rotateY(180deg); overflow-y:auto; }
  .cardBack .nm{ font-size:10.5px; color:var(--gold); font-weight:bold; margin-bottom:4px; }
  .cardBack p{ font-size:9.5px; line-height:1.45; color:var(--cream); margin:0 0 6px; }
  .cardBack .ff{ font-size:9px; color:var(--green); }

  /* ---- quiz ---- */
  #quizWrap{ background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:16px; }
  #quizIntro .bpBtn{ margin-top:10px; }
  #quizStat{ display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-bottom:10px; }
  #quizStat b{ color:var(--gold); }
  #quizQ{ font-size:12.5px; color:var(--cream); line-height:1.5; margin-bottom:12px; }
  .qOpt{
    display:block; width:100%; text-align:left; padding:10px 12px; margin-bottom:8px;
    background:rgba(255,255,255,0.04); border:1.5px solid var(--line); border-radius:8px;
    color:var(--cream); font:11.5px monospace; cursor:pointer;
  }
  .qOpt:active{ background:rgba(255,255,255,0.1); }
  .qOpt.correct{ background:rgba(122,208,74,0.25); border-color:var(--green); }
  .qOpt.wrong{ background:rgba(224,72,88,0.25); border-color:var(--red); }
  #quizExplain{
    font-size:10.5px; color:var(--dim); background:rgba(255,255,255,0.03);
    border-radius:8px; padding:10px; margin-top:6px; line-height:1.5; display:none;
  }
  #quizResult{ text-align:center; }
  #quizResult .rank{ font-size:16px; color:var(--gold); margin:6px 0; }
  #quizResult .score{ font-size:12px; color:var(--cream); }
  #quizResult .best{ font-size:10px; color:var(--dim); margin-top:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="titleRow">
      <span class="mark">💽</span>
      <div>
        <h1>THE HIP HOP LIBRARY</h1>
        <div class="sub">an interactive history kiosk</div>
      </div>
    </div>
    <div id="tabs">
      <div class="tabBtn" data-tab="timeline">TIMELINE</div>
      <div class="tabBtn" data-tab="elements">5 ELEMENTS</div>
      <div class="tabBtn" data-tab="legends">HALL OF FAME</div>
      <div class="tabBtn" data-tab="quiz">TRIVIA</div>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
(function(){
'use strict';

/* ===================================================================
   DATA — every fact below is a short, original-wording summary, not
   copied text from any source. No lyrics, no quoted passages, no
   real photos: avatars are plain emoji/CSS, standing in for portraits.
=================================================================== */

var ERAS = [
  { years:'1973–1979', label:'Bronx Block\nParties', title:'The Bronx Block Party Era',
    body:'Hip hop traces its birth to August 11, 1973, at a back-to-school party in the rec room of 1520 Sedgwick Avenue in the Bronx, thrown by Cindy Campbell and hosted by her brother, DJ Kool Herc. Herc extended the instrumental "breaks" of funk and soul records by switching between two copies of the same record on twin turntables — the technique that became the rhythmic backbone of the whole culture. Dancers who specialized in that stretched-out break became known as b-boys and b-girls.',
    who:'<b>Key figures:</b> DJ Kool Herc, Cindy Campbell, Coke La Rock (an early party MC who hyped the crowd between records).' },
  { years:'1979–1983', label:'Hip Hop\nGoes on Wax', title:'Hip Hop Goes on Wax',
    body:'For years hip hop lived only at parties and park jams — nobody thought it belonged on a record. That changed in 1979 when "Rapper\'s Delight" by The Sugarhill Gang became a surprise crossover hit, introducing rap to a national and eventually global audience. In 1982, Grandmaster Flash and the Furious Five released "The Message," a stark, socially conscious track that proved rap could tackle serious subject matter, not just party rhymes.',
    who:'<b>Key figures:</b> The Sugarhill Gang, Grandmaster Flash & the Furious Five, Kurtis Blow.' },
  { years:'1983–1986', label:'Drum Machines\n& New School', title:'Drum Machines & the New School',
    body:'Affordable drum machines like the Roland TR-808 gave producers a punchy, programmable beat that didn\'t rely on live breaks, opening the door to a sparser, harder-hitting sound. Run-DMC fused rap with rock guitars and stripped-down beats, while acts on the young Def Jam label pushed the genre toward a leaner, more aggressive "new school" identity.',
    who:'<b>Key figures:</b> Run-DMC, LL Cool J, Beastie Boys, producer Rick Rubin.' },
  { years:'1986–1993', label:'The\nGolden Age', title:'The Golden Age',
    body:'Widely considered hip hop\'s creative peak, this stretch saw an explosion of styles: Public Enemy\'s dense, politically charged production; De La Soul and A Tribe Called Quest\'s jazz-sampling, playful "Native Tongues" sound; Eric B. & Rakim\'s complex, internal-rhyme lyricism; and Boogie Down Productions\' street-knowledge focus. Sampling technology (the E-mu SP-1200, the Akai MPC) let producers build entirely new tracks out of old vinyl breaks.',
    who:'<b>Key figures:</b> Public Enemy, Eric B. & Rakim, Boogie Down Productions (KRS-One), De La Soul, A Tribe Called Quest, Big Daddy Kane.' },
  { years:'1988–1995', label:'West Coast &\nGangsta Rap', title:'The West Coast & Gangsta Rap',
    body:'N.W.A\'s 1988 album "Straight Outta Compton" put unfiltered, first-person accounts of West Coast street life at the center of hip hop and ignited national controversy. Dr. Dre\'s smoothed-out, funk-sampling "G-funk" production style (heard on his 1992 solo album "The Chronic") became the dominant West Coast sound of the early-to-mid \'90s, launching Snoop Dogg into stardom.',
    who:'<b>Key figures:</b> N.W.A, Dr. Dre, Ice Cube, Snoop Dogg, Tupac Shakur.' },
  { years:'1994–1999', label:'Coastal Rise &\nMainstream Break', title:'Coastal Rivalries & the Mainstream Breakthrough',
    body:'The mid-\'90s brought hip hop\'s biggest commercial explosion yet, led by East Coast acts like The Notorious B.I.G. and Wu-Tang Clan and West Coast stars like Tupac Shakur — alongside a genuinely damaging, media-amplified "East Coast vs. West Coast" rivalry that ended in both Tupac\'s and Biggie\'s deaths in 1996 and 1997. Meanwhile Lauryn Hill, Missy Elliott, and Jay-Z (whose "Reasonable Doubt" dropped in 1996) helped push the genre toward greater artistic range and mainstream chart dominance.',
    who:'<b>Key figures:</b> The Notorious B.I.G., Tupac Shakur, Wu-Tang Clan, Jay-Z, Lauryn Hill, Missy Elliott, Nas.' },
  { years:'2000–2006', label:'The South\nRises', title:'The South Rises / the Bling Era',
    body:'Southern hip hop moved from regional scene to national force: Atlanta\'s crunk sound (Lil Jon & the East Side Boyz), the Dirty South of OutKast (whose "Stankonia" and "Speakerboxxx/The Love Below" were massive crossover successes), Houston\'s slowed-down screwed-and-chopped style, and a wave of flashy, celebratory "bling era" mainstream rap defined the sound of the early 2000s.',
    who:'<b>Key figures:</b> OutKast, Lil Jon, UGK, Ludacris, 50 Cent.' },
  { years:'2005–2012', label:'Blogs &\nMixtapes', title:'The Blog Era & Mixtape Culture',
    body:'Free mixtapes, MP3 blogs, and early social platforms (MySpace, then LimeWire-era file sharing) let artists build huge followings completely outside the traditional record-label system. Lil Wayne\'s prolific "Tha Carter" mixtape run and Kanye West\'s genre-blending albums (from "The College Dropout" through "My Beautiful Dark Twisted Fantasy") reshaped what a rap career — and a rap beat — could sound like.',
    who:'<b>Key figures:</b> Lil Wayne, Kanye West, Drake (who broke out via mixtapes before signing a label deal), J. Cole.' },
  { years:'2013–Present', label:'Streaming &\nGlobal Hip Hop', title:'Streaming, SoundCloud & Global Hip Hop',
    body:'Streaming platforms and SoundCloud flattened the path from bedroom studio to global audience, birthing a wave of DIY "SoundCloud rap" artists alongside genre-blurring superstars like Kendrick Lamar (whose socially engaged albums earned hip hop its first Pulitzer Prize in 2018) and Cardi B. Hip hop is now the most consumed music genre in the United States and a dominant global sound, with thriving regional scenes on every continent.',
    who:'<b>Key figures:</b> Kendrick Lamar, Cardi B, Travis Scott, Chance the Rapper.' }
];

var ELEMENTS = [
  { icon:'🎧', name:'DJing', summary:'The original engine of hip hop: using two turntables and a mixer to loop, extend, and blend the "break" — the short instrumental section of a record where the drums cut loose — so dancers had something to dance to for minutes instead of seconds.',
    pios:'<b>Pioneers:</b> DJ Kool Herc (breakbeat looping), Grandmaster Flash (the quick-mix theory & scratch techniques), Grand Wizzard Theodore (credited with inventing the scratch, reportedly by accident around age 13).',
    fact:'Fun fact: DJs often soaked the labels off their most valuable breakbeat records, or swapped in fake labels, so rival DJs digging through the crate next to them couldn\'t identify — and steal — their secret weapon.' },
  { icon:'🎤', name:'MCing', summary:'Short for "Master of Ceremonies." What began as a DJ\'s hype-man shouting encouragement over the breakbeat evolved into rapping itself — rhythmic, rhyming spoken word that became the genre\'s lead voice.',
    pios:'<b>Pioneers:</b> Coke La Rock (widely cited as one of the first hip hop MCs), Melle Mel of the Furious Five (an early master of complex rhyme schemes), Kurtis Blow (one of the first solo rap stars).',
    fact:'Fun fact: early MCs mostly hyped the crowd and the DJ ("throw your hands in the air") — story-driven, personality-driven rapping as we know it today took several more years to develop.' },
  { icon:'🕺', name:'Breaking', summary:'Also called b-boying/b-girling (never "breakdancing" to purists) — an acrobatic, athletic dance style built around the "break" in a record, featuring top-rock footwork, floor-based power moves, and freezes.',
    pios:'<b>Pioneers:</b> Crews like Rock Steady Crew and the Zulu Kings helped take breaking from Bronx parks to global stages and eventually competitive battles.',
    fact:'Fun fact: breaking became so globally established as a dance and sport that it was added as an official Olympic event for the first time at the Paris 2024 Games.' },
  { icon:'🎨', name:'Graffiti Art', summary:'Spray-painted lettering and murals, especially on New York City subway cars in the 1970s and \'80s, that turned city walls and trains into a moving, citywide gallery — and a way for writers to get their name (their "tag") seen everywhere.',
    pios:'<b>Pioneers:</b> Early NYC writers like TAKI 183 helped kick off the tagging craze; later, whole-car "masterpieces" pushed the style into elaborate, colorful lettering (called "wildstyle").',
    fact:'Fun fact: TAKI 183 (a Greek-American teen from Washington Heights) got a 1971 New York Times profile for his ubiquitous tag — one of the first times graffiti writing got mainstream media attention.' },
  { icon:'📚', name:'Knowledge', summary:'Often called hip hop\'s fifth element: the self-awareness, history, and social consciousness that ties the other four together — the idea that the culture is also a source of identity, education, and community uplift, not just entertainment.',
    pios:'<b>Popularized by:</b> Afrika Bambaataa, founder of the Zulu Nation, who explicitly framed hip hop as a movement for peace, unity, and self-improvement in a period of NYC gang violence.',
    fact:'Fun fact: Afrika Bambaataa named the culture itself — he\'s widely credited with popularizing the term "hip hop" to describe the whole movement, not just the music.' }
];

var LEGENDS = [
  { tag:'DJing', av:'🎧', nm:'DJ Kool Herc', era:'b. 1955', bio:'Jamaican-born Bronx DJ whose 1973 back-to-school party is considered hip hop\'s founding moment. Pioneered looping the instrumental "break" with two copies of the same record.', ff:'Often called the "Father of Hip Hop."' },
  { tag:'DJing', av:'🎛️', nm:'Grandmaster Flash', era:'b. 1958', bio:'Bronx DJ who engineered the "quick-mix theory," letting DJs cut seamlessly between two records in perfect rhythm. Formed the Furious Five with a rotating cast of MCs.', ff:'Inducted into the Rock & Roll Hall of Fame in 2007 — hip hop\'s first inductee.' },
  { tag:'Knowledge', av:'☮️', nm:'Afrika Bambaataa', era:'b. 1957', bio:'Former Bronx gang member turned DJ and community organizer who founded the Zulu Nation, an organization using hip hop culture to steer youth away from gang violence.', ff:'His 1982 track "Planet Rock" fused hip hop with electronic and Kraftwerk-inspired sounds.' },
  { tag:'MCing', av:'🎤', nm:'Melle Mel', era:'b. 1961', bio:'Member of the Furious Five known for dense, athletic rhyme patterns. Co-wrote and performed the socially conscious 1982 landmark "The Message."', ff:'One of the first rappers to describe himself on record as an "MC."' },
  { tag:'MCing', av:'👑', nm:'Queen Latifah', era:'b. 1970', bio:'New Jersey MC whose 1989 debut championed self-respect and female empowerment in a male-dominated genre, opening doors for a generation of women in hip hop.', ff:'Went on to a decorated acting and producing career, including an Oscar nomination.' },
  { tag:'MCing', av:'🐝', nm:'MC Lyte', era:'b. 1970', bio:'Brooklyn MC and one of the first solo female rappers to release a full album (1988\'s "Lyte as a Rock"), known for sharp battle-rap lyricism.', ff:'The first female solo rapper to achieve a gold-certified single.' },
  { tag:'Breaking', av:'🕺', nm:'Rock Steady Crew', era:'formed 1977', bio:'One of the most influential b-boy/b-girl crews, formed in the Bronx and later based in Manhattan, who helped bring breaking to stages, films, and eventually the world.', ff:'Their 1983 track "(Hey You) The Rock Steady Crew" became a surprise pop hit.' },
  { tag:'Graffiti', av:'🖍️', nm:'TAKI 183', era:'active early 1970s', bio:'Greek-American teenager from Washington Heights whose subway tag was so widespread it earned a 1971 profile in The New York Times, helping ignite the citywide tagging craze.', ff:'His tag combined his name "Demetrius" (nicknamed Taki) with his street number, 183rd.' },
  { tag:'MCing', av:'💥', nm:'Public Enemy', era:'formed 1985', bio:'Long Island group led by Chuck D and Flavor Flav, famous for dense, layered production and unapologetically political lyrics that pushed rap into new territory.', ff:'Chuck D once described rap music as "the CNN of Black America."' },
  { tag:'MCing', av:'🅰️', nm:'Rakim', era:'b. 1968', bio:'One half of Eric B. & Rakim, widely credited with revolutionizing rap lyricism through internal rhyme, complex multisyllabic patterns, and a laid-back, jazz-influenced flow.', ff:'Frequently cited by later rappers as the single biggest influence on modern rhyme technique.' },
  { tag:'MCing', av:'💿', nm:'N.W.A', era:'formed 1986', bio:'Compton group (Eazy-E, Dr. Dre, Ice Cube, MC Ren, DJ Yella) whose blunt, first-person street narratives on 1988\'s "Straight Outta Compton" made West Coast gangsta rap a national phenomenon.', ff:'The group\'s name and lyrics sparked national controversy, including attention from the FBI.' },
  { tag:'DJing', av:'🎚️', nm:'Dr. Dre', era:'b. 1965', bio:'N.W.A member turned solo artist and producer who defined the smooth, funk-sampling "G-funk" sound of early-\'90s West Coast rap, and later became a hit-making producer for a generation of artists.', ff:'Co-founded Death Row Records, then later Aftermath Entertainment and Beats Electronics.' },
  { tag:'MCing', av:'🌹', nm:'Tupac Shakur', era:'1971–1996', bio:'One of the best-selling and most influential rappers ever, known for blending raw street storytelling with poetic vulnerability and social commentary.', ff:'Studied poetry and acting at the Baltimore School for the Arts before becoming a rapper.' },
  { tag:'MCing', av:'👑', nm:'The Notorious B.I.G.', era:'1972–1997', bio:'Brooklyn MC celebrated for his vivid, novelistic storytelling and effortless-sounding flow, whose 1994 debut "Ready to Die" is regarded as one of hip hop\'s greatest albums.', ff:'Born Christopher Wallace, he grew up just blocks from where he\'d later record his biggest hits.' },
  { tag:'Knowledge', av:'⚔️', nm:'Wu-Tang Clan', era:'formed 1992', bio:'Nine-member Staten Island collective built around gritty, kung-fu-film-inspired production and complex lyrical chemistry, who pioneered launching solo careers for every member from one crew.', ff:'Their business model — one crew signed as a group, members free to sign solo deals elsewhere — was unheard of at the time.' },

var content = document.getElementById('content');

function el(tag, cls, html){

}

function renderTicker(){

/* ---------------- TIMELINE TAB ---------------- */

/* ---- tiny WebAudio breakbeat pad — no samples, just oscillators/noise ---- */
var audioCtx = null;
function ac(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playKick(t){
  var c = ac(); var o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
}
function playSnare(t){
  var c = ac(); var bufSize = c.sampleRate * 0.15;
  var buf = c.createBuffer(1, bufSize, c.sampleRate);
  var data = buf.getChannelData(0);
  for (var i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
  var noise = c.createBufferSource(); noise.buffer = buf;
  var g = c.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
  noise.connect(hp); hp.connect(g); g.connect(c.destination); noise.start(t); noise.stop(t + 0.15);
}
function playHat(t){
  var c = ac(); var bufSize = c.sampleRate * 0.05;
  var buf = c.createBuffer(1, bufSize, c.sampleRate);
  var data = buf.getChannelData(0);
  for (var i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
  var noise = c.createBufferSource(); noise.buffer = buf;
  var g = c.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  noise.connect(hp); hp.connect(g); g.connect(c.destination); noise.start(t); noise.stop(t + 0.05);
}
function playScratch(t){
  var c = ac(); var o = c.createOscillator(), g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(320, t); o.frequency.linearRampToValueAtTime(140, t + 0.09);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.12);
}
var BP_LANES = [
  { name:'KICK', fn:playKick, pattern:[1,0,0,0,1,0,0,0] },
  { name:'SNARE', fn:playSnare, pattern:[0,0,1,0,0,0,1,0] },
  { name:'HI-HAT', fn:playHat, pattern:[1,1,1,1,1,1,1,1] },
  { name:'SCRATCH', fn:playScratch, pattern:[0,0,0,0,0,0,0,0] }
];
var bpPlaying = false, bpStepIdx = 0, bpTimer = null;

function buildBreakPad(){
  var box = el('div'); box.id = 'breakPad';
  box.innerHTML = '<div class="bpTitle">🔁 THE BREAKBEAT PAD — build your own loop</div>';
  BP_LANES.forEach(function(lane, li){
    var row = el('div', 'bpRow');
    row.appendChild(el('div', 'bpName', lane.name));
    var steps = el('div', 'bpSteps');
    lane.pattern.forEach(function(v, si){
      var s = el('div', 'bpStep' + (v ? ' on' : ''));
      s.dataset.lane = li; s.dataset.step = si;
      s.onclick = function(){
        lane.pattern[si] = lane.pattern[si] ? 0 : 1;
        s.classList.toggle('on');
      };
      steps.appendChild(s);
    });
    row.appendChild(steps);
    box.appendChild(row);
  });
  var ctrl = el('div', 'bpControls');
  var playBtn = el('div', 'bpBtn', '▶ PLAY LOOP');
  playBtn.onclick = function(){ toggleBreakPad(playBtn); };
  ctrl.appendChild(playBtn);
  box.appendChild(ctrl);
  box.appendChild(el('div', 'bpHint', 'This is the same basic idea DJ Kool Herc pioneered: loop a break, layer sounds on top, keep the floor moving. Tap the squares to build your own beat.'));
  return box;
}
function toggleBreakPad(btn){
  if (bpPlaying){
    bpPlaying = false; clearInterval(bpTimer); btn.textContent = '▶ PLAY LOOP'; btn.classList.remove('playing');
    document.querySelectorAll('.bpStep.now').forEach(function(n){ n.classList.remove('now'); });
    return;
  }
  bpPlaying = true; bpStepIdx = 0; btn.textContent = '■ STOP'; btn.classList.add('playing');
  var stepMs = 220;
  bpTimer = setInterval(function(){
    document.querySelectorAll('.bpStep.now').forEach(function(n){ n.classList.remove('now'); });
    var t = ac().currentTime + 0.02;
    BP_LANES.forEach(function(lane, li){
      if (lane.pattern[bpStepIdx]) lane.fn(t);
      var cell = document.querySelector('.bpStep[data-lane="' + li + '"][data-step="' + bpStepIdx + '"]');
      if (cell) cell.classList.add('now');
    });
    bpStepIdx = (bpStepIdx + 1) % 8;
  }, stepMs);
}

/* ---------------- QUIZ TAB ---------------- */
var QUIZ_HS_KEY = 'hiphopLibraryQuizBest';
function getBestScore(){ try{ return parseInt(localStorage.getItem(QUIZ_HS_KEY) || '0', 10); }catch(e){ return 0; } }
function setBestScore(v){ try{ localStorage.setItem(QUIZ_HS_KEY, String(v)); }catch(e){} }

function rankForScore(score, total){
  var pct = score / total;
  if (pct === 1) return 'Certified Crate Digger — Perfect Score!';
  if (pct >= 0.8) return 'Old-School Historian';
  if (pct >= 0.6) return 'Solid Student of the Culture';
  if (pct >= 0.4) return 'Just Getting Into the Crates';
  return 'Fresh Ears — Keep Studying!';
}

function renderQuiz(){
  content.innerHTML = '';
  var wrap = el('div', 'fadeIn');
  wrap.appendChild(el('h2', 'sectionTitle', 'HIP HOP TRIVIA'));

  var qw = el('div'); qw.id = 'quizWrap';

  if (!quizStarted){
    var intro = el('div'); intro.id = 'quizIntro';
    intro.innerHTML = '<p class="blurb">' + QUIZ.length + ' questions on the history you just explored. Best score so far: <b style="color:var(--gold)">' + getBestScore() + '/' + QUIZ.length + '</b></p>';
    var startBtn = el('div', 'bpBtn', '▶ START QUIZ');
    startBtn.onclick = function(){ quizStarted = true; quizIdx = 0; quizScore = 0; quizAnswered = false; renderQuiz(); };
    intro.appendChild(startBtn);
    qw.appendChild(intro);
    wrap.appendChild(qw);
    content.appendChild(wrap);
    return;
  }

  if (quizIdx >= QUIZ.length){
    if (quizScore > getBestScore()) setBestScore(quizScore);
    var res = el('div'); res.id = 'quizResult';
    res.innerHTML = '<div class="rank">' + rankForScore(quizScore, QUIZ.length) + '</div>' +
      '<div class="score">You scored ' + quizScore + ' / ' + QUIZ.length + '</div>' +
      '<div class="best">Best: ' + getBestScore() + ' / ' + QUIZ.length + '</div>';
    var again = el('div', 'bpBtn', '↻ PLAY AGAIN'); again.style.marginTop = '14px';
    again.onclick = function(){ quizStarted = false; renderQuiz(); };
    res.appendChild(again);
    qw.appendChild(res);
    wrap.appendChild(qw);
    content.appendChild(wrap);
    return;
  }

  var q = QUIZ[quizIdx];
  var stat = el('div'); stat.id = 'quizStat';
  stat.innerHTML = '<span>Question <b>' + (quizIdx+1) + '</b> / ' + QUIZ.length + '</span><span>Score: <b>' + quizScore + '</b></span>';
  qw.appendChild(stat);
  qw.appendChild(el('div', null, '<div id="quizQ">' + q.q + '</div>'));

  var explainEl = el('div'); explainEl.id = 'quizExplain'; explainEl.textContent = q.ex;

  q.opts.forEach(function(opt, i){
    var b = el('div', 'qOpt', opt);
    b.onclick = function(){
      if (quizAnswered) return;
      quizAnswered = true;
      var opts = qw.querySelectorAll('.qOpt');
      opts[q.a].classList.add('correct');
      if (i !== q.a) b.classList.add('wrong'); else quizScore++;
      explainEl.style.display = 'block';
      var nextBtn = el('div', 'bpBtn', quizIdx === QUIZ.length - 1 ? 'SEE RESULTS →' : 'NEXT →');
      nextBtn.style.marginTop = '12px';
      nextBtn.onclick = function(){ quizIdx++; quizAnswered = false; renderQuiz(); };
      qw.appendChild(nextBtn);
      if (i === q.a){ try{ playHat(ac().currentTime); playHat(ac().currentTime+0.09);}catch(e){} }
    };
    qw.appendChild(b);
  });
  qw.appendChild(explainEl);

  wrap.appendChild(qw);
  content.appendChild(wrap);
}

/* ---------------- TAB SWITCHING ---------------- */
var TAB_RENDER = { timeline: renderTimeline, elements: renderElements, legends: renderLegends, quiz: renderQuiz };
function setTab(t){
  activeTab = t;
  document.querySelectorAll('.tabBtn').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === t);
  });
  if (bpPlaying){ bpPlaying = false; clearInterval(bpTimer); }
  TAB_RENDER[t]();
}
document.querySelectorAll('.tabBtn').forEach(function(b){
  b.addEventListener('click', function(){ setTab(b.dataset.tab); });
});

setTab('timeline');
})();
