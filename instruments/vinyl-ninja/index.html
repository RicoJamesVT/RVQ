  :root{
    --ink: #0a0a0d;
    --ink-2: #131318;
    --paper: #eee8de;
    --hot: #ff2e63;
    --cyan: #08d9d6;
    --gold: #f2c14e;
    --line: rgba(238,232,222,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--paper);
  }

  #stage { position: fixed; inset: 0; }
  #trail { position: fixed; inset: 0; z-index: 5; pointer-events: none; }

  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 22px;
    z-index: 10;
    pointer-events: none;
  }
  #scoreWrap { display:flex; flex-direction:column; line-height:1; }
  #scoreLabel { font-size: 11px; color: rgba(238,232,222,0.55); letter-spacing:0.08em; }
  #score { font-family:'Bebas Neue',sans-serif; font-size: 44px; color: var(--gold); text-shadow: 0 0 18px rgba(242,193,78,0.35); }
  #combo {
    font-family:'Bebas Neue',sans-serif; font-size: 20px; color: var(--hot);
    opacity: 0; transform: translateY(4px);
    transition: opacity .15s ease, transform .15s ease;
    text-shadow: 0 0 12px rgba(255,46,99,0.6);
  }
  #combo.show { opacity: 1; transform: translateY(0); }

  #lives { display:flex; gap:7px; margin-top:6px; }
  .life {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3f, #0c0c0f 70%);
    border: 2px solid var(--paper);
    position: relative;
    transition: opacity .3s ease, transform .3s ease;
  }
  .life::after{
    content:''; position:absolute; inset:6px; border-radius:50%;
    background: var(--gold);
  }
  .life.lost { opacity: 0.15; transform: scale(0.7); background: transparent; }
  .life.lost::after{ background: transparent; border: 1px solid rgba(238,232,222,0.3); }

  #best { font-size: 11px; color: rgba(238,232,222,0.45); margin-top: 4px; text-align:right; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,46,99,0.10), transparent 60%), rgba(6,6,8,0.86);
    backdrop-filter: blur(2px);
  }
  .panel { text-align: center; padding: 32px 28px; max-width: 440px; width: 88vw; }
  .kicker { font-size: 12px; letter-spacing: 0.16em; color: var(--cyan); margin-bottom: 6px; }
  .title-xl {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 13vw, 92px);
    line-height: 0.9;
    background: linear-gradient(180deg, var(--paper) 30%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 6px 0;
  }
  .subtitle { color: rgba(238,232,222,0.65); font-size: 15px; margin-bottom: 26px; line-height:1.5; }
  .subtitle b { color: var(--paper); font-weight: 700; }
  .subtitle .warn { color: var(--hot); font-weight: 700; }

  .btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; letter-spacing: 0.04em;
    background: var(--hot); color: #1a0509;
    border: none; padding: 14px 42px; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,46,99,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(0.95); box-shadow: 0 4px 14px rgba(255,46,99,0.3); }

  .statsRow { display:flex; justify-content:center; gap: 34px; margin: 22px 0 28px; }
  .stat { display:flex; flex-direction:column; }
  .stat .n { font-family:'Bebas Neue',sans-serif; font-size: 38px; color: var(--gold); line-height:1; }
  .stat .l { font-size: 10px; letter-spacing:0.1em; color: rgba(238,232,222,0.5); margin-top:4px; }

  .hidden { display: none !important; }

  #startHint {
    position:absolute; bottom: 26px; left:0; right:0; text-align:center;
    font-size: 12px; color: rgba(238,232,222,0.4); z-index: 10;
    pointer-events:none;
  }

  #flash {
    position: fixed; inset: 0; background: var(--hot); opacity: 0;
    pointer-events: none; z-index: 30; mix-blend-mode: screen;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<canvas id="trail"></canvas>
<div id="flash"></div>

<div id="hud" class="hidden">
  <div id="scoreWrap">
    <span id="scoreLabel">SCORE</span>
    <span id="score">0</span>
    <span id="combo">×2 COMBO</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:flex-end;">
    <div id="lives"></div>
    <span id="best">BEST 0</span>
  </div>
</div>

<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="kicker">A CRATE-DIGGER'S NIGHTMARE</div>
    <h1 class="title-xl">VINYL<br>NINJA</h1>
    <p class="subtitle">Swipe to smash the records before they drop.<br>
      Miss <b>3</b> and the set's over. Slice a <span class="warn">bomb</span> and it ends right now.</p>
    <button class="btn" id="startBtn">DROP THE NEEDLE</button>
  </div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <div class="panel">
    <div class="kicker" id="goKicker">SET OVER</div>
    <h1 class="title-xl" id="goTitle">WIPEOUT</h1>
    <div class="statsRow">
      <div class="stat"><span class="n" id="finalScore">0</span><span class="l">SCORE</span></div>
      <div class="stat"><span class="n" id="finalBest">0</span><span class="l">BEST</span></div>
    </div>
    <button class="btn" id="retryBtn">SPIN AGAIN</button>
  </div>
</div>

<div id="startHint" class="hidden">swipe fast, chain slices for combos</div>

<!-- Same vendored lib/three.min.js (r128) the rest of the game already
     ships and lazy-loads elsewhere -- see loadThreeJS()/lib/three.min.js
     in game.js. Referenced with a relative path (two levels up from
     instruments/vinyl-ninja/) so this page needs no network access and
     works identically from file://, a bundled app shell, or a normal
     web server. -->
<script src="../../lib/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   SETUP
============================================================ */
const stageCanvas = document.getElementById('stage');
const trailCanvas = document.getElementById('trail');
const tctx = trailCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: stageCanvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0d);
scene.fog = new THREE.Fog(0x0a0a0d, 20, 46);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 17);
camera.lookAt(0, 0, 0);

// visible world extents at z = 0 (camera has zero rotation on x/y, so this is exact)
let VW = 0, VH = 0;
function updateViewport(){
  const dist = camera.position.z;
  VH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * dist;
  VW = VH * camera.aspect;
}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  trailCanvas.width = w * (window.devicePixelRatio || 1);
  trailCanvas.height = h * (window.devicePixelRatio || 1);
  trailCanvas.style.width = w + 'px';
  trailCanvas.style.height = h + 'px';
  tctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  updateViewport();
}
window.addEventListener('resize', resize);

/* ============================================================
   LIGHTING + STAGE DRESSING
============================================================ */
scene.add(new THREE.AmbientLight(0x8888aa, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(5, 8, 10);
scene.add(key);

const rim1 = new THREE.PointLight(0xff2e63, 2.2, 40, 2);
rim1.position.set(-9, 4, 6);
scene.add(rim1);

const rim2 = new THREE.PointLight(0x08d9d6, 2.0, 40, 2);
rim2.position.set(9, -3, 6);
scene.add(rim2);

// soft floor glow disc far behind, purely atmospheric
const glowGeo = new THREE.CircleGeometry(14, 48);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x1a1024, transparent: true, opacity: 0.6 });
const glow = new THREE.Mesh(glowGeo, glowMat);
glow.position.z = -14;
scene.add(glow);

// drifting dust particles for depth
const dustCount = 90;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3]   = (Math.random() - 0.5) * 30;
  dustPos[i*3+1] = (Math.random() - 0.5) * 20;
  dustPos[i*3+2] = -Math.random() * 12 - 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.35 });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

/* ============================================================
   TEXTURES (procedural, canvas-based)
============================================================ */
function makeVinylLabelTexture(labelColor, ringColor, text){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size/2, cy = size/2, R = size/2;

  // black disc body with subtle groove rings
  g.fillStyle = '#0c0c0e';
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();

  g.strokeStyle = 'rgba(255,255,255,0.045)';
  g.lineWidth = 1.4;
  for (let r = R*0.34; r < R*0.99; r += 5.5) {
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.stroke();
  }
  // slight sheen arc
  const sheen = g.createLinearGradient(0,0,size,size);
  sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
  sheen.addColorStop(0.35, 'rgba(255,255,255,0)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();

  // label
  const labelR = R * 0.34;
  g.fillStyle = ringColor;
  g.beginPath(); g.arc(cx, cy, labelR + 6, 0, Math.PI*2); g.fill();
  g.fillStyle = labelColor;
  g.beginPath(); g.arc(cx, cy, labelR, 0, Math.PI*2); g.fill();

  // label text, curved-ish (simple two lines)
  g.fillStyle = 'rgba(10,10,10,0.85)';
  g.textAlign = 'center';
  g.font = '700 30px Space Grotesk, sans-serif';
  g.fillText(text, cx, cy - 6);
  g.font = '500 13px Space Grotesk, sans-serif';
  g.fillText('33⅓ RPM', cx, cy + 16);

  // center hole
  g.fillStyle = '#0a0a0d';
  g.beginPath(); g.arc(cx, cy, R*0.045, 0, Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

function makeVinylBackTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size/2, cy = size/2, R = size/2;
  g.fillStyle = '#0c0c0e';
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.04)';
  g.lineWidth = 1.2;
  for (let r = R*0.34; r < R*0.99; r += 5.5) {
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.stroke();
  }
  g.fillStyle = '#141416';
  g.beginPath(); g.arc(cx, cy, R*0.32, 0, Math.PI*2); g.fill();
  g.fillStyle = '#0a0a0d';
  g.beginPath(); g.arc(cx, cy, R*0.045, 0, Math.PI*2); g.fill();
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function makeBombLabelTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size/2, cy = size/2, R = size/2;

  g.fillStyle = '#0c0505';
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();

  // hazard stripes near rim
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2);
  g.beginPath(); g.arc(cx, cy, R*0.9, 0, Math.PI*2, true);
  g.clip('evenodd');
  g.fillStyle = '#1a0304';
  g.fillRect(0,0,size,size);
  g.fillStyle = '#ffb020';
  g.translate(cx, cy);
  for (let a = 0; a < Math.PI*2; a += Math.PI/10) {
    g.rotate(Math.PI/10);
    g.fillRect(-6, -R, 12, R*0.2);
  }
  g.restore();

  // label
  const labelR = R * 0.4;
  g.fillStyle = '#3a0507';
  g.beginPath(); g.arc(cx, cy, labelR + 6, 0, Math.PI*2); g.fill();
  g.fillStyle = '#ff2e63';
  g.beginPath(); g.arc(cx, cy, labelR, 0, Math.PI*2); g.fill();

  g.fillStyle = '#1a0509';
  g.textAlign = 'center';
  g.font = '800 34px Space Grotesk, sans-serif';
  g.fillText('BOMB', cx, cy - 4);
  g.font = '700 13px Space Grotesk, sans-serif';
  g.fillText('DO NOT SLICE', cx, cy + 18);

  g.fillStyle = '#0a0a0d';
  g.beginPath(); g.arc(cx, cy, R*0.045, 0, Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(c);
  return tex;
}

const LABEL_SETS = [

/* ============================================================
   GEOMETRY
============================================================ */
const RECORD_R = 1.35;
const RECORD_THICK = 0.09;
const recordGeo = new THREE.CylinderGeometry(RECORD_R, RECORD_R, RECORD_THICK, 64, 1, false);

function buildRecordMesh(variantIndex){
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.35, metalness: 0.2 });
  const topMat = new THREE.MeshStandardMaterial({ map: labelTextures[variantIndex], roughness: 0.32, metalness: 0.25 });
  const botMat = new THREE.MeshStandardMaterial({ map: backTexture, roughness: 0.4, metalness: 0.15 });
  const mesh = new THREE.Mesh(recordGeo, [sideMat, topMat, botMat]);
  mesh.castShadow = false;
  return mesh;
}

function buildBombMesh(){
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x120404, roughness: 0.3, metalness: 0.3, emissive: 0x330000, emissiveIntensity: 0.4 });
  const topMat = new THREE.MeshStandardMaterial({ map: bombTexture, roughness: 0.3, metalness: 0.3, emissive: 0x220000, emissiveIntensity: 0.5 });
  const botMat = new THREE.MeshStandardMaterial({ map: bombTexture, roughness: 0.3, metalness: 0.3, emissive: 0x220000, emissiveIntensity: 0.5 });
  const group = new THREE.Group();
  const disc = new THREE.Mesh(recordGeo, [sideMat, topMat, botMat]);
  group.add(disc);
  // little fuse spark light handled via flicker in update loop
  return group;
}

/* ============================================================
   AUDIO (synthesized, no assets)
============================================================ */
let actx = null;
function ensureAudio(){
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function playSlice(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const bufferSize = actx.sampleRate * 0.18;
  const buf = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2.2);
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.setValueAtTime(1800, t0);
  filt.frequency.exponentialRampToValueAtTime(400, t0 + 0.16);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.5, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  src.connect(filt).connect(gain).connect(actx.destination);
  src.start(t0);
}
function playBomb(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const bufferSize = actx.sampleRate * 0.6;
  const buf = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.3);
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(2200, t0);
  filt.frequency.exponentialRampToValueAtTime(80, t0 + 0.55);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.9, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
  src.connect(filt).connect(gain).connect(actx.destination);
  src.start(t0);

  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t0);
  osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.4);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.6, t0);
  og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
  osc.connect(og).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + 0.46);
}
function playMiss(){
  if (!actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(300, t0);
  osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.22);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.24);
  osc.connect(g).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + 0.25);
}

/* ============================================================
   SLICING — clipping-plane halves
============================================================ */
function cloneMaterialsWithClip(mesh, plane){
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  return mats.map(m => {
    const c = m.clone();
    c.clippingPlanes = [plane];
    c.clipShadows = true;
    return c;
  });
}

function sliceObject(obj, swipeDirWorld, hitPoint){
  obj.sliced = true;
  scene.remove(obj.mesh);

  if (obj.isBomb) return; // bomb handled by caller (game over), no pieces

  const normal = new THREE.Vector3(-swipeDirWorld.y, swipeDirWorld.x, 0).normalize();
  if (normal.lengthSq() < 0.0001) normal.set(1,0,0);

  const basePos = obj.mesh.position.clone();
  const baseRotZ = obj.mesh.rotation.z || 0;

  const planeA = new THREE.Plane(normal.clone(), 0);
  const planeB = new THREE.Plane(normal.clone().negate(), 0);

  const geo = recordGeo;
  const srcMats = obj.mesh.material;

  for (let side = 0; side < 2; side++) {
    const plane = side === 0 ? planeA : planeB;
    const g = geo; // shared geometry, clipping done via material planes in local->world; we set plane in world space each frame instead
    const mats = srcMats.map(m => {
      const c = m.clone();
      c.clippingPlanes = [plane];
      return c;
    });
    const m = new THREE.Mesh(g, mats);
    m.position.copy(basePos);
    m.rotation.copy(obj.mesh.rotation);
    scene.add(m);

    const outward = normal.clone().multiplyScalar(side === 0 ? 1 : -1);
    pieces.push({
      mesh: m,
      plane,
      planeOffset: 0,
      normal: normal.clone().multiplyScalar(side === 0 ? 1 : -1),
      vx: obj.vx * 0.4 + outward.x * (2.6 + Math.random()*1.4),
      vy: Math.max(obj.vy * 0.5, 1.5) + Math.random()*1.5,
      vz: outward.z + (Math.random()-0.5),
      spin: (Math.random()-0.5) * 10,
      life: 0,
      maxLife: 1.05 + Math.random()*0.3,
    });
  }

  spawnBurst(basePos, normal);
}

function updatePlaneForPiece(p, dt){
  // plane's constant needs to track the piece's world position so the cut
  // stays anchored to the mesh as it moves (plane is defined in world space)
  p.plane.constant = -p.normal.dot(p.mesh.position) + 0.02;
}

/* ---------- tiny particle burst on slice ---------- */

/* ============================================================
   POINTER / SWIPE TRAIL + HIT TESTING
============================================================ */
let trailPts = [];        // {x,y,t} in CSS pixels, for drawing
let activeStrokeHits = new Set();
let pointerDown = false;

function screenToWorld(px, py){
  const nx = (px / window.innerWidth) * 2 - 1;
  const ny = -(py / window.innerHeight) * 2 + 1;
  return new THREE.Vector2( nx * VW/2, ny * VH/2 );
}

function distToSegment(p, a, b){
  const abx = b.x - a.x, aby = b.y - a.y;
  const apx = p.x - a.x, apy = p.y - a.y;
  const ab2 = abx*abx + aby*aby;
  let t = ab2 > 0 ? (apx*abx + apy*aby) / ab2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = a.x + abx*t, cy = a.y + aby*t;
  const dx = p.x - cx, dy = p.y - cy;
  return Math.sqrt(dx*dx + dy*dy);
}

function handleMove(px, py){
  const now = performance.now();
  trailPts.push({ x: px, y: py, t: now });
  while (trailPts.length > 14) trailPts.shift();

  if (!running || trailPts.length < 2) return;
  const a2 = trailPts[trailPts.length - 2];
  const b2 = trailPts[trailPts.length - 1];
  if (b2.t - a2.t > 120) return; // stale jump, skip hit test on this segment

  const wa = screenToWorld(a2.x, a2.y);
  const wb = screenToWorld(b2.x, b2.y);
  const dirWorld = new THREE.Vector2(wb.x - wa.x, wb.y - wa.y);
  if (dirWorld.lengthSq() < 0.0001) return;
  dirWorld.normalize();

  for (const obj of objects) {
    if (obj.sliced || activeStrokeHits.has(obj)) continue;
    const p = new THREE.Vector2(obj.mesh.position.x, obj.mesh.position.y);
    const d = distToSegment(p, wa, wb);
    if (d < obj.radius * 0.95) {
      activeStrokeHits.add(obj);
      registerHit(obj, new THREE.Vector3(dirWorld.x, dirWorld.y, 0), obj.mesh.position);
    }
  }
}

function registerHit(obj, dirWorld, hitPoint){
  if (obj.isBomb) {
    explodeBomb(obj.mesh.position.clone());
    scene.remove(obj.mesh);
    obj.sliced = true;
    objects = objects.filter(o => o !== obj);
    running = false;
    setTimeout(()=> endGame(true), 380);
    return;
  }

  playSlice();
  sliceObject(obj, dirWorld, hitPoint);
  objects = objects.filter(o => o !== obj);

  comboCount++;
  comboTimer = COMBO_WINDOW;
  const base = 1;
  const gained = comboCount > 1 ? base + (comboCount - 1) : base;
  score += gained;
  scoreEl.textContent = score;
  spawnScorePopup(hitPoint, comboCount > 1 ? ('+' + gained + '  ×' + comboCount) : ('+' + gained));

  if (comboCount > 1) {
    comboEl.textContent = '×' + comboCount + ' COMBO';
    comboEl.classList.add('show');
  }
}

function spawnScorePopup(worldPos, text){
  popups.push({ worldPos: worldPos.clone(), text, life: 0, maxLife: 0.9 });
}

/* ---------- pointer events (mouse + touch unified) ---------- */
function onPointerDown(e){
  ensureAudio();
  pointerDown = true;
  activeStrokeHits.clear();
  comboCount = 0;
  const p = getEventPos(e);
  trailPts = [{ x: p.x, y: p.y, t: performance.now() }];
  if (!running && !startScreen.classList.contains('hidden')) return;
}
function onPointerMove(e){
  if (!pointerDown) return;
  const pts = getEventPositions(e);
  for (const p of pts) handleMove(p.x, p.y);
}
function onPointerUp(){
  pointerDown = false;
  comboTimer = 0;
}

function getEventPos(e){
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function getEventPositions(e){
  if (e.touches && e.touches.length) {
    const arr = [];
    for (let i = 0; i < e.touches.length; i++) arr.push({ x: e.touches[i].clientX, y: e.touches[i].clientY });
    return arr;
  }
  return [{ x: e.clientX, y: e.clientY }];
}

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', (e)=>{ onPointerDown(e); }, { passive: true });
window.addEventListener('touchmove', (e)=>{ onPointerMove(e); }, { passive: true });
window.addEventListener('touchend', (e)=>{ onPointerUp(e); }, { passive: true });
window.addEventListener('touchcancel', (e)=>{ onPointerUp(e); }, { passive: true });

/* ============================================================
   TRAIL RENDERING (2D overlay canvas, blade look)
============================================================ */
function drawTrail(){
  const w = trailCanvas.width / (window.devicePixelRatio || 1);
  const h = trailCanvas.height / (window.devicePixelRatio || 1);
  tctx.clearRect(0, 0, w, h);
  if (trailPts.length < 2) return;

  const now = performance.now();
  const pts = trailPts.filter(p => now - p.t < 220);
  if (pts.length < 2) return;

  tctx.lineCap = 'round';
  tctx.lineJoin = 'round';

  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i-1], p1 = pts[i];
    const age = (now - p1.t) / 220;
    const alpha = Math.max(0, 1 - age);
    const width = Math.max(1.5, 13 * alpha);

    tctx.strokeStyle = `rgba(242,193,78,${alpha * 0.9})`;
    tctx.lineWidth = width;
    tctx.beginPath();
    tctx.moveTo(p0.x, p0.y);
    tctx.lineTo(p1.x, p1.y);
    tctx.stroke();

    tctx.strokeStyle = `rgba(255,255,255,${alpha * 0.55})`;
    tctx.lineWidth = Math.max(1, width * 0.35);
    tctx.beginPath();
    tctx.moveTo(p0.x, p0.y);
    tctx.lineTo(p1.x, p1.y);
    tctx.stroke();
  }

  // score popups drawn on the same overlay canvas (cheap, no DOM churn)
  for (const pu of popups) {
    const t = pu.life / pu.maxLife;
    const screen = worldToScreen(pu.worldPos);
    const alpha = 1 - t;
    const dy = -40 * t;
    tctx.save();
    tctx.globalAlpha = Math.max(0, alpha);
    tctx.fillStyle = '#f2c14e';
    tctx.font = "700 24px 'Space Grotesk', sans-serif";
    tctx.textAlign = 'center';
    tctx.fillText(pu.text, screen.x, screen.y + dy);
    tctx.restore();
  }
}

function worldToScreen(v3){
  const p = v3.clone().project(camera);
  return {
    x: (p.x * 0.5 + 0.5) * window.innerWidth,
    y: (-p.y * 0.5 + 0.5) * window.innerHeight
  };
}

/* ============================================================
   MAIN LOOP
============================================================ */
let lastT = performance.now();

function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  let dt = (now - lastT) / 1000;
  dt = Math.min(dt, 0.033);
  lastT = now;

  updateViewport();
  dust.rotation.y += dt * 0.02;
  rim1.intensity = 2.0 + Math.sin(now * 0.002) * 0.3;
  rim2.intensity = 1.8 + Math.cos(now * 0.0017) * 0.3;

  if (running) {
    elapsed += dt;
    spawnTimer += dt;
    const spawnEvery = Math.max(420, nextSpawnDelay - elapsed * 6);
    if (spawnTimer > spawnEvery / 1000) {
      spawnTimer = 0;
      trySpawnWave();
    }

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) {
        comboCount = 0;
        comboEl.classList.remove('show');
      }
    }

    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      o.vy += GRAVITY * dt;
      o.mesh.position.x += o.vx * dt;
      o.mesh.position.y += o.vy * dt;
      o.mesh.position.z += o.vz * dt;
      o.mesh.rotateOnAxis(o.spinAxis, o.spin * dt);

      if (o.isBomb) {
        o.bombFlicker += dt * 10;
        const mats = o.mesh.children[0].material;
        const flick = 0.4 + Math.abs(Math.sin(o.bombFlicker)) * 0.5;
        mats[1].emissiveIntensity = flick;
        mats[2].emissiveIntensity = flick;
      }

      if (o.mesh.position.y < -VH/2 - RECORD_R - 1.5) {
        scene.remove(o.mesh);
        objects.splice(i, 1);
        if (!o.isBomb) {
          lives--;
          refreshLivesUI();
          playMiss();
          comboCount = 0;
          comboEl.classList.remove('show');
          if (lives <= 0) {
            endGame(false);
          }
        }
      }
    }

    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.life += dt;
      if (!p.isParticle) {
        p.vy += GRAVITY * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.rotation.z += p.spin * dt;
        updatePlaneForPiece(p, dt);
        const mats = p.mesh.material;
        const fade = Math.max(0, 1 - p.life / p.maxLife);
        mats.forEach(m => { m.transparent = true; m.opacity = fade; });
      } else {
        p.vy += GRAVITY * 0.6 * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.rotation.x += p.spin * dt;
        p.mesh.rotation.y += p.spin * 0.7 * dt;
        const fade = Math.max(0, 1 - p.life / p.maxLife);
        p.mesh.material.transparent = true;
        p.mesh.material.opacity = fade;
        p.mesh.scale.setScalar(fade);
      }
      if (p.life > p.maxLife) {
        scene.remove(p.mesh);
        pieces.splice(i, 1);
      }
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].life += dt;
      if (popups[i].life > popups[i].maxLife) popups.splice(i, 1);
    }
  }

  drawTrail();
  renderer.render(scene, camera);
}

resize();
buildLivesUI();
tick();

})();
</script>
