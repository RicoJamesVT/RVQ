<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MEGA SLUGGER: HOME RUN DERBY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* No external font import here (offline-safe, no network calls) -- every
     font-family below already falls back to plain monospace, same "bundled
     locally, no external assets" approach the rest of the swamp's
     standalone mini-game apps use. */

  :root{
    --navy:#0c0c2e;
    --navy2:#161650;
    --cyan:#3ef0e0;
    --pink:#ff3d7f;
    --gold:#ffd23f;
    --green:#1f8a3b;
    --green-dark:#0f5c26;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: #050512;
    background-image:
      radial-gradient(circle at 50% 0%, #201a4a 0%, #050512 70%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P', monospace;
    overflow:hidden;
    color:#fff;
  }
  #cabinet{
    display:flex; flex-direction:column; align-items:center;
    gap:10px;
    padding:14px 14px 18px;
    background: linear-gradient(180deg,#3a3a52,#1c1c2c);
    border-radius:14px;
    box-shadow: 0 0 0 3px #000, 0 0 40px rgba(62,240,224,0.15), inset 0 0 10px rgba(0,0,0,0.6);
  }
  #screenWrap{
    position:relative;
    line-height:0;
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 0 0 4px #0a0a14, 0 0 0 6px #4a4a66;
  }
  canvas{
    display:block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#000;
  }
  #scan{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode:multiply;
  }
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 40px 10px rgba(0,0,0,0.55);
  }
  #brand{
    display:flex; justify-content:space-between; align-items:center;
    width:100%;
    color:var(--cyan);
    font-size:9px;
    letter-spacing:1px;
    padding:0 4px;
    text-shadow: 2px 2px 0 var(--pink);
  }
  #controls{
    display:flex; gap:10px; align-items:center; margin-top:4px;
  }
  .btn{
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    padding:12px 20px;
    background: linear-gradient(180deg,#ff5a91,var(--pink));
    color:#fff;
    border:none;
    border-radius:6px;
    box-shadow: 0 4px 0 #a11b4d, 0 5px 8px rgba(0,0,0,0.4);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #a11b4d;
  }
  #hint{
    color:#8a8ac0;
    font-size:8px;
    text-align:center;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div id="cabinet">
    <div id="brand"><span>MEGA SLUGGER</span><span style="color:var(--gold)">HOME RUN DERBY</span></div>
    <div id="screenWrap">
      <canvas id="game" width="320" height="240"></canvas>
      <div id="scan"></div>
      <div id="vignette"></div>
    </div>
    <div id="controls">
      <button class="btn" id="swingBtn">⚾ SWING</button>
    </div>
    <div id="hint">PRESS SPACE OR TAP SWING &nbsp;|&nbsp; TIME IT RIGHT</div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = 320, H = 240;

  // ---------- responsive scaling ----------
  function fitScreen(){
    const maxW = Math.min(window.innerWidth - 40, 900);
    const maxH = Math.min(window.innerHeight - 140, 900);
    let scale = Math.floor(Math.min(maxW / W, maxH / H));
    if(scale < 1) scale = 1;
    canvas.style.width = (W*scale)+'px';
    canvas.style.height = (H*scale)+'px';
  }
  window.addEventListener('resize', fitScreen);
  fitScreen();

  // ---------- palette ----------
  const PAL = {
    skyTop:'#3a1a5c', skyMid:'#8a2f6b', skyBot:'#ff6b35',
    sun:'#ffd23f',
    grass:'#1f8a3b', grassDark:'#166b2c', dirt:'#c98a4b', dirtDark:'#a56a34',
    fence:'#0f5c26', fenceTop:'#ffd23f',
    cyan:'#3ef0e0', pink:'#ff3d7f', gold:'#ffd23f', white:'#f4f4f4',
    navy:'#0c0c2e', crowd1:'#5b3a8a', crowd2:'#3a2a6a', crowd3:'#8a2f6b'
  };

  // ---------- audio ----------
  let actx = null;
  function initAudio(){
    if(!actx){
      actx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, type='square', vol=0.16, delay=0, slideTo=null){
    if(!actx) return;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.linearRampToValueAtTime(slideTo, t0+dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, vol=0.2, delay=0, filterFreq=1200){
    if(!actx) return;
    const t0 = actx.currentTime + delay;
    const bufferSize = actx.sampleRate * dur;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = actx.createBufferSource();
    src.buffer = buffer;
    const filt = actx.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = filterFreq;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    src.connect(filt).connect(gain).connect(actx.destination);
    src.start(t0);
  }
  function playSwing(){ tone(500,0.07,'square',0.12,0,220); }
  function playCrack(){ noiseBurst(0.18,0.35,0,2200); tone(140,0.12,'triangle',0.25,0); }
  function playWhiff(){ tone(300,0.15,'sawtooth',0.12,0,120); }
  function playStrike(){ tone(160,0.2,'square',0.15,0,90); }
  function playOutThud(){ tone(120,0.25,'triangle',0.2,0,60); noiseBurst(0.15,0.15,0.02,600); }
  function playHRFanfare(){
    const notes=[523,659,784,1047];
    notes.forEach((f,i)=>tone(f,0.16,'square',0.18,i*0.12));
    noiseBurst(0.8,0.12,0.1,3000);
  }
  function playBlip(f){ tone(f,0.05,'square',0.08,0); }

  // ---------- game state ----------
  let state = 'title'; // title, windup, pitch, result, gameover
  let stateStart = 0;
  let outs=0, HR=0, longest=0, pitchNum=0;
  const MAXOUTS = 10;
  let pitch = null;
  let result = null;
  let swungAt = null; // timestamp of swing this pitch
  let titleBlink = 0;
  let particles = [];
  let lastSwingDiff = null; // ms early(-)/late(+) of last swing, for feedback

  function now(){ return performance.now(); }

  function resetGame(){
    outs=0; HR=0; longest=0; pitchNum=0;
    state='windup'; stateStart = now();
  }

  function newPitch(){
    pitchNum++;
    const speedUp = Math.min(pitchNum*5, 130);
    const duration = Math.max(820, 1300 - speedUp + Math.random()*160);
    const fence = 350 + Math.random()*90; // 350-440 ft fence for this pitch
    const xOff = (Math.random()-0.5) * 40; // pitch location left/right
    pitch = { start: now(), duration, fence, xOff, resolved:false };
    swungAt = null;
    lastSwingDiff = null;
    state = 'pitch';
  }

  function endAtBat(outcome){
    // outcome: {type: 'homerun'|'out'|'strike'|'miss', distance}
    result = Object.assign({ start: now(), duration: 1900 }, outcome);
    if(outcome.type === 'homerun'){
      HR++;
      if(outcome.distance > longest) longest = outcome.distance;
    } else {
      outs++;
    }
    state = 'result';
    stateStart = now();
  }

  // The "perfect" instant is shifted a bit later than the ball's geometric
  // arrival, because players react AFTER they see the ball reach the zone -
  // centering the window exactly on arrival made it almost unhittable.
  const REACTION_OFFSET = 90; // ms - how much later than arrival "perfect" sits
  const HITWINDOW = 240; // ms half-width of a swing that makes contact

  function resolveSwing(){
    const el = now() - pitch.start;
    const diff = el - (pitch.duration + REACTION_OFFSET);
    const absDiff = Math.abs(diff);
    lastSwingDiff = diff; // for on-screen feedback
    if(absDiff <= HITWINDOW){
      const power = Math.max(0, 1 - absDiff/HITWINDOW);
      const variance = (Math.random()-0.5)*36;
      const distance = Math.round(220 + power*300 + variance);
      playCrack();
      if(distance >= pitch.fence){
        setTimeout(playHRFanfare, 260);
        endAtBat({type:'homerun', distance, power});
      } else {
        endAtBat({type:'out', distance, power});
        setTimeout(playOutThud, 500);
      }
    } else {
      playWhiff();
      setTimeout(playOutThud, 300);
      endAtBat({type:'miss', distance:0});
    }
  }

  // ---------- input ----------
  function trySwing(){
    initAudio();
    if(state === 'title'){ resetGame(); return; }
    if(state === 'gameover'){ state='title'; return; }
    if(state === 'pitch' && swungAt === null){
      swungAt = now();
      playSwing();
      resolveSwing();
    }
  }
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      trySwing();
    }
  });
  document.getElementById('swingBtn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    trySwing();
  });
  canvas.addEventListener('pointerdown', trySwing);

  // ---------- drawing helpers ----------
  function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  function pixelText(txt, x, y, size, color, align='left', shadow=true){
    ctx.font = size+'px "Press Start 2P", monospace';
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    if(shadow){
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(txt, x+2, y+2);
    }
    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,150);
    g.addColorStop(0, PAL.skyTop);
    g.addColorStop(0.55, PAL.skyMid);
    g.addColorStop(1, PAL.skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,150);
    // sun
    ctx.fillStyle = PAL.sun;
    ctx.beginPath(); ctx.arc(260,40,22,0,Math.PI*2); ctx.fill();
    // stars/dots
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for(let i=0;i<14;i++){
      const sx = (i*47)%W, sy = (i*23)%70;
      ctx.fillRect(sx,sy,1,1);
    }
  }

  function drawCrowd(yTop, yBot){
    const colors=[PAL.crowd1,PAL.crowd2,PAL.crowd3];
    for(let x=0;x<W;x+=6){
      const c = colors[(x/6 + Math.floor(now()/300))%3|0];
      rect(x,yTop, 5, yBot-yTop, c);
    }
  }

  function drawField(){
    drawSky();
    drawCrowd(150,168);
    // outfield fence
    rect(0,168,W,8,PAL.fence);
    rect(0,168,W,2,PAL.fenceTop);
    // grass
    const g = ctx.createLinearGradient(0,176,0,240);
    g.addColorStop(0,PAL.grass);
    g.addColorStop(1,PAL.grassDark);
    ctx.fillStyle = g;
    ctx.fillRect(0,176,W,64);
    // mow stripes
    ctx.fillStyle='rgba(0,0,0,0.08)';
    for(let x=0;x<W;x+=20) ctx.fillRect(x,176,10,64);
    // infield dirt (diamond-ish arc)
    ctx.fillStyle = PAL.dirt;
    ctx.beginPath();
    ctx.ellipse(160,240,110,42,0,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = PAL.dirtDark;
    ctx.beginPath();
    ctx.ellipse(160,240,110,42,0,Math.PI,Math.PI*2);
    ctx.lineWidth=3; ctx.strokeStyle=PAL.dirtDark; ctx.stroke();
  }

  function drawPitcherMound(){
    rect(150,150,20,10,PAL.dirt);
    // pitcher body (simple blocky sprite)
    const bob = Math.sin(now()/120)*1.5;
    rect(155,132+bob,10,16,'#dedede'); // torso jersey
    rect(157,126+bob,6,7,'#e8b98a'); // head
    rect(153,140+bob,4,10,'#dedede'); // arm
    rect(163,140+bob,4,10,'#dedede'); // arm
    rect(155,148+bob,4,10,'#2b2b6b'); // legs
    rect(161,148+bob,4,10,'#2b2b6b');
    pixelText('CPU', 160, 118, 6, PAL.cyan, 'center');
  }

  function drawBatterSilhouette(swingProgress){
    // bottom of screen, batter's-eye-view partial silhouette
    const baseX = 60, baseY = 240;
    ctx.save();
    ctx.fillStyle = '#111';
    // body
    rect(baseX-10,baseY-70,26,70,'#111');
    rect(baseX-16,baseY-90,20,22,'#111'); // helmet/head area
    // bat
    ctx.translate(baseX+14, baseY-58);
    let angle = -1.1;
    if(swingProgress !== null){
      angle = -1.1 + swingProgress * 2.6;
    }
    ctx.rotate(angle);
    rect(0,-3,42,6,'#c98a4b');
    ctx.restore();
  }

  function drawHUD(){
    rect(0,0,W,16,'rgba(6,6,20,0.85)');
    rect(0,15,W,1,PAL.cyan);
    pixelText('OUTS '+outs+'/'+MAXOUTS, 6, 4, 7, PAL.pink);
    pixelText('HR '+HR, 140, 4, 7, PAL.gold, 'center');
    pixelText('PITCH '+pitchNum, W-6, 4, 7, PAL.cyan, 'right');
  }

  // ---------- title screen ----------
  function drawTitle(t){
    drawField();
    rect(0,0,W,H,'rgba(6,6,25,0.55)');
    titleBlink += 1;
    ctx.save();
    ctx.translate(W/2, 68);
    pixelText('MEGA SLUGGER', 2, 2, 20, '#000', 'center', false);
    pixelText('MEGA SLUGGER', 0, 0, 20, PAL.gold, 'center', false);
    ctx.restore();
    pixelText('HOME RUN DERBY', W/2, 100, 12, PAL.pink, 'center');
    // little diamond icon animation
    const bob = Math.sin(t/300)*4;
    ctx.save();
    ctx.translate(W/2, 140+bob);
    ctx.rotate(Math.PI/4);
    rect(-8,-8,16,16, PAL.white);
    rect(-8,-8,16,3, PAL.cyan);
    ctx.restore();

    if(Math.floor(titleBlink/28)%2===0){
      pixelText('PRESS START', W/2, 190, 10, PAL.cyan, 'center');
    }
    pixelText('© SEGA-STYLE FAN ARCADE', W/2, 226, 6, '#8a8ac0', 'center');
  }

  // ---------- windup ----------
  function drawWindup(t){
    drawField();
    drawPitcherMound();
    drawBatterSilhouette(null);
    drawHUD();
    const elapsed = t - stateStart;
    if(Math.floor(elapsed/150)%2===0){
      pixelText('GET READY...', W/2, 60, 8, PAL.gold, 'center');
    }
    if(elapsed > 650){
      newPitch();
    }
  }

  // ---------- pitch ----------
  function easeInQuad(x){ return x*x; }
  function drawPitch(t){
    drawField();
    drawPitcherMound();

    const el = t - pitch.start;
    const p = Math.min(el/pitch.duration, 1.25);
    const grow = easeInQuad(Math.min(p,1));
    // ball path: from mound (160,145) to near batter (95,190) with slight curve based on xOff
    const bx = 160 + (95-160)*grow + pitch.xOff*grow;
    const by = 145 + (190-145)*grow;
    const size = 2 + grow*10;

    // ball
    if(p <= 1.15){
      ctx.fillStyle = PAL.white;
      ctx.beginPath();
      ctx.arc(bx,by,size/2,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#c0392b'; ctx.lineWidth=0.6;
      ctx.stroke();
    }

    let swingProgress = null;
    if(swungAt !== null){
      swingProgress = Math.min((t-swungAt)/180,1);
    }
    drawBatterSilhouette(swingProgress);
    drawSwingMeter(el);
    drawHUD();

    // ball passed without swing -> strike (grace period matches the hit window)
    const strikeAt = pitch.duration + REACTION_OFFSET + HITWINDOW + 60;
    if(el > strikeAt && swungAt === null && !pitch.resolved){
      pitch.resolved = true;
      playStrike();
      lastSwingDiff = null;
      endAtBat({type:'strike', distance:0});
    }
  }

  // clear "swing meter": a marker slides left to right; press when it's
  // inside the highlighted sweet-spot zone. This is the real hit-timing cue -
  // the flying ball above is just visual flavor.
  function drawSwingMeter(el){
    const barX = 40, barY = 205, barW = 240, barH = 10;
    const totalTime = pitch.duration + REACTION_OFFSET + HITWINDOW + 60;
    const targetTime = pitch.duration + REACTION_OFFSET;

    // bar background
    rect(barX-2, barY-2, barW+4, barH+4, '#0a0a1e');
    rect(barX, barY, barW, barH, '#1c1c3a');

    // sweet-spot zone (where a swing makes contact)
    const zoneW = (HITWINDOW*2/totalTime) * barW;
    const zoneX = barX + (targetTime/totalTime)*barW - zoneW/2;
    rect(zoneX, barY, zoneW, barH, 'rgba(62,240,224,0.55)');
    // "perfect" sliver in the middle of the zone
    const perfW = Math.max(3, zoneW*0.18);
    rect(barX + (targetTime/totalTime)*barW - perfW/2, barY, perfW, barH, PAL.gold);

    // moving marker
    const markerFrac = Math.min(el/totalTime, 1);
    const markerX = barX + markerFrac*barW;
    rect(markerX-1.5, barY-5, 3, barH+10, PAL.pink);

    pixelText('SWING', barX, barY-16, 6, '#9a9ad0');
  }

  // ---------- result / flight animation ----------
  function drawResult(t){
    const el = t - result.start;
    const dur = result.duration;
    const frac = Math.min(el/dur, 1);

    if(result.type === 'strike' || result.type === 'miss'){
      drawField();
      drawPitcherMound();
      drawBatterSilhouette(1);
      drawHUD();
      pixelText(result.type==='strike' ? 'STRIKE!' : 'SWING AND A MISS!', W/2, 70, 9, PAL.pink, 'center');
      pixelText('OUT', W/2, 90, 14, '#ff5252', 'center');
      if(lastSwingDiff !== null){
        const label = lastSwingDiff < 0 ? 'TOO EARLY' : 'TOO LATE';
        pixelText(label+' ('+Math.abs(Math.round(lastSwingDiff))+'ms)', W/2, 112, 7, '#9a9ad0', 'center');
      }
    } else {
      // side-view outfield flight
      drawSky();
      drawCrowd(150,168);
      rect(0,168,W,8,PAL.fence);
      rect(0,168,W,2,PAL.fenceTop);
      const g = ctx.createLinearGradient(0,176,0,240);
      g.addColorStop(0,PAL.grass); g.addColorStop(1,PAL.grassDark);
      ctx.fillStyle = g; ctx.fillRect(0,176,W,64);

      // fence distance marker
      pixelText(Math.round(pitch.fence)+' FT', W-30, 158, 6, PAL.gold, 'center');

      const maxDist = 520;
      const travel = Math.min(frac*1.15, 1);
      const startX = 40, startY = 236;
      const distFrac = Math.min(result.distance / maxDist, 1);
      const endX = 40 + distFrac * 340;
      const peakHeight = 40 + result.power*100;
      const x = startX + (endX-startX)*travel;
      const arcY = startY - Math.sin(Math.PI*travel) * peakHeight;

      const clearsFence = result.type==='homerun';
      const flightDone = travel >= 1;

      if(!flightDone || clearsFence){
        ctx.fillStyle = PAL.white;
        ctx.beginPath(); ctx.arc(x, arcY, 3, 0, Math.PI*2); ctx.fill();
        // trail
        ctx.strokeStyle='rgba(255,255,255,0.35)';
        ctx.beginPath();
        for(let i=0;i<10;i++){
          const tt = Math.max(travel - i*0.02,0);
          const xx = startX + (endX-startX)*tt;
          const yy = startY - Math.sin(Math.PI*tt) * peakHeight;
          ctx.lineTo(xx,yy);
        }
        ctx.stroke();
      }

      // distance counter climbing
      const shownDist = Math.round(distFrac_to_dist(travel, result.distance));
      pixelText(shownDist+' FT', W/2, 20, 12, PAL.gold, 'center');

      if(clearsFence){
        pixelText('HOME RUN!', W/2, 40, 14, PAL.pink, 'center');
        if(flightDone) drawFireworks(t);
      } else if(flightDone){
        pixelText('OUT!', W/2, 40, 14, '#ff5252', 'center');
      }
      if(flightDone && lastSwingDiff !== null){
        const q = Math.abs(lastSwingDiff) < 40 ? 'PERFECT TIMING' : (lastSwingDiff < 0 ? 'A TOUCH EARLY' : 'A TOUCH LATE');
        pixelText(q, W/2, 58, 6, '#9a9ad0', 'center');
      }
      drawHUD();
    }

    if(el > dur){
      if(outs >= MAXOUTS){
        state = 'gameover'; stateStart = t;
      } else {
        state = 'windup'; stateStart = t;
      }
    }
  }
  function distFrac_to_dist(travel, dist){
    const t = Math.min(travel,1);
    return dist * Math.sin(Math.min(t,1)*Math.PI/2 + 0); // ease-ish reveal
  }

  function drawFireworks(t){
    for(let i=0;i<3;i++){
      const cx = 60 + i*100 + Math.sin(t/200+i)*10;
      const cy = 60 + Math.cos(t/250+i)*8;
      const colors=[PAL.gold,PAL.pink,PAL.cyan];
      ctx.fillStyle = colors[i%3];
      for(let a=0;a<8;a++){
        const ang = a/8*Math.PI*2 + t/300;
        const r = 6 + (Math.sin(t/150+i)+1)*4;
        ctx.fillRect(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r, 2,2);
      }
    }
  }

  // ---------- game over ----------
  function drawGameOver(t){
    drawField();
    rect(0,0,W,H,'rgba(6,6,25,0.7)');
    pixelText('GAME OVER', W/2, 40, 16, PAL.pink, 'center');
    pixelText('HOME RUNS: '+HR, W/2, 90, 10, PAL.gold, 'center');
    pixelText('LONGEST: '+longest+' FT', W/2, 112, 9, PAL.cyan, 'center');
    pixelText('PITCHES SEEN: '+pitchNum, W/2, 134, 9, PAL.white, 'center');
    if(Math.floor(t/300)%2===0){
      pixelText('PRESS START TO REPLAY', W/2, 180, 8, PAL.gold, 'center');
    }
  }

  // ---------- main loop ----------
  function loop(){
    const t = now();
    ctx.clearRect(0,0,W,H);
    if(state==='title') drawTitle(t);
    else if(state==='windup') drawWindup(t);
    else if(state==='pitch') drawPitch(t);
    else if(state==='result') drawResult(t);
    else if(state==='gameover') drawGameOver(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
