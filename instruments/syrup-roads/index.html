<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SyrupRoads</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#17100d;color:#fff;font-family:system-ui,sans-serif;overscroll-behavior:none;overflow:hidden;touch-action:none}
#wrap{position:fixed;inset:0;width:100vw;height:100dvh}
#game{position:absolute;inset:0;width:100%;height:100%;background:#8bd6f4;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.pill{background:#27170ee8;border:2px solid #ffffff38;border-radius:13px;padding:6px 12px;font-size:12px;font-weight:800}.pill b{display:block;font-size:23px;color:#ffd15a}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#1a100dcc;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px);text-align:center;z-index:10}
.panel{max-width:390px;width:100%;max-height:100%;overflow:auto;background:linear-gradient(160deg,#633014,#301b15);border:3px solid #e8a73c;border-radius:22px;padding:clamp(12px,4vw,25px);box-shadow:0 7px 0 #170d08}
h1{font-size:clamp(26px,7vw,54px);line-height:1;margin:0;color:#ffd45a;text-shadow:3px 4px #3a1609;letter-spacing:-2px}.sub{font-size:12px;font-weight:900;letter-spacing:2px;color:#f7cda2;margin:8px 0 14px}
button{border:0;border-radius:13px;background:linear-gradient(#ffda65,#e98d1c);box-shadow:0 4px 0 #9c4e0c;color:#35180b;font-size:17px;font-weight:1000;padding:13px 18px;cursor:pointer;width:100%;min-height:48px;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #9c4e0c}
.hidden{display:none!important}
#start.overlay{display:block;padding:0;background:#0e2f42;overflow:hidden}
#start .splash-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
#start .start-cta{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);background:linear-gradient(to top,#150b07f0 0%,#150b07d0 45%,#150b0700 100%);z-index:2}
#start .start-cta button{max-width:360px;width:100%}
#start .start-cta p{font-size:11px;color:#f7dfc0;font-weight:800;letter-spacing:1px;text-shadow:0 2px 5px #000c;margin:0;text-align:center}
@media (max-height:420px){
  #start .start-cta{padding-top:10px;gap:6px}
}
.controls{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.controls div{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.controls button{pointer-events:auto;width:54px;height:44px;padding:0;font-size:22px;background:#38251ecc;color:#ffe3a5;border:2px solid #c9a17c88;box-shadow:none;border-radius:12px}
@media (max-height:420px){
  .hud{top:calc(env(safe-area-inset-top) + 6px)}
  .pill{padding:4px 8px}.pill b{font-size:17px}
  .controls{gap:6px}.controls button{width:46px;height:36px;font-size:18px}
  .controls div{gap:3px}
}
@media (max-width:360px){
  .panel{border-width:2px;border-radius:16px}
}
</style>
</head>
<body><div id="wrap">
<div id="game"><canvas id="c"></canvas>
<div class="hud"><div class="pill">CROSSED<b id="score">0</b></div><div class="pill">BEST<b id="best">0</b></div></div>
<div id="start" class="overlay"><img class="splash-img" src="splash.png" alt="Syrup Roads"><div class="start-cta"><button id="play">▶ POUR INTO THE ROAD</button><p>ARROWS / WASD • SWIPE • TOUCH BUTTONS</p></div></div>
<div id="over" class="overlay hidden"><div class="panel"><div style="font-size:38px">💥🍁</div><h1 style="font-size:34px">SPLASHED!</h1><div class="sub">THE ROAD WAS TOO HOT</div><div id="final" style="font-size:44px;color:#ffd15a;font-weight:1000">0</div><p id="record" style="color:#f8d4a7;font-weight:800"></p><button id="retry">↻ POUR AGAIN</button></div></div>
<div class="controls"><div><button data-d="left">←</button></div><div><button data-d="up">↑</button><button data-d="down">↓</button></div><div><button data-d="right">→</button></div></div>
</div>
</div>
<script>
(()=>{
const c=document.querySelector('#c'),x=c.getContext('2d');
const gameEl=document.querySelector('#game');
let W=0,H=0,dpr=1,CELL_X=40,CELL_Y=40,COLS=10,ROWS=12;
function getBest(){try{return +localStorage.getItem('srbest')||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('srbest',v)}catch(e){}}
let state='menu',score=0,best=getBest();
let p={col:0,row:0,x:0,y:0,j:0};
let cars=[],parts=[],roads=[],spawnTimer=0,last=0,raf=0,rTimer=0;
let crossings=0,paletteIndex=0;
document.querySelector('#best').textContent=best;

const colors=['#ef4444','#3b82f6','#facc15','#a855f7','#f97316','#22c55e'];
const palettes=[
  {sky:'#8edbf5',cloud:'#a8e8fa',grass:'#70b95a',grassDark:'#378a4c',grassLight:'#56a75e',road:'#333c45',shoulder:'#d6d1bc',stripe:'#f8d45c',water:'#f6e6c1',waterDark:'#543526',bottom:'#5e9e50'},
  {sky:'#9ad9ef',cloud:'#c4eff8',grass:'#7eaf63',grassDark:'#4f8b50',grassLight:'#70b86b',road:'#41454e',shoulder:'#d9c9ad',stripe:'#f5cf70',water:'#f1dfb9',waterDark:'#68452e',bottom:'#659957'},
  {sky:'#c2d8ef',cloud:'#dce8f6',grass:'#8aa77a',grassDark:'#527b68',grassLight:'#759c80',road:'#454b55',shoulder:'#cfc9bd',stripe:'#e8c56b',water:'#e9d8bb',waterDark:'#665044',bottom:'#718f71'},
  {sky:'#e6c9a5',cloud:'#f2dfbd',grass:'#a4a05c',grassDark:'#74733d',grassLight:'#b9ae66',road:'#4a4540',shoulder:'#d7c19b',stripe:'#e5b85c',water:'#e9d4a5',waterDark:'#725033',bottom:'#8d8749'},
  {sky:'#b7d8c9',cloud:'#d5eee1',grass:'#739d7c',grassDark:'#426e5a',grassLight:'#82b38b',road:'#39464a',shoulder:'#c7d0b8',stripe:'#e7d17b',water:'#dbe4c8',waterDark:'#4d6550',bottom:'#608a6b'}
];
const CAR_TYPES=[
  {key:'moto',wf:0.85,hf:0.42,speedf:1.35,weight:2},
  {key:'sedan',wf:1.5,hf:0.58,speedf:1,weight:5},
  {key:'suv',wf:1.75,hf:0.74,speedf:0.9,weight:3},
  {key:'truck',wf:2.6,hf:0.66,speedf:0.72,weight:2},
  {key:'bus',wf:3.1,hf:0.7,speedf:0.6,weight:1},
  {key:'vinyl',wf:0.9,hf:0.9,speedf:1.05,weight:1},
  {key:'cassette',wf:1.3,hf:0.56,speedf:0.95,weight:1}
];

// ---------- layout / grid ----------
function buildRoads(){
  roads=[];
  let dir=1;
  for(let i=2;i<=ROWS-2;i++){
    if(i%2===0){
      roads.push({row:i,y:i*CELL_Y+CELL_Y*0.08,h:CELL_Y*0.84,d:dir});
      dir*=-1;
    }
  }
}
function syncPlayerPixel(){p.x=(p.col+0.5)*CELL_X;p.y=(p.row+0.5)*CELL_Y}
function buildLayout(resetRun){
  const rect=gameEl.getBoundingClientRect();
  W=Math.max(200,rect.width);H=Math.max(200,rect.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
  x.setTransform(dpr,0,0,dpr,0,0);
  const base=Math.max(26,Math.min(58,Math.min(W,H)/9));
  ROWS=Math.max(9,Math.round(H/base));
  COLS=Math.max(7,Math.round(W/base));
  CELL_Y=H/ROWS;CELL_X=W/COLS;
  buildRoads();
  if(resetRun){p.col=Math.floor(COLS/2);p.row=ROWS-1}
  else{p.col=Math.max(0,Math.min(COLS-1,p.col));p.row=Math.max(0,Math.min(ROWS-1,p.row))}
  syncPlayerPixel();
}
function scheduleLayout(){
  clearTimeout(rTimer);
  rTimer=setTimeout(()=>{buildLayout(false);populateCars();if(state!=='play')draw()},80);
}
addEventListener('resize',scheduleLayout);
addEventListener('orientationchange',()=>setTimeout(()=>{buildLayout(false);populateCars();if(state!=='play')draw()},100));
if(window.visualViewport){visualViewport.addEventListener('resize',scheduleLayout)}

// ---------- cars ----------
function pickType(){
  const total=CAR_TYPES.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total;
  for(const t of CAR_TYPES){if(r<t.weight)return t;r-=t.weight}
  return CAR_TYPES[1];
}
function addCar(road){
  const t=pickType(),U=CELL_Y;
  const w=U*t.wf,h=U*t.hf,dir=road.d;
  const speed=(60+Math.random()*40+score*1.3)*(U/40)*t.speedf;
  const startX=dir>0?-w-Math.random()*W*0.5:W+w+Math.random()*W*0.5;
  cars.push({x:startX,y:road.y+road.h/2,w,h,d:dir,speed,col:colors[Math.random()*colors.length|0],type:t.key,row:road.row,rot:Math.random()*6.28});
}
function populateCars(){
  cars=[];
  roads.forEach(r=>{
    const n=1+Math.floor(Math.random()*2);
    for(let k=0;k<n;k++){addCar(r);cars[cars.length-1].x=Math.random()*W}
  });
}

// ---------- run control ----------
function updateScoreLabel(){document.querySelector('#score').textContent=score}
function reset(){
  score=0;crossings=0;paletteIndex=0;parts=[];spawnTimer=0;
  buildLayout(true);
  populateCars();
  updateScoreLabel();
}
function start(){
  reset();state='play';
  document.querySelector('#start').classList.add('hidden');
  document.querySelector('#over').classList.add('hidden');
  if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}
}
function end(){
  state='over';best=Math.max(best,score);setBest(best);
  document.querySelector('#best').textContent=best;
  document.querySelector('#final').textContent=score;
  document.querySelector('#record').textContent=score>=best?'NEW BEST! 🏆':'BEST: '+best;
  document.querySelector('#over').classList.remove('hidden');
}
function move(d){
  if(state!=='play')return;
  if(d==='left')p.col=Math.max(0,p.col-1);
  if(d==='right')p.col=Math.min(COLS-1,p.col+1);
  if(d==='down')p.row=Math.min(ROWS-1,p.row+1);
  if(d==='up'){
    p.row-=1;score++;p.j=1;syncPlayerPixel();burst(p.x,p.y,'#ffe08a',5);
    if(p.row<=0){
      const bx=p.x,by=p.y;
      p.row=ROWS-1;score+=5;crossings++;
      if(crossings%3===0)paletteIndex=(paletteIndex+1)%palettes.length;
      burst(bx,by,'#fbbf24',14);
    }
  }
  syncPlayerPixel();
  updateScoreLabel();
}
function burst(a,b,col,n){
  for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*CELL_X*2.2,vy:(Math.random()-.5)*CELL_Y*2.2,l:.5+Math.random()*.5,col,r:CELL_Y*0.11});
}
function update(dt){
  if(state!=='play')return;
  p.j=Math.max(0,p.j-dt*4);
  spawnTimer-=dt;
  if(spawnTimer<=0){addCar(roads[Math.random()*roads.length|0]);spawnTimer=Math.max(0.4,1.15-score*0.01)}
  cars.forEach(q=>{
    q.x+=q.d*q.speed*dt;
    if(q.type==='vinyl')q.rot=(q.rot||0)+q.d*dt*(q.speed/(q.w*0.5));
    else if(q.type==='cassette')q.rot=(q.rot||0)+dt*3.2*(q.d>0?1:-1);
    if(q.d>0&&q.x>W+q.w+40)q.x=-q.w-Math.random()*W*0.3;
    if(q.d<0&&q.x<-q.w-40)q.x=W+q.w+Math.random()*W*0.3;
  });
  for(const q of cars){
    if(q.row!==p.row)continue;
    const dx=Math.abs(q.x-p.x),dy=Math.abs(q.y-p.y);
    if(dx<(q.w*0.4+CELL_X*0.22)&&dy<(q.h*0.5+CELL_Y*0.2))return end();
  }
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=CELL_Y*2.6*dt;q.l-=dt});
  parts=parts.filter(q=>q.l>0);
}

// ---------- drawing ----------
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function poly(a,col){x.fillStyle=col;x.beginPath();x.moveTo(...a[0]);a.slice(1).forEach(v=>x.lineTo(...v));x.closePath();x.fill()}
function bg(){
  const k=palettes[paletteIndex];
  x.fillStyle=k.sky;x.fillRect(0,0,W,H);
  x.fillStyle=k.cloud;x.fillRect(0,0,W,CELL_Y*1.8);
  x.fillStyle=k.grass;x.fillRect(0,CELL_Y*1.3,W,H-CELL_Y*1.3);
  const treeY=CELL_Y*1.5;
  for(let i=0;i<W;i+=CELL_X*1.05){
    x.fillStyle=k.grassDark;x.fillRect(i+CELL_X*0.28,treeY,CELL_X*0.22,CELL_Y*0.78);
    poly([[i,treeY+CELL_Y*0.78],[i+CELL_X*0.42,treeY-CELL_Y*0.02],[i+CELL_X*0.84,treeY+CELL_Y*0.78]],k.grassLight);
  }
  for(const r of roads){
    x.fillStyle=k.shoulder;x.fillRect(0,r.y-H*0.02,W,r.h+H*0.04);
    x.fillStyle=k.road;x.fillRect(0,r.y,W,r.h);
    x.strokeStyle=k.stripe;x.lineWidth=Math.max(2,CELL_Y*0.09);x.setLineDash([CELL_X*0.5,CELL_X*0.4]);
    x.beginPath();x.moveTo(0,r.y+r.h/2);x.lineTo(W,r.y+r.h/2);x.stroke();x.setLineDash([]);
  }
  x.fillStyle=k.water;x.fillRect(0,CELL_Y*0.12,W,CELL_Y*0.85);
  for(let i=0;i<W;i+=CELL_X*0.6)for(let j=CELL_Y*0.12;j<CELL_Y*0.97;j+=CELL_Y*0.45)
    if(Math.round(i/(CELL_X*0.6)+j/(CELL_Y*0.45))%2===0){x.fillStyle=k.waterDark;x.fillRect(i,j,CELL_X*0.6,CELL_Y*0.45)}
  x.fillStyle=k.bottom;x.fillRect(0,H-CELL_Y,W,CELL_Y);
}
function car(q){
  x.save();x.translate(q.x,q.y);x.scale(q.d>0?1:-1,1);
  x.fillStyle='#0003';x.beginPath();x.ellipse(0,q.h*0.42,q.w*0.6,q.h*0.22,0,0,Math.PI*2);x.fill();
  if(q.type==='moto'){
    x.fillStyle='#20232b';x.beginPath();x.arc(-q.w*0.32,q.h*0.3,q.h*0.26,0,7);x.arc(q.w*0.32,q.h*0.3,q.h*0.26,0,7);x.fill();
    rr(-q.w*0.42,-q.h*0.32,q.w*0.84,q.h*0.5,q.h*0.2,q.col);
    rr(-q.w*0.12,-q.h*0.5,q.w*0.24,q.h*0.28,4,'#cfeef2');
  }else if(q.type==='truck'){
    rr(-q.w/2,-q.h*0.36,q.w*0.6,q.h*0.72,5,'#d8d8d8');
    rr(-q.w/2+q.w*0.58,-q.h*0.5,q.w*0.42,q.h*0.86,6,q.col);
    rr(-q.w/2+q.w*0.63,-q.h*0.3,q.w*0.32,q.h*0.36,3,'#bfe6ee');
    x.fillStyle='#15171d';x.fillRect(-q.w*0.4,q.h*0.3,q.w*0.16,q.h*0.16);x.fillRect(q.w*0.02,q.h*0.3,q.w*0.16,q.h*0.16);x.fillRect(q.w*0.3,q.h*0.3,q.w*0.16,q.h*0.16);
  }else if(q.type==='bus'){
    rr(-q.w/2,-q.h*0.42,q.w,q.h*0.84,8,q.col);
    for(let i=0;i<4;i++)rr(-q.w/2+q.w*0.08+i*q.w*0.21,-q.h*0.22,q.w*0.15,q.h*0.32,3,'#bfe6ee');
    x.fillStyle='#15171d';x.fillRect(-q.w*0.42,q.h*0.3,q.w*0.14,q.h*0.14);x.fillRect(q.w*0.28,q.h*0.3,q.w*0.14,q.h*0.14);
  }else if(q.type==='suv'){
    rr(-q.w/2,-q.h*0.5,q.w,q.h,8,q.col);
    rr(-q.w*0.3,-q.h*0.42,q.w*0.6,q.h*0.5,4,'#b9e8ed');
    x.fillStyle='#15171d';x.fillRect(-q.w*0.4,q.h*0.32,q.w*0.22,q.h*0.16);x.fillRect(q.w*0.18,q.h*0.32,q.w*0.22,q.h*0.16);
  }else if(q.type==='vinyl'){
    const rad=q.w*0.5;
    x.fillStyle='#0004';x.beginPath();x.ellipse(0,rad*0.85,rad*0.95,rad*0.32,0,0,Math.PI*2);x.fill();
    x.save();x.rotate(q.rot||0);
    x.fillStyle='#181818';x.beginPath();x.arc(0,0,rad,0,7);x.fill();
    x.strokeStyle='#2f2f2f';x.lineWidth=Math.max(1,rad*0.06);
    for(let gr=rad*0.32;gr<rad*0.94;gr+=rad*0.16){x.beginPath();x.arc(0,0,gr,0,7);x.stroke()}
    x.fillStyle='#fff2';x.beginPath();x.ellipse(-rad*0.32,-rad*0.4,rad*0.28,rad*0.12,-0.6,0,Math.PI*2);x.fill();
    x.fillStyle=q.col;x.beginPath();x.arc(0,0,rad*0.34,0,7);x.fill();
    x.fillStyle='#0006';x.beginPath();x.arc(0,0,rad*0.07,0,7);x.fill();
    x.restore();
  }else if(q.type==='cassette'){
    x.fillStyle='#0003';x.beginPath();x.ellipse(0,q.h*0.55,q.w*0.55,q.h*0.2,0,0,Math.PI*2);x.fill();
    rr(-q.w/2,-q.h/2,q.w,q.h,q.h*0.18,q.col);
    rr(-q.w*0.38,-q.h*0.3,q.w*0.76,q.h*0.6,4,'#f4ecd8');
    const rrad=q.h*0.17;
    [-q.w*0.2,q.w*0.2].forEach(rx=>{
      x.save();x.translate(rx,q.h*0.02);x.rotate(q.rot||0);
      x.fillStyle='#262626';x.beginPath();x.arc(0,0,rrad,0,7);x.fill();
      x.strokeStyle='#d8d2c2';x.lineWidth=Math.max(1,rrad*0.22);
      for(let s=0;s<3;s++){x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(s*2.094)*rrad*0.82,Math.sin(s*2.094)*rrad*0.82);x.stroke()}
      x.restore();
    });
    x.fillStyle='#3a2f22';x.font='800 '+(q.h*0.17)+'px system-ui';x.textAlign='center';x.fillText('MIX',0,q.h*0.44);
  }else{
    rr(-q.w/2,-q.h/2,q.w,q.h*0.8,7,q.col);
    rr(-q.w*0.25,-q.h*0.37,q.w*0.5,q.h*0.42,4,'#b9e8ed');
    x.fillStyle='#15171d';x.fillRect(-q.w*0.38,q.h*0.23,q.w*0.2,q.h*0.16);x.fillRect(q.w*0.18,q.h*0.23,q.w*0.2,q.h*0.16);
  }
  x.restore();
}
function bottle(){
  const U=CELL_Y;
  const a=p.x,b=p.y-p.j*U*0.22;
  x.save();x.translate(a,b);
  x.fillStyle='#0003';x.beginPath();x.ellipse(0,U*0.45,U*0.68,U*0.2,0,0,Math.PI*2);x.fill();
  rr(-U*0.5,-U*0.7,U*1.0,U*0.98,U*0.25,'#f6a832');
  rr(-U*0.45,-U*0.13,U*0.9,U*0.55,U*0.13,'#fff0bf');
  x.fillStyle='#6d3011';x.font='900 '+(U*0.22)+'px system-ui';x.textAlign='center';
  x.fillText('MAPLE',0,U*0.08);x.font='900 '+(U*0.3)+'px system-ui';x.fillText('🍁',0,U*0.36);
  rr(-U*0.35,-U*0.95,U*0.7,U*0.22,U*0.1,'#e33e24');rr(-U*0.22,-U*1.12,U*0.44,U*0.2,U*0.08,'#b92d1c');
  x.fillStyle='#351c10';x.beginPath();x.arc(-U*0.2,-U*0.5,U*0.06,0,7);x.arc(U*0.2,-U*0.5,U*0.06,0,7);x.fill();
  x.restore();
}
function draw(){
  x.clearRect(0,0,W,H);
  bg();
  cars.forEach(car);
  parts.forEach(q=>{x.globalAlpha=q.l;x.fillStyle=q.col;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.globalAlpha=1});
  bottle();
}
function loop(t){
  raf=requestAnimationFrame(loop);
  let dt=Math.min(.04,(t-last)/1000||0);last=t;
  update(dt);draw();
  if(state!=='play'){cancelAnimationFrame(raf);raf=0}
}

// ---------- input ----------
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();move(map[e.key])}},{passive:false});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));
document.querySelector('#play').onclick=start;
document.querySelector('#retry').onclick=start;
let sw=null;
c.addEventListener('pointerdown',e=>sw={x:e.clientX,y:e.clientY});
c.addEventListener('pointerup',e=>{
  if(!sw)return;
  let dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  else move('up');
  sw=null;
});

buildLayout(true);
populateCars();
draw();
})();
</script></body></html>
