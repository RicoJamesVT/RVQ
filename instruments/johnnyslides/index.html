html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	background: #fff;
}

#skifree-canvas {
	display: block;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	vertical-align: top;
	touch-action: none; /* dragging/steering, not page scroll/zoom/pull-to-refresh */
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	outline: none;
	cursor: crosshair;
}

#banner{
	height: 149px;
	width: 149px;
	overflow:hidden;
	padding: 0;
	margin: 0;
}

#banner a{
	
	display: block;
	width: 190px;
	font-size: 14px;
	font-family: Frutiger, "Frutiger Linotype", Univers, Calibri, "Gill Sans", "Gill Sans MT", 
		"Myriad Pro", Myriad, "DejaVu Sans Condensed", "Liberation Sans", "Nimbus Sans L", Tahoma, 
		Geneva, "Helvetica Neue", Helvetica, Arial, sans serif;
	background-color: #333;
	color: #FFF;
	word-spacing: 2px;
	text-decoration: none;
	padding: 5px 15px 5px 25px;
	
	position:relative;
	left: 20px;
	top: -37px;
	text-align: center;
	
	-moz-transform-origin: 0 0 ;
	-moz-transform:rotate(45deg);
	-moz-box-shadow:    1px 1px 5px 1px #666;
	
	-webkit-transform-origin: 0 0 ;	
	-webkit-transform:rotate(45deg);
	-webkit-box-shadow: 1px 1px 5px 1px #666;
	
	-ms-transform-origin: 0 0 ;	
	-ms-transform:rotate(45deg);
	-ms-box-shadow: 1px 1px 5px 1px #666;
	
	transform-origin: 0 0 ;	
	transform:rotate(45deg);
	box-shadow: 1px 1px 5px 1px #666;
	
	background-image: linear-gradient(bottom, #000000 3%, #666666 5%, #000000 7%, #000000 93%, #666666 95%, #000000 97%);
	background-image: -o-linear-gradient(bottom, #000000 3%, #666666 5%, #000000 7%, #000000 93%, #666666 95%, #000000 97%);
	background-image: -moz-linear-gradient(bottom, #000000 3%, #666666 5%, #000000 7%, #000000 93%, #666666 95%, #000000 97%);
	background-image: -webkit-linear-gradient(bottom, #000000 3%, #666666 5%, #000000 7%, #000000 93%, #666666 95%, #000000 97%);
	background-image: -ms-linear-gradient(bottom, #000000 3%, #666666 5%, #000000 7%, #000000 93%, #666666 95%, #000000 97%);
	
	background-image: -webkit-gradient(
		linear,
		left bottom,
		left top,
		color-stop(0.03, #000000),
		color-stop(0.05, #666666),
		color-stop(0.07, #000000),
		color-stop(0.93, #000000),
		color-stop(0.95, #666666),
		color-stop(0.97, #000000)
	);	
	
}

  function buildJumpSheet() {
    const sheet = document.createElement("canvas");
    sheet.width = 72;

    const c = sheet.getContext("2d");
    // Paint one shape: insideFn says which pixels belong to it, fillFn picks
    // their colour, and any pixel touching the outside gets the outline.
    function shape(ox, oy, w, h, insideFn, fillFn, outline) {
      const inside = (x, y) => x >= 0 && y >= 0 && x < w && y < h && insideFn(x, y);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!inside(x, y)) continue;
          const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1);
          c.fillStyle = edge ? outline : fillFn(x, y);
          c.fillRect(ox + x, oy + y, 1, 1);
        }
      }
    }

    const BW = 28;
    const BH = 11;
    const bumpTop = (x) => BH - (Math.round(9 * Math.sin(Math.PI * (x + 0.5) / BW)) + 1);
    shape(0, 0, BW, BH, (x, y) => y >= bumpTop(x), (x, y) => {
      if (y === BH - 1) return "#7f9bd6";
      if (x < BW * 0.5 && y <= bumpTop(x) + 2) return "#ffffff";
      if (x > BW * 0.6 && y > bumpTop(x) + 2) return "#a9c4f5";
      return "#dbe8ff";

    const KW = 40;

    shape(0, 14, KW, 16, (x, y) => {

        const inset = Math.round(5 * (1 - y / (KS - 1)));
        return x >= inset && x < KW - inset;
      }
      return true;
    }, (x, y) => {
      if (y < KS) return y >> 1 & 1 ? "#ffffff" : "#ff0000";
      if (y === KS) return "#000000";
      if (y === KS + 2 || y === KS + 3) return x >> 2 & 1 ? "#ffff00" : "#000000";

      if (yy < 16) {

    function tickNPCs() {
      randomlySpawnNPC(spawnBoarder, 0.1);
      state.distanceTravelled = parseFloat(player.getPixelsTravelledDownMountain() / PIXELS_PER_METRE).toFixed(1);
      if (state.distanceTravelled > MONSTER_DISTANCE_THRESHOLD) {
        randomlySpawnNPC(spawnMonster, 1e-3);
      }
    }
    player = new skier_default(spriteInfo_default.skier);
    player.setMapPosition(0, 0);
    player.setMapPositionTarget(0, -10);
    game = new game_default(camera, player);
    startSign = new sprite_default(spriteInfo_default.signStart);
    game.addStaticObject(startSign);
    startSign.setMapPosition(-50, 0);
    game.beforeCycle(() => {
      game.addStaticObjects(spawnTerrain());
      if (!game.isPaused()) {
        tickNPCs();
      }
    });
    game.afterCycle(() => {
      if (state.livesLeft === 0) detectEnd();
    });
    game.addUIElement({ draw: (ctx) => player.drawTrickPopups(ctx) });
    setupInput({ player, game, canvas: mainCanvas, spawnMonster, spawnBoarder, resetGame });
    player.isMoving = false;
    player.setDirection(270);
    game.start();
  }
  function getViewportSize() {
    if (window.visualViewport) {
      return { width: window.visualViewport.width, height: window.visualViewport.height };
    }
    return { width: window.innerWidth, height: window.innerHeight };
  }
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const { width, height } = getViewportSize();
    mainCanvas.style.width = `${width}px`;
    mainCanvas.style.height = `${height}px`;
    mainCanvas.width = Math.round(width * dpr);
    mainCanvas.height = Math.round(height * dpr);
    camera.scale(dpr, dpr);
    camera.imageSmoothingEnabled = false;
  }
  var resizeRaf = null;
  function scheduleResize() {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;
      resizeCanvas();
    });
  }
  window.addEventListener("resize", scheduleResize, false);
  window.addEventListener("orientationchange", () => {
    scheduleResize();
    setTimeout(scheduleResize, 120);
    setTimeout(scheduleResize, 350);
  }, false);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleResize, false);
  }
  resizeCanvas();
  loadImages(imageSources, () => {
    buildJumpSheet();
    startNeverEndingGame();
  });
})();

</script>
</body>
