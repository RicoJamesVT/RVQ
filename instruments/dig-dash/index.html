<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DIG DASH</title>
<style>
  :root{
    --sky-top:#FF9A76;
    --sky-mid:#FFC15E;
    --sky-low:#FFE29A;
    --plum:#3A2E5C;
    --plum-deep:#251d3a;
    --teal:#2EC4B6;
    --teal-deep:#1f9c90;
    --cream:#FFF6E9;
    --coral:#FF6B6B;
    --gold:#FFD166;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--plum-deep);
    font-family:'Nunito', system-ui, sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #game-canvas{ position:fixed; inset:0; display:block; }

  .display{ font-family:'Baloo 2', system-ui, sans-serif; }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; inset:0; pointer-events:none;
    padding: max(16px, env(safe-area-inset-top)) 18px 0 18px;
    display:none;
    z-index:5;
  }
  #hud.show{ display:block; }
  .hud-row{ display:flex; justify-content:space-between; align-items:flex-start; }
  .score-box{
    background:rgba(58,46,92,0.55);
    backdrop-filter:blur(6px);
    border-radius:16px;
    padding:8px 16px;
    color:var(--cream);
  }
  .score-box .label{ font-size:11px; letter-spacing:0.04em; opacity:0.75; font-weight:700; }
  .score-box .value{ font-family:'Baloo 2',sans-serif; font-size:28px; font-weight:700; line-height:1.1; }
  .combo-tag{
    margin-top:6px; font-size:13px; font-weight:800; color:var(--gold);
    opacity:0; transform:translateY(-4px); transition:opacity .15s, transform .15s;
  }
  .combo-tag.show{ opacity:1; transform:translateY(0); }
  .lives{ display:flex; gap:6px; background:rgba(58,46,92,0.55); backdrop-filter:blur(6px); border-radius:16px; padding:10px 14px; }
  .heart{ width:20px; height:20px; transition:transform .2s; }
  .heart.lost{ transform:scale(0); opacity:0.25; }

  /* ---------- Overlays ---------- */
  .screen{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:radial-gradient(ellipse at 50% 20%, rgba(255,154,118,0.35), rgba(37,29,58,0.78) 70%);
  }
  .screen.hidden{ display:none; }
  .card{
    width:100%; max-width:420px;
    background:var(--cream);
    border-radius:28px;
    padding:34px 30px 28px;
    text-align:center;
    box-shadow:0 24px 60px rgba(20,14,36,0.45);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:-60px; right:-60px;
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:0.5;
  }
  .vinyl-mark{
    width:74px; height:74px; margin:0 auto 6px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, var(--gold) 0 9%, #201530 10% 13%, transparent 14%),
      repeating-radial-gradient(circle at center, #201530 0 2px, #2b1e40 2px 5px);
    animation: spin 6s linear infinite;
    box-shadow:0 8px 18px rgba(0,0,0,0.25);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1.title{
    font-size:44px; color:var(--plum); line-height:0.95; letter-spacing:0.01em;
    margin:6px 0 2px;
  }
  h1.title span{ color:var(--coral); }
  .tagline{ color:var(--plum); opacity:0.72; font-weight:700; font-size:14.5px; margin-bottom:20px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:20px;
    color:var(--cream); background:var(--teal);
    border:none; border-radius:18px;
    padding:15px 20px; width:100%;
    cursor:pointer;
    box-shadow:0 8px 0 var(--teal-deep), 0 14px 22px rgba(31,156,144,0.35);
    transform:translateY(0);
    transition:transform .08s, box-shadow .08s;
    pointer-events:auto;
  }
  .btn:active{ transform:translateY(6px); box-shadow:0 2px 0 var(--teal-deep), 0 4px 10px rgba(31,156,144,0.3); }
  .btn.secondary{ background:var(--plum); box-shadow:0 8px 0 var(--plum-deep), 0 14px 22px rgba(37,29,58,0.35); margin-top:12px; }
  .btn.secondary:active{ box-shadow:0 2px 0 var(--plum-deep), 0 4px 10px rgba(37,29,58,0.3); }

  .controls-hint{
    margin-top:20px; display:flex; justify-content:center; gap:14px;
    color:var(--plum); opacity:0.65; font-size:12px; font-weight:700;
  }
  .controls-hint .k{
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .k .icon{
    width:30px; height:30px; border-radius:9px; background:rgba(58,46,92,0.1);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .best-row{ display:flex; justify-content:center; gap:22px; margin-bottom:18px; }
  .best-row .stat{ text-align:center; }
  .best-row .stat .n{ font-family:'Baloo 2',sans-serif; font-size:30px; color:var(--plum); font-weight:700; }
  .best-row .stat .l{ font-size:11px; color:var(--plum); opacity:0.6; font-weight:700; letter-spacing:0.03em; }
  .new-best{
    display:inline-block; background:var(--gold); color:var(--plum-deep);
    font-weight:800; font-size:12px; padding:4px 10px; border-radius:20px;
    margin-bottom:10px; letter-spacing:0.03em;
  }

  #countdown{
    position:fixed; inset:0; z-index:8; display:none;
    align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-size:120px; font-weight:700;
    color:var(--cream); text-shadow:0 10px 30px rgba(0,0,0,0.35);
    pointer-events:none;
  }
  #countdown.show{ display:flex; }

  #flash{
    position:fixed; inset:0; z-index:6; background:var(--coral);
    opacity:0; pointer-events:none; transition:opacity .08s;
  }

  .loading{
    position:fixed; inset:0; z-index:20; background:var(--plum-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--cream); font-family:'Baloo 2',sans-serif; font-size:20px;
  }
  .loading .vinyl-mark{ margin-bottom:0; }

  @media (max-width:420px){
    h1.title{ font-size:38px; }
    .card{ padding:28px 22px 24px; }
  }
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="vinyl-mark"></div>
  <div>spinning up the crates…</div>
</div>

<canvas id="game-canvas"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="hud-row">
    <div class="score-box">
      <div class="label">SCORE</div>
      <div class="value" id="score-val">0</div>
      <div class="combo-tag" id="combo-tag">×2 COMBO</div>
    </div>
    <div class="lives" id="lives-box"></div>
  </div>
</div>

<div id="countdown"></div>

<div id="menu-screen" class="screen">
  <div class="card">
    <div class="vinyl-mark"></div>
    <h1 class="title display">DIG <span>DASH</span></h1>
    <div class="tagline">chase the vinyl. dodge the crates. keep the groove alive.</div>
    <button class="btn" id="play-btn">▶ Play</button>
    <div class="controls-hint">
      <div class="k"><div class="icon">⇄</div>Switch lane</div>
      <div class="k"><div class="icon">⇧</div>Jump</div>
      <div class="k"><div class="icon">⇩</div>Duck</div>
    </div>
  </div>
</div>

<div id="gameover-screen" class="screen hidden">
  <div class="card">
    <div id="new-best-tag" class="new-best" style="display:none;">NEW BEST!</div>
    <h1 class="title display" style="font-size:32px;">Crate Digger's<br><span>Wipeout</span></h1>
    <div class="best-row">
      <div class="stat"><div class="n" id="final-score">0</div><div class="l">SCORE</div></div>
      <div class="stat"><div class="n" id="final-records">0</div><div class="l">RECORDS</div></div>
      <div class="stat"><div class="n" id="final-best">0</div><div class="l">BEST</div></div>
    </div>
    <button class="btn" id="retry-btn">↻ Dig Again</button>
    <button class="btn secondary" id="menu-btn">Main Menu</button>
  </div>
</div>

<script src="../../lib/three.min.js"></script>
<script>
(function(){
"use strict";

/* =========================================================================
   DIG DASH — cozy 3D endless runner
   A crate-digging critter dashes down a sunset record-shop street,
   collecting floating vinyl while dodging crates, speaker stacks & carts.
   ========================================================================= */

/* ---------------------------- constants ---------------------------- */
const LANES = [-2.2, 0, 2.2];
const GRAVITY = -26;
const JUMP_VELOCITY = 10.2;
const DUCK_SCALE = 0.5;
const BASE_SPEED = 13;
const MAX_SPEED = 30;
const SPEED_RAMP_TIME = 90; // seconds to reach max speed
const SPAWN_Z = -70;
const DESPAWN_Z = 12;
const LANE_LERP = 10;
const START_LIVES = 3;

const COLORS = {
  bodyMain: 0x4FAE5E,
  bodyDark: 0x2F7A45,
  shellPattern: 0x8CE07A,
  skinLight: 0x8FD96B,
  cream: 0xFFF6E9,
  teal: 0x2EC4B6,
  plum: 0x3A2E5C,
  gold: 0xFFD166,
  coral: 0xFF6B6B,
  wood: 0xC77B44,
  woodDark: 0xA65F30,
  metal: 0xB9C4C9,
  road: 0xE8935A,
  roadLine: 0xFFF3E0,
  curb: 0xFFEDD0,
  vinylDark: 0x1E1730
};

/* ---------------------------- dom refs ---------------------------- */
const canvas = document.getElementById('game-canvas');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('score-val');
const comboTag = document.getElementById('combo-tag');
const livesBox = document.getElementById('lives-box');
const menuScreen = document.getElementById('menu-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const playBtn = document.getElementById('play-btn');
const retryBtn = document.getElementById('retry-btn');
const menuBtn = document.getElementById('menu-btn');
const finalScoreEl = document.getElementById('final-score');
const finalRecordsEl = document.getElementById('final-records');
const finalBestEl = document.getElementById('final-best');
const newBestTag = document.getElementById('new-best-tag');
const countdownEl = document.getElementById('countdown');
const flashEl = document.getElementById('flash');
const loadingEl = document.getElementById('loading');

/* ---------------------------- state ---------------------------- */
const STATE = { MENU:'menu', COUNTDOWN:'countdown', PLAYING:'playing', GAMEOVER:'gameover' };
let gameState = STATE.MENU;
let bestScore = 0;

/* ---------------------------- audio (tiny synth, no assets) ---------------------------- */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  } else if(actx.state === 'suspended'){
    actx.resume();
  }
}
function beep(freq, dur, type, gainVal, glideTo){
  if(!actx) return;
  try{
    const t0 = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
    gain.gain.setValueAtTime((gainVal!==undefined?gainVal:0.18), t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){}
}
const sfx = {
  jump: ()=>beep(420,0.16,'triangle',0.15,640),
  land: ()=>beep(180,0.08,'sine',0.12,120),
  collect: (combo)=>beep(520 + Math.min(combo,10)*40, 0.14, 'square', 0.12, 880 + Math.min(combo,10)*40),
  hit: ()=>{ beep(140,0.28,'sawtooth',0.2,60); },
  gameover: ()=>{ beep(300,0.35,'sine',0.18,80); },
  swoosh: ()=>beep(240,0.08,'sine',0.06,340)
};

/* ---------------------------- persistent storage (best score) ----------------------------
   Plain localStorage rather than the Claude-artifact `window.storage` API this
   game shipped with -- this page runs as a same-origin local file inside the
   main game's iframe overlay (see DIG_DASH_APP_URL/createDigDashOverlay() in
   game.js), not as a Claude artifact, so `window.storage` simply wouldn't
   exist here. localStorage works the same online or off, same as the rest of
   this bundled app. */
async function loadBest(){
  try{
    const v = window.localStorage.getItem('digdash-best');
    if(v){ bestScore = parseInt(v,10) || 0; }
  }catch(e){ /* storage unavailable (e.g. locked-down webview) — play without persistence */ }
}
async function saveBest(v){
  try{ window.localStorage.setItem('digdash-best', String(v)); }catch(e){}
}

/* ---------------------------- renderer / scene / camera ---------------------------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.sky || 0xFFC15E);
scene.fog = new THREE.Fog(0xFFC15E, 18, 62);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 5.6, 9.2);
camera.lookAt(0, 1.4, -6);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- sky gradient (backdrop dome) ---------- */
(function buildSky(){
  const skyGeo = new THREE.SphereGeometry(150, 24, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{
      top:{ value: new THREE.Color(0xFF9A76) },
      mid:{ value: new THREE.Color(0xFFC15E) },
      low:{ value: new THREE.Color(0xFFE29A) }
    },
    vertexShader:`
      varying vec3 vPos;
      void main(){
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader:`
      varying vec3 vPos;
      uniform vec3 top; uniform vec3 mid; uniform vec3 low;
      void main(){
        float h = normalize(vPos).y;
        vec3 col = h > 0.15 ? mix(mid, top, smoothstep(0.15,0.9,h)) : mix(low, mid, smoothstep(-0.15,0.15,h));
        gl_FragColor = vec4(col,1.0);
      }
    `
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // simple glowing sun
  const sunGeo = new THREE.CircleGeometry(9, 32);
  const sunMat = new THREE.MeshBasicMaterial({ color:0xFFE9B8, transparent:true, opacity:0.9 });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  sun.position.set(-10, 16, -95);
  scene.add(sun);
})();

/* ---------- lighting ---------- */
const hemi = new THREE.HemisphereLight(0xFFE3B0, 0xE8935A, 0.75);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xFFE0B0, 1.05);
sunLight.position.set(-8, 16, 6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024,1024);
sunLight.shadow.camera.left = -14; sunLight.shadow.camera.right = 14;
sunLight.shadow.camera.top = 14; sunLight.shadow.camera.bottom = -14;
sunLight.shadow.camera.near = 1; sunLight.shadow.camera.far = 40;
scene.add(sunLight);
const fillLight = new THREE.PointLight(0x2EC4B6, 0.35, 30);
fillLight.position.set(4, 4, 4);
scene.add(fillLight);

/* ============================================================
   PARTICLE SYSTEM — pooled THREE.Points, additive glow-fade
   ============================================================ */
function ParticleSystem(maxCount, size, opacity){
  this.max = maxCount;
  this.positions = new Float32Array(maxCount*3);
  this.colors = new Float32Array(maxCount*3);
  this.baseColor = new Float32Array(maxCount*3);
  this.velocities = [];
  this.life = new Float32Array(maxCount);
  this.maxLife = new Float32Array(maxCount);
  this.active = new Uint8Array(maxCount);
  this.cursor = 0;
  for(let i=0;i<maxCount;i++) this.velocities.push(new THREE.Vector3());

  this.geo = new THREE.BufferGeometry();
  this.geo.setAttribute('position', new THREE.BufferAttribute(this.positions,3));
  this.geo.setAttribute('color', new THREE.BufferAttribute(this.colors,3));
  this.mat = new THREE.PointsMaterial({
    size:size, vertexColors:true, transparent:true, opacity:opacity!==undefined?opacity:1,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  });
  this.points = new THREE.Points(this.geo, this.mat);
  this.points.frustumCulled = false;
}
ParticleSystem.prototype.emit = function(pos, vel, life, color, jitter){
  const i = this.cursor;
  this.cursor = (this.cursor+1) % this.max;
  this.active[i] = 1;
  this.life[i] = life;
  this.maxLife[i] = life;
  const jx = jitter ? (Math.random()-0.5)*jitter : 0;
  const jy = jitter ? (Math.random()-0.5)*jitter : 0;
  const jz = jitter ? (Math.random()-0.5)*jitter : 0;
  this.positions[i*3] = pos.x+jx; this.positions[i*3+1] = pos.y+jy; this.positions[i*3+2] = pos.z+jz;
  this.velocities[i].copy(vel);
  this.baseColor[i*3]=color.r; this.baseColor[i*3+1]=color.g; this.baseColor[i*3+2]=color.b;
  this.colors[i*3]=color.r; this.colors[i*3+1]=color.g; this.colors[i*3+2]=color.b;
};
ParticleSystem.prototype.update = function(delta, gravity){
  let anyActive = false;
  for(let i=0;i<this.max;i++){
    if(!this.active[i]) continue;
    anyActive = true;
    this.life[i] -= delta;
    if(this.life[i] <= 0){
      this.active[i] = 0;
      this.colors[i*3]=0; this.colors[i*3+1]=0; this.colors[i*3+2]=0;
      continue;
    }
    const v = this.velocities[i];
    if(gravity) v.y += gravity*delta;
    this.positions[i*3] += v.x*delta;
    this.positions[i*3+1] += v.y*delta;
    this.positions[i*3+2] += v.z*delta;
    const t = Math.max(0, this.life[i]/this.maxLife[i]);
    this.colors[i*3] = this.baseColor[i*3]*t;
    this.colors[i*3+1] = this.baseColor[i*3+1]*t;
    this.colors[i*3+2] = this.baseColor[i*3+2]*t;
  }
  this.geo.attributes.position.needsUpdate = true;
  this.geo.attributes.color.needsUpdate = true;
  return anyActive;
};

const trailFx = new ParticleSystem(120, 0.22, 0.85);
const burstFx = new ParticleSystem(220, 0.34, 0.95);
const ambientFx = new ParticleSystem(90, 0.16, 0.5);
scene.add(trailFx.points, burstFx.points, ambientFx.points);

// seed gentle ambient background sparkles (fireflies / dust motes)
const ambientSeeds = [];
for(let i=0;i<70;i++){
  ambientSeeds.push({
    x:(Math.random()-0.5)*40,
    y:1+Math.random()*7,
    z:-Math.random()*70+5,
    phase:Math.random()*Math.PI*2,
    speed:0.3+Math.random()*0.4
  });
}
const ambientColor = new THREE.Color(COLORS.gold);

/* ============================================================
   GROUND — recycled tiles with lane markings + curb
   ============================================================ */
const TILE_LEN = 20;
const TILE_COUNT = 6;
const groundTiles = [];
const groundGroup = new THREE.Group();
scene.add(groundGroup);

function makeGroundTile(index){
  const g = new THREE.Group();
  const roadGeo = new THREE.PlaneGeometry(9, TILE_LEN);
  const roadMat = new THREE.MeshStandardMaterial({ color: COLORS.road, roughness:0.95 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI/2;
  road.receiveShadow = true;
  g.add(road);

  // lane divider stripes (dashed)
  for(const lx of [-1.1, 1.1]){
    for(let s=0; s<4; s++){
      const stripe = new THREE.Mesh(
        new THREE.PlaneGeometry(0.14, 2.2),
        new THREE.MeshStandardMaterial({ color: COLORS.roadLine, roughness:0.8 })
      );
      stripe.rotation.x = -Math.PI/2;
      stripe.position.set(lx, 0.01, -TILE_LEN/2 + s*5 + 1);
      g.add(stripe);
    }
  }
  // curbs
  for(const side of [-1,1]){
    const curb = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.3, TILE_LEN),
      new THREE.MeshStandardMaterial({ color: COLORS.curb, roughness:0.9 })
    );
    curb.position.set(side*4.8, 0.15, 0);
    curb.receiveShadow = true;
    curb.castShadow = false;
    g.add(curb);
  }
  g.position.z = SPAWN_Z - index*TILE_LEN + TILE_LEN*2;
  groundGroup.add(g);
  return g;
}
for(let i=0;i<TILE_COUNT;i++) groundTiles.push(makeGroundTile(i));

/* ============================================================
   SCENERY — lampposts / crates / bunting along the sides
   ============================================================ */
const sceneryGroup = new THREE.Group();
scene.add(sceneryGroup);
const sceneryPool = [];

function makeLamp(){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,3.4,8), new THREE.MeshStandardMaterial({color:COLORS.plum, roughness:0.6}));
  pole.position.y = 1.7; pole.castShadow = true;
  g.add(pole);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32,10,10), new THREE.MeshStandardMaterial({color:COLORS.gold, emissive:0xFFB84D, emissiveIntensity:0.7, roughness:0.4}));
  head.position.y = 3.5;
  g.add(head);
  const glow = new THREE.PointLight(0xFFC97A, 0.6, 5);
  glow.position.y = 3.5;
  g.add(glow);
  return g;
}
function makeCratePile(){
  const g = new THREE.Group();
  const colors = [COLORS.wood, COLORS.teal, COLORS.coral];
  for(let i=0;i<3;i++){
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.55,0.7), new THREE.MeshStandardMaterial({color:colors[i%colors.length], roughness:0.8}));

/* ============================================================
   SPAWNING LOGIC
   ============================================================ */
let distanceUntilSpawn = 14;
let elapsed = 0;
let gameSpeed = BASE_SPEED;

function currentDifficultyT(){
  return Math.min(1, elapsed/SPEED_RAMP_TIME);
}

function spawnRow(){
  const t = currentDifficultyT();
  const roll = Math.random();

  if(roll < 0.42){
    // collectible row: a line or arc of records
    const pattern = Math.random();
    const laneChoice = Math.floor(Math.random()*3);
    if(pattern < 0.55){
      // straight line down one lane
      const count = 4 + Math.floor(Math.random()*3);
      for(let i=0;i<count;i++){
        const r = getRecord();
        if(!r) break;
        r.visible = true;
        r.userData.active = true;
        r.userData.collected = false;
        r.userData.lane = laneChoice;
        r.userData.baseY = 1.05;
        r.position.set(LANES[laneChoice], 1.05, SPAWN_Z - i*1.6);
      }
    } else {
      // arc across all 3 lanes
      for(let i=0;i<3;i++){
        const r = getRecord();
        if(!r) break;
        r.visible = true;
        r.userData.active = true;
        r.userData.collected = false;
        r.userData.lane = i;
        r.userData.baseY = 1.05;
        r.position.set(LANES[i], 1.05, SPAWN_Z - Math.abs(i-1)*1.4);
      }
    }
  } else {
    // obstacle row: block 1-2 lanes, always leave >=1 open
    const numBlocked = Math.random() < (0.3+t*0.3) ? 2 : 1;
    const lanesShuffled = [0,1,2].sort(()=>Math.random()-0.5);
    const blockedLanes = lanesShuffled.slice(0, numBlocked);
    let dodgeUsed = false;
    for(const lane of blockedLanes){
      let typeIdx;
      if(!dodgeUsed && Math.random() < 0.3 && numBlocked < 3){
        typeIdx = 2; dodgeUsed = true; // dodge (must switch lane)
      } else {
        typeIdx = Math.random() < 0.5 ? 0 : 1; // jump or duck
      }
      const o = getObstacle(typeIdx);
      if(!o) continue;
      o.visible = true;
      o.userData.active = true;
      o.userData.hit = false;
      o.position.set(LANES[lane], 0, SPAWN_Z);
      // bonus record above a jump crate sometimes
      if(typeIdx===0 && Math.random()<0.4){
        const r = getRecord();
        if(r){
          r.visible = true; r.userData.active = true; r.userData.collected = false;
          r.userData.lane = lane; r.userData.baseY = 1.75;
          r.position.set(LANES[lane], 1.75, SPAWN_Z);
        }
      }
    }
  }

  const minGap = 9 - t*3.5;
  const maxGap = 15 - t*5;
  distanceUntilSpawn = minGap + Math.random()*(maxGap-minGap);
}

/* ============================================================
   INPUT
   ============================================================ */
function changeLane(dir){
  if(gameState !== STATE.PLAYING) return;
  const newLane = Math.max(0, Math.min(2, player.laneIndex+dir));
  if(newLane !== player.laneIndex){
    player.laneIndex = newLane;
    player.tilt = -dir*0.5;
    sfx.swoosh();
  }
}
function doJump(){
  if(gameState !== STATE.PLAYING) return;
  if(!player.isJumping && !player.isDucking){
    player.velY = JUMP_VELOCITY;
    player.isJumping = true;
    sfx.jump();
  }
}
function duckStart(){
  if(gameState !== STATE.PLAYING) return;
  if(!player.isJumping){ player.isDucking = true; player.duckHeld = true; }
}
function duckEnd(){ player.duckHeld = false; player.isDucking = false; }

window.addEventListener('keydown', function(e){
  const k = e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  if(k==='ArrowLeft' || k==='a' || k==='A') changeLane(-1);
  else if(k==='ArrowRight' || k==='d' || k==='D') changeLane(1);
  else if(k==='ArrowUp' || k==='w' || k==='W' || k===' ') doJump();
  else if(k==='ArrowDown' || k==='s' || k==='S') duckStart();
});
window.addEventListener('keyup', function(e){
  const k = e.key;
  if(k==='ArrowDown' || k==='s' || k==='S') duckEnd();
});

let touchStartX=0, touchStartY=0, touchActive=false;
canvas.addEventListener('touchstart', function(e){
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchActive = true;
}, {passive:true});
canvas.addEventListener('touchend', function(e){
  if(!touchActive) return;
  touchActive = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 28){
    changeLane(dx>0?1:-1);
  } else if(Math.abs(dy) > 28){
    if(dy < 0) doJump();
    else { duckStart(); setTimeout(duckEnd, 480); }
  } else {
    doJump(); // tap = jump
  }
}, {passive:true});

  let n = 3;

    else{

      countdownEl.classList.remove('show');
      gameState = STATE.PLAYING;
    }
  }, 650);

function endGame(){
  gameState = STATE.GAMEOVER;

  triggerShake(0.35, 0.4);
  const finalScore = Math.floor(score);
  finalScoreEl.textContent = finalScore;
  finalRecordsEl.textContent = recordsCollected;
  const isNewBest = finalScore > bestScore;
  if(isNewBest){ bestScore = finalScore; saveBest(bestScore); }
  finalBestEl.textContent = bestScore;
  newBestTag.style.display = isNewBest ? 'inline-block' : 'none';
  setTimeout(function(){
    hud.classList.remove('show');
    gameoverScreen.classList.remove('hidden');
  }, 500);
}

   ============================================================ */
function handleHit(){
  if(player.invincible) return;
  lives -= 1;
  combo = 0;
  comboTag.classList.remove('show');
  player.invincible = true;
  player.invincibleTimer = 1.3;
  sfx.hit();
  triggerShake(0.22, 0.3);
  flashEl.style.opacity = '0.5';
  setTimeout(function(){ flashEl.style.opacity='0'; }, 110);
  updateHearts();

  const p = new THREE.Vector3(player.x, 1.1, 0);
  const burstColor = new THREE.Color(COLORS.coral);
  for(let i=0;i<26;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 2+Math.random()*3;
    burstFx.emit(p, new THREE.Vector3(Math.cos(ang)*spd, 2+Math.random()*3, Math.sin(ang)*spd), 0.5+Math.random()*0.4, burstColor, 0.3);
  }

  if(lives <= 0) endGame();
}

function collectRecord(rec){
  rec.userData.active = false;
  rec.userData.collected = true;
  rec.visible = false;
  combo += 1;
  const multiplier = 1 + Math.floor(combo/5);
  score += 15*multiplier;
  recordsCollected += 1;
  sfx.collect(combo);

  if(combo >= 2){
    comboTag.textContent = '×'+multiplier+' COMBO ('+combo+')';
    comboTag.classList.add('show');
    comboFadeTimer = 1.6;
  }

  const p = rec.position.clone();
  const col = new THREE.Color(COLORS.gold);
  for(let i=0;i<16;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 1.2+Math.random()*2.2;
    burstFx.emit(p, new THREE.Vector3(Math.cos(ang)*spd, 1.5+Math.random()*2, Math.sin(ang)*spd), 0.4+Math.random()*0.3, col, 0.15);
  }
}

/* ============================================================
   MAIN UPDATE LOOP
   ============================================================ */
const clock = new THREE.Clock();
let trailTimer = 0;

function updatePlayer(delta){
  // difficulty ramp
  elapsed += delta;
  const t = currentDifficultyT();
  gameSpeed = BASE_SPEED + (MAX_SPEED-BASE_SPEED)*t;

  // lane lerp
  const targetX = LANES[player.laneIndex];
  player.x += (targetX - player.x) * Math.min(1, LANE_LERP*delta);

  // vertical physics
  if(player.isJumping){
    player.velY += GRAVITY*delta;
    player.y += player.velY*delta;
    if(player.y <= 0){
      player.y = 0; player.velY = 0; player.isJumping = false;
      sfx.land();
      const p = new THREE.Vector3(player.x, 0.1, 0);
      const col = new THREE.Color(COLORS.curb);
      for(let i=0;i<8;i++){
        burstFx.emit(p, new THREE.Vector3((Math.random()-0.5)*1.5, 1+Math.random(), (Math.random()-0.5)*1.5), 0.3, col, 0.2);
      }
      if(player.duckHeld) player.isDucking = true;
    }
  }

  // duck lerp scale
  const targetScaleY = player.isDucking ? DUCK_SCALE : 1;
  bodyPivot.scale.y += (targetScaleY - bodyPivot.scale.y) * Math.min(1, 14*delta);

  // run cycle bob (squash/stretch), scaled by speed
  player.runPhase += delta * (8 + gameSpeed*0.35);
  const bob = Math.abs(Math.sin(player.runPhase)) * 0.09;
  const squash = 1 - Math.sin(player.runPhase*2)*0.03;

  playerGroup.position.set(player.x, player.y, 0);
  bodyPivot.position.y = bob;
  if(!player.isDucking){
    bodyPivot.scale.x = squash;
    bodyPivot.scale.z = squash;
  }

  // feet alternate
  feet[0].position.y = 0.16 + Math.max(0, Math.sin(player.runPhase))*0.08;
  feet[1].position.y = 0.16 + Math.max(0, Math.sin(player.runPhase+Math.PI))*0.08;

  // tail wag
  tail.rotation.z = Math.sin(player.runPhase*1.4)*0.2;

  // lane-change tilt & jump lean
  player.tilt += (0 - player.tilt) * Math.min(1, 6*delta);
  playerGroup.rotation.z = player.tilt;
  playerGroup.rotation.x = player.isJumping ? -0.12 : 0;

  // invincibility flicker
  if(player.invincible){
    player.invincibleTimer -= delta;
    const blink = Math.floor(player.invincibleTimer*14)%2===0;
    playerGroup.visible = blink;
    if(player.invincibleTimer <= 0){ player.invincible = false; playerGroup.visible = true; }
  }

  // trail particles behind player
  trailTimer -= delta;
  if(trailTimer <= 0 && (gameSpeed>0)){
    trailTimer = 0.03;
    const col = new THREE.Color(COLORS.cream);
    trailFx.emit(
      new THREE.Vector3(player.x + (Math.random()-0.5)*0.3, 0.15, 0.6),
      new THREE.Vector3((Math.random()-0.5)*0.4, 0.6+Math.random()*0.6, 1.5+Math.random()),
      0.35+Math.random()*0.2, col, 0.1
    );
  }

  score += gameSpeed*delta*0.9;
  scoreVal.textContent = Math.floor(score);

  if(comboFadeTimer>0){
    comboFadeTimer -= delta;
    if(comboFadeTimer<=0) comboTag.classList.remove('show');
  }
}

function updateWorld(delta){
  const dz = gameSpeed*delta;
  distanceUntilSpawn -= dz;
  if(distanceUntilSpawn <= 0) spawnRow();

  // ground tiles recycle
  for(const tile of groundTiles){
    tile.position.z += dz;
    if(tile.position.z > TILE_LEN*1.5){
      tile.position.z -= TILE_LEN*TILE_COUNT;
    }
  }

  // scenery recycle
  for(const item of sceneryPool){
    item.position.z += dz;
    if(item.position.z > 12){
      item.position.z = SPAWN_Z - Math.random()*20;
      const side = Math.random()<0.5?-1:1;
      item.position.x = side*(5.6+Math.random()*1.4);
    }
  }

  // obstacles
  const pz = 0, plx = player.x;
  for(const o of obstaclePool){
    if(!o.userData.active) continue;
    o.position.z += dz;
    o.rotation.y = 0;
    if(o.position.z > DESPAWN_Z){
      o.userData.active = false; o.visible = false; continue;
    }
    if(!o.userData.hit && Math.abs(o.position.z - pz) < o.userData.radiusZ && Math.abs(o.position.x - plx) < 0.55){
      const type = o.userData.type;
      let collided = false;
      if(type === 'jump'){ collided = player.y < o.userData.clearHeight - 0.15; }
      else if(type === 'duck'){ collided = !player.isDucking; }
      else if(type === 'dodge'){ collided = true; }
      if(collided){
        o.userData.hit = true;
        handleHit();
      }
    }
  }

  // collectibles
  for(const r of recordPool){
    if(!r.userData.active) continue;
    r.position.z += dz;
    r.rotation.y += delta*5;
    r.position.y = r.userData.baseY + Math.sin(elapsed*4 + r.userData.bobSeed)*0.12;
    if(r.position.z > DESPAWN_Z){
      r.userData.active = false; r.visible = false; continue;
    }
    if(Math.abs(r.position.z - pz) < 0.65 && Math.abs(r.position.x - plx) < 0.55){
      collectRecord(r);
    }
  }
}

function updateAmbient(delta, dz){
  for(let i=0;i<ambientSeeds.length;i++){
    const s = ambientSeeds[i];
    if(gameState === STATE.PLAYING) s.z += dz;
    s.phase += delta*s.speed;
    if(s.z > 12){ s.z = SPAWN_Z - Math.random()*20; s.x = (Math.random()-0.5)*40; s.y = 1+Math.random()*7; }
    if(i < ambientFx.max){
      // reuse ambient particle slot directly for a persistent floaty look
    }
  }
  // lightweight: emit a few ambient sparkles continuously
  ambientEmitTimer -= delta;
  if(ambientEmitTimer <= 0){
    ambientEmitTimer = 0.12;
    const s = ambientSeeds[Math.floor(Math.random()*ambientSeeds.length)];
    ambientFx.emit(
      new THREE.Vector3(s.x, s.y + Math.sin(s.phase)*0.6, s.z),
      new THREE.Vector3(0,0.15,0),
      1.4, ambientColor, 0.05
    );
  }
}
let ambientEmitTimer = 0;

function updateCamera(delta){
  const followX = player.x*0.55;
  camera.position.x += (followX - camera.position.x)*Math.min(1, 5*delta);
  let shakeX=0, shakeY=0;
  if(shakeTime>0){
    shakeTime -= delta;
    const m = shakeMag * Math.max(0,shakeTime);
    shakeX = (Math.random()-0.5)*m;
    shakeY = (Math.random()-0.5)*m;
  }
  camera.position.y = 5.6 + shakeY;
  camera.lookAt(camera.position.x*0.3, 1.4, -6);
  camera.position.z = 9.2 + shakeX*0.4;
}

function animate(){
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  if(gameState === STATE.PLAYING){
    updatePlayer(delta);
    updateWorld(delta);
    updateAmbient(delta, gameSpeed*delta);
  } else {
    // idle ambient motion on menu / gameover for a living background
    updateAmbient(delta, 0);
    player.runPhase += delta*3;
    bodyPivot.position.y = Math.abs(Math.sin(player.runPhase))*0.06;
    tail.rotation.z = Math.sin(player.runPhase*1.2)*0.15;
  }

  trailFx.update(delta, -1.5);
  burstFx.update(delta, -4);
  ambientFx.update(delta, 0.1);

  updateCamera(delta);
  renderer.render(scene, camera);
}

/* ---------------------------- boot ---------------------------- */
async function boot(){
  resize();
  await loadBest();
  loadingEl.style.display = 'none';
  animate();
}
boot();

})();
</script>
