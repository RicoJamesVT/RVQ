<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rico's Beat Bot</title>
<style>
  :root {
    color-scheme: dark;
    --background: #191510;
    --foreground: #f4ecd8;
    --card: #221c15;
    --card-border: rgba(244,236,216,0.14);
    --primary: #e0b040;
    --primary-foreground: #241a0e;
    --secondary: #332a1e;
    --muted: #2c2418;
    --muted-foreground: #b8a988;
    --accent: #d1502c;
    --accent-foreground: #fbeee7;
    --ring: #e0b040;
  }
  :root.light {
    color-scheme: light;
    --background: #f1ead7;
    --foreground: #2a2115;
    --card: #fbf6ea;
    --card-border: rgba(42,33,21,0.14);
    --primary: #b9812c;
    --primary-foreground: #2a2115;
    --secondary: #e6dcc2;
    --muted: #ece2c9;
    --muted-foreground: #75664a;
    --accent: #b9401f;
    --accent-foreground: #fdf1ea;
    --ring: #b9812c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: 'Oswald', 'Segoe UI', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: contain;
  }
  body {
    overflow-y: auto;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 18px 16px 34px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 56px; height: 56px; flex: none;
    border-radius: 10px;
    border: 2px solid var(--primary);
    background: #000;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  h1 {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-size: 26px;
    line-height: 0.95;
    margin: 0;
    text-transform: uppercase;
  }
  h1 span { color: var(--primary); }
  .tagline {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted-foreground);
    max-width: 380px;
  }
  .theme-btn {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 999px;
    border: 2px solid var(--card-border);
    background: var(--card);
    color: var(--foreground);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .theme-btn:active { background: var(--muted); }
  .panel {
    border-radius: 16px;
    border: 2px solid var(--card-border);
    background: var(--card);
    padding: 14px;
  }
  .track-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .track-row:last-of-type { margin-bottom: 0; }
  .track-label { width: 66px; flex: none; }
  .track-label .name {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 0.4px;
    line-height: 1;
    text-transform: uppercase;
  }
  .track-label .sub {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .steps {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(16, minmax(0, 1fr));
    gap: 4px;
  }
  .step {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    border: 1px solid var(--card-border);
    background: var(--background);
    cursor: pointer;
    padding: 0;
  }
  .step.beathead { background: var(--secondary); }
  .step.on {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 10px -2px var(--primary);
  }
  .step.cursor { outline: 2px solid var(--accent); outline-offset: 1px; }
  .step.cursor:not(.on)::after {
    content: '';
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 3px;
  }
  .beat-numbers {
    display: flex; align-items: center; gap: 10px;
    margin-top: 6px;
  }
  .beat-numbers .track-label { width: 66px; flex: none; }
  .beat-numbers .steps {
    grid-template-columns: repeat(16, minmax(0, 1fr));
  }
  .beat-num {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted-foreground);
  }
  .beat-num.head { color: var(--primary); }
  .transport {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .transport-left { display: flex; align-items: center; gap: 10px; }
  .play-btn {
    width: 58px; height: 58px; border-radius: 999px;
    border: 2px solid var(--primary);
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .play-btn:active { transform: scale(0.95); }
  .hype-btn {
    height: 58px; padding: 0 18px; border-radius: 999px;
    border: 2px solid var(--card-border);
    background: var(--card);
    color: var(--foreground);
    display: flex; align-items: center; gap: 8px;
    font-family: 'Anton', 'Oswald', sans-serif;
    font-size: 17px; letter-spacing: 0.4px; text-transform: uppercase;
    cursor: pointer;
  }
  .hype-btn.on {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-foreground);
    box-shadow: 0 0 14px -2px var(--accent);
  }
  .hype-btn svg { flex: none; }
  .hype-btn.on svg { animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .bpm-block {
    flex: 1 1 200px;
    display: flex; align-items: center; gap: 12px;
    min-width: 180px;
  }
  .bpm-readout { display: flex; align-items: baseline; gap: 4px; flex: none; }
  .bpm-readout .num {
    font-family: 'Anton', 'Oswald', sans-serif;
    font-size: 30px; color: var(--primary); line-height: 1;
  }
  .bpm-readout .unit {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--muted-foreground);
  }
  input[type=range] {
    flex: 1;
    accent-color: var(--primary);
    height: 6px;
    cursor: pointer;
  }
  .util-btns { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 999px;
    border: 2px solid var(--card-border);
    background: var(--card);
    color: var(--foreground);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--muted); }
  .export-btn {
    height: 46px; padding: 0 18px; border-radius: 999px;
    border: 2px solid var(--primary);
    background: transparent;
    color: var(--primary);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer;
  }
  .export-btn:disabled { opacity: 0.6; cursor: default; }
  .export-btn:not(:disabled):active { background: var(--primary); color: var(--primary-foreground); }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-top: 4px;
  }
  @media (max-width: 560px) {
    .track-label { width: 50px; }
    .track-label .name { font-size: 12px; }
    h1 { font-size: 21px; }
    .bpm-block { flex-basis: 100%; order: 3; }
  }
</style>
</head>
<body class="dark">
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><img src="rico-logo.png" alt="Rico's Beat Bot logo" /></div>
      <div>
        <h1><span>RICO'S</span><br />BEAT BOT</h1>
        <p class="tagline">Cook up hard-hitting beats in the browser. Tap the pads, ride the tempo, hit HYPE.</p>
      </div>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
  </header>

  <section class="panel" aria-label="Step sequencer">
    <div id="tracks"></div>
    <div class="beat-numbers">
      <div class="track-label"></div>
      <div class="steps" id="beatNums"></div>
    </div>
  </section>

  <section class="panel transport" aria-label="Transport controls">
    <div class="transport-left">
      <button type="button" class="play-btn" id="playBtn" aria-label="Play"></button>
      <button type="button" class="hype-btn" id="hypeBtn" aria-pressed="false"></button>
    </div>
    <div class="bpm-block">
      <div class="bpm-readout"><span class="num" id="bpmNum">92</span><span class="unit">bpm</span></div>
      <input type="range" id="bpmRange" min="60" max="180" value="92" aria-label="Tempo in beats per minute" />
    </div>
    <div class="util-btns">
      <button type="button" class="icon-btn" id="regenBtn" aria-label="Regenerate pattern"></button>
      <button type="button" class="icon-btn" id="clearBtn" aria-label="Clear pattern"></button>
      <button type="button" class="export-btn" id="exportBtn"><span id="exportIcon"></span><span id="exportLabel">Export</span></button>
    </div>
  </section>

  <footer>Rico's Beat Bot &mdash; turn it up</footer>
</div>

<script>
(function () {
  'use strict';

  /* ---------------------------- icons ---------------------------- */
  const ICONS = {
    play: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>',
    flame: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1-1-2-1-2 2 1 3 3 3 5a5 5 0 0 1-10 0c0-5 5-6 5-11z"/></svg>',
    shuffle: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    download: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
    loader: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  };

  /* ------------------------- audio engine ------------------------- */
  const TRACKS = [
    { id: 'kick', label: 'KICK', sub: 'boom' },
    { id: 'snare', label: 'SNARE', sub: 'clap' },
    { id: 'hat', label: 'HI-HAT', sub: 'tss' },
    { id: 'eight08', label: '808', sub: 'sub bass' },
  ];
  const STEPS = 16;

  function emptyPattern() {
    const p = {};
    TRACKS.forEach((t) => { p[t.id] = Array(STEPS).fill(false); });
    return p;
  }

  function randomPattern() {
    const p = emptyPattern();
    p.kick[0] = true;
    p.kick[8] = Math.random() > 0.35;
    [3, 6, 10, 11, 14].forEach((i) => { if (Math.random() > 0.6) p.kick[i] = true; });

    p.snare[4] = true;
    p.snare[12] = true;
    if (Math.random() > 0.75) p.snare[14] = true;
    if (Math.random() > 0.85) p.snare[7] = true;

    for (let i = 0; i < STEPS; i++) {
      if (i % 2 === 0) p.hat[i] = true;
      else if (Math.random() > 0.7) p.hat[i] = true;
    }

    p.eight08[0] = true;
    [6, 8, 10, 12, 14].forEach((i) => { if (Math.random() > 0.6) p.eight08[i] = true; });

    return p;
  }

  let sharedNoise = null;
  function getNoiseBuffer(ctx) {
    if (sharedNoise && sharedNoise.sampleRate === ctx.sampleRate) return sharedNoise;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 1, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    sharedNoise = buffer;
    return buffer;
  }

  function makeDistortion(amount) {
    const n = 256;
    const curve = new Float32Array(n);
    const deg = Math.PI / 180;
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  function playKick(ctx, out, t, accent) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(48, t + 0.12);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(1.1 * accent, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    osc.connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + 0.45);
  }

  function playSnare(ctx, out, t, accent) {
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer(ctx);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1500;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.9 * accent, t);
    nGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    noise.connect(hp).connect(nGain).connect(out);
    noise.start(t);
    noise.stop(t + 0.22);

    const tone = ctx.createOscillator();
    tone.type = 'triangle';
    tone.frequency.setValueAtTime(190, t);
    const tGain = ctx.createGain();
    tGain.gain.setValueAtTime(0.5 * accent, t);
    tGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    tone.connect(tGain).connect(out);
    tone.start(t);
    tone.stop(t + 0.14);
  }

  function playHat(ctx, out, t, accent, open) {
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer(ctx);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    const gain = ctx.createGain();
    const decay = open ? 0.28 : 0.055;
    gain.gain.setValueAtTime(0.5 * accent, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    noise.connect(hp).connect(gain).connect(out);
    noise.start(t);
    noise.stop(t + decay + 0.02);
  }

  function play808(ctx, out, t, accent) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(1.0 * accent, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    const drive = ctx.createWaveShaper();
    drive.curve = makeDistortion(8);
    osc.connect(drive).connect(gain).connect(out);
    osc.start(t);
    osc.stop(t + 0.75);
  }

  function createLimiter(ctx) {
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -1;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.15;
    return limiter;
  }

  function triggerVoice(ctx, out, track, t, accent, hype) {
    accent = accent === undefined ? 1 : accent;
    switch (track) {
      case 'kick': playKick(ctx, out, t, accent); break;
      case 'snare': playSnare(ctx, out, t, accent); break;
      case 'hat': playHat(ctx, out, t, accent, !!(hype && accent > 1)); break;
      case 'eight08': play808(ctx, out, t, accent); break;
    }
  }

  function audioBufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const bitDepth = 16;
    const numSamples = buffer.length;
    const blockAlign = (numChannels * bitDepth) / 8;
    const byteRate = sampleRate * blockAlign;
    const dataSize = numSamples * blockAlign;
    const bufferArray = new ArrayBuffer(44 + dataSize);
    const view = new DataView(bufferArray);
    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeString(36, 'data');
    view.setUint32(40, dataSize, true);
    const channels = [];
    for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
    let offset = 44;
    for (let i = 0; i < numSamples; i++) {
      for (let c = 0; c < numChannels; c++) {
        let sample = Math.max(-1, Math.min(1, channels[c][i]));
        sample = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        view.setInt16(offset, sample, true);
        offset += 2;
      }
    }
    return new Blob([view], { type: 'audio/wav' });
  }

  async function renderPatternToWav(pattern, bpm, hype, loops) {
    loops = loops || 2;
    const secondsPerBeat = 60 / bpm;
    const stepDur = 0.25 * secondsPerBeat;
    const total = stepDur * STEPS * loops + 1;
    const sampleRate = 44100;
    const offline = new OfflineAudioContext(2, Math.ceil(total * sampleRate), sampleRate);
    const master = offline.createGain();
    master.gain.value = 0.8;
    const limiter = createLimiter(offline);
    master.connect(limiter).connect(offline.destination);
    for (let loop = 0; loop < loops; loop++) {
      for (let step = 0; step < STEPS; step++) {
        const t = (loop * STEPS + step) * stepDur + 0.05;
        const accentBase = step % 4 === 0 ? 1.15 : 1;
        const accent = hype ? accentBase * 1.15 : accentBase;
        Object.keys(pattern).forEach((track) => {
          if (pattern[track][step]) triggerVoice(offline, master, track, t, accent, hype);
          else if (hype && track === 'hat' && step % 2 === 1 && Math.random() > 0.6) {
            triggerVoice(offline, master, 'hat', t, 0.4, hype);
          }
        });
      }
    }
    const rendered = await offline.startRendering();
    return audioBufferToWav(rendered);
  }

  /* ----------------------------- state ----------------------------- */
  let pattern = randomPattern();
  let bpm = 92;
  let isPlaying = false;
  let currentStep = 0;
  let hype = false;
  let isDark = true;
  let isDownloading = false;

  let ctx = null, master = null;
  let nextNoteTime = 0, schedStep = 0, timerHandle = null, rafHandle = null;
  let stepQueue = [];

  function ensureContext() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.8;
      const limiter = createLimiter(ctx);
      master.connect(limiter).connect(ctx.destination);
    }
    return ctx;
  }

  function scheduleStep(step, time) {
    if (!ctx || !master) return;
    const accentBase = step % 4 === 0 ? 1.15 : 1;
    const accent = hype ? accentBase * 1.15 : accentBase;
    Object.keys(pattern).forEach((track) => {
      if (pattern[track][step]) {
        triggerVoice(ctx, master, track, time, accent, hype);
      } else if (hype && track === 'hat' && step % 2 === 1 && Math.random() > 0.6) {
        triggerVoice(ctx, master, 'hat', time, 0.4, hype);
      }
    });
    stepQueue.push({ step: step, time: time });
  }

  function scheduler() {
    if (!ctx) return;
    const scheduleAhead = 0.12;
    while (nextNoteTime < ctx.currentTime + scheduleAhead) {
      scheduleStep(schedStep, nextNoteTime);
      const secondsPerBeat = 60 / bpm;
      nextNoteTime += 0.25 * secondsPerBeat;
      schedStep = (schedStep + 1) % STEPS;
    }
    timerHandle = setTimeout(scheduler, 25);
  }

  function draw() {
    if (ctx) {
      const now = ctx.currentTime;
      let idx = -1;
      for (let i = 0; i < stepQueue.length; i++) {
        if (stepQueue[i].time <= now) idx = i; else break;
      }
      if (idx >= 0) {
        currentStep = stepQueue[idx].step;
        stepQueue.splice(0, idx + 1);
        renderCursor();
      }
    }
    rafHandle = requestAnimationFrame(draw);
  }

  function stop() {
    if (timerHandle) clearTimeout(timerHandle);
    if (rafHandle) cancelAnimationFrame(rafHandle);
    timerHandle = null;
    rafHandle = null;
    stepQueue = [];
    isPlaying = false;
    renderPlayBtn();
    renderCursor();
  }

  async function start() {
    ensureContext();
    if (ctx.state === 'suspended') await ctx.resume();
    schedStep = 0;
    nextNoteTime = ctx.currentTime + 0.06;
    stepQueue = [];
    isPlaying = true;
    renderPlayBtn();
    scheduler();
    rafHandle = requestAnimationFrame(draw);
  }

  function togglePlay() {
    if (isPlaying) stop(); else start();
  }

  function toggleStep(track, step) {
    const wasOn = pattern[track][step];
    pattern[track][step] = !wasOn;
    renderStepCell(track, step);
    if (ctx && !wasOn) {
      triggerVoice(ctx, master, track, ctx.currentTime, 1, hype);
    }
  }

  /* ------------------------------ DOM ------------------------------ */
  const tracksEl = document.getElementById('tracks');
  const beatNumsEl = document.getElementById('beatNums');
  const stepCells = {}; // track -> [button, ...]

  TRACKS.forEach((track) => {
    const row = document.createElement('div');
    row.className = 'track-row';

    const label = document.createElement('div');
    label.className = 'track-label';
    label.innerHTML = '<div class="name">' + track.label + '</div><div class="sub">' + track.sub + '</div>';
    row.appendChild(label);

    const steps = document.createElement('div');
    steps.className = 'steps';
    stepCells[track.id] = [];
    for (let s = 0; s < STEPS; s++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'step' + (s % 4 === 0 ? ' beathead' : '');
      btn.setAttribute('aria-label', track.label + ' step ' + (s + 1));
      btn.addEventListener('click', (function (t, st) {
        return function () { toggleStep(t, st); };
      })(track.id, s));
      steps.appendChild(btn);
      stepCells[track.id].push(btn);
    }
    row.appendChild(steps);
    tracksEl.appendChild(row);
  });

  for (let s = 0; s < STEPS; s++) {
    const n = document.createElement('div');
    n.className = 'beat-num' + (s % 4 === 0 ? ' head' : '');
    n.textContent = s % 4 === 0 ? String(s / 4 + 1) : '';
    beatNumsEl.appendChild(n);
  }

  function renderStepCell(track, step) {
    const cell = stepCells[track][step];
    cell.classList.toggle('on', !!pattern[track][step]);
  }

  function renderAllSteps() {
    TRACKS.forEach((t) => { for (let s = 0; s < STEPS; s++) renderStepCell(t.id, s); });
  }

  function renderCursor() {
    TRACKS.forEach((t) => {
      stepCells[t.id].forEach((cell, s) => {
        cell.classList.toggle('cursor', isPlaying && currentStep === s);
      });
    });
  }

  /* --------------------------- transport UI --------------------------- */
  const playBtn = document.getElementById('playBtn');
  const hypeBtn = document.getElementById('hypeBtn');
  const bpmNum = document.getElementById('bpmNum');
  const bpmRange = document.getElementById('bpmRange');
  const regenBtn = document.getElementById('regenBtn');
  const clearBtn = document.getElementById('clearBtn');
  const exportBtn = document.getElementById('exportBtn');
  const exportIcon = document.getElementById('exportIcon');
  const exportLabel = document.getElementById('exportLabel');
  const themeBtn = document.getElementById('themeBtn');

  function renderPlayBtn() {
    playBtn.innerHTML = isPlaying ? ICONS.pause : ICONS.play;
    playBtn.setAttribute('aria-label', isPlaying ? 'Stop' : 'Play');
  }
  function renderHypeBtn() {
    hypeBtn.classList.toggle('on', hype);
    hypeBtn.setAttribute('aria-pressed', String(hype));
    hypeBtn.innerHTML = ICONS.flame + 'HYPE';
  }
  function renderExportBtn() {
    exportIcon.innerHTML = isDownloading ? ICONS.loader : ICONS.download;
    exportLabel.textContent = isDownloading ? 'Bouncing' : 'Export';
    exportBtn.disabled = isDownloading;
  }
  function renderThemeBtn() {
    themeBtn.innerHTML = isDark ? ICONS.sun : ICONS.moon;
    themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
  }

  playBtn.addEventListener('click', togglePlay);
  hypeBtn.addEventListener('click', function () { hype = !hype; renderHypeBtn(); });
  bpmRange.addEventListener('input', function () {
    bpm = Number(bpmRange.value);
    bpmNum.textContent = String(bpm);
  });
  regenBtn.innerHTML = ICONS.shuffle;
  regenBtn.addEventListener('click', function () { pattern = randomPattern(); renderAllSteps(); });
  clearBtn.innerHTML = ICONS.trash;
  clearBtn.addEventListener('click', function () { pattern = emptyPattern(); renderAllSteps(); });

  exportBtn.addEventListener('click', async function () {
    if (isDownloading) return;
    isDownloading = true;
    renderExportBtn();
    try {
      const blob = await renderPatternToWav(pattern, bpm, hype, 2);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ricos-beat-' + bpm + 'bpm.wav';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } finally {
      isDownloading = false;
      renderExportBtn();
    }
  });

  themeBtn.addEventListener('click', function () {
    isDark = !isDark;
    document.documentElement.classList.toggle('light', !isDark);
    renderThemeBtn();
  });

  /* ------------------------------ boot ------------------------------ */
  renderAllSteps();
  renderPlayBtn();
  renderHypeBtn();
  renderExportBtn();
  renderThemeBtn();

  // Stop cleanly if the overlay iframe gets its src cleared/hidden.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && isPlaying) stop();
  });
}());
</script>
</body>
</html>
