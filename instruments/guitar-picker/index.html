/* Theme variable sets. Switch via <html data-theme="..."> */
:root {
  --radius: 14px;
  --radius-sm: 9px;
  --gap: 16px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
  --speed: 160ms;

  /* judgment colors are shared across themes */
  --j-perfect: #21d07a;
  --j-good: #5ec8ff;
  --j-off: #ffb454;
  --j-miss: #ff5d6c;
}

/* ---- Midnight (default) ---- */
[data-theme="midnight"] {
  --bg: #0b0f1a;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;                 /* no pull-to-refresh reload mid-song */
  -webkit-tap-highlight-color: transparent;  /* no grey flash on every tap */
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;   /* iOS: no text inflation on rotate */
}
/* No accidental text selection / callout while tapping or holding on the play surfaces. */
.play-shell, #highway-canvas, #kara-canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#highway-canvas, #kara-canvas { touch-action: none; }
button, input, select, textarea { font-family: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* dvh: mobile URL-bar safe. minmax(0,1fr): an auto row takes its item's max-content
   height, so a tall canvas grew the row past the window and pushed the play controls
   out of sight — the 0 minimum lets the row be exactly the window height. */
#app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: minmax(0, 1fr);
  height: 100vh; height: 100dvh;
  /* notches / rounded corners / home indicator (needs viewport-fit=cover, set in index.html) */
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
           env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

/* ---------- Sidebar ---------- */
#sidebar {
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 12px;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 6px 8px 18px; }
.brand-mark { font-size: 28px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 18px; letter-spacing: .3px; }
.brand-text span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }

#nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: var(--radius-sm); color: var(--muted); cursor: pointer;
  border: 1px solid transparent; font-size: 14px; transition: var(--speed);
  text-decoration: none;
}
.nav-item .ico { width: 20px; text-align: center; font-size: 16px; }
.nav-item:hover { background: var(--panel); color: var(--text); }
.nav-item.active { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.nav-item.active .ico { filter: drop-shadow(0 0 6px var(--accent)); }
.nav-sep { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--muted); opacity: .65; padding: 14px 12px 4px; }

.sidebar-foot { padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
.io-indicator { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.io-row { display: flex; align-items: center; gap: 8px; overflow: hidden; }
.io-row span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.io-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.io-dot.in.live { background: var(--good); box-shadow: 0 0 8px var(--good); }
.io-dot.out { background: var(--accent); }

/* ---------- Main ---------- */
#main { display: flex; flex-direction: column; overflow: hidden; }
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--bg-2);
}
#crumb { font-size: 15px; font-weight: 600; }
#crumb small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.health-mini { width: 140px; height: 12px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--line); overflow: hidden; position: relative; }
.health-mini::after { content: ""; position: absolute; inset: 0; width: var(--h, 100%);
  background: linear-gradient(90deg, var(--bad), var(--warn) 45%, var(--good));
  transition: width 200ms; }
.coin-chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  color: var(--text); font-size: 13px; text-decoration: none; font-variant-numeric: tabular-nums; }
.coin-chip:hover { border-color: var(--warn); }
.coin-chip b { color: var(--warn); }
.streak-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px;
  border-radius: 999px; font-size: 13px; color: var(--warn);
  background: color-mix(in srgb, var(--warn) 16%, var(--panel-2)); border: 1px solid var(--warn); }
.streak-chip.cold { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
#theme-quick, select.input, input.input, textarea.input {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; outline: none;
}
select.input:focus, input.input:focus, textarea.input:focus { border-color: var(--accent); }

/* min-height:0 or the flex item is sized by its content instead of the window —
   the canvas reports its own (stale, larger) pixel height, which pushed the play
   controls below the fold. Also what makes .play-shell's height:100% definite. */
#view { padding: 22px; overflow-y: auto; flex: 1; min-height: 0; }
#view.no-pad { padding: 0; }

/* ---------- Generic components ---------- */
.row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: var(--gap); }
.grid { display: grid; gap: var(--gap); }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--muted); }
.center { text-align: center; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 6px; }
.page-head { margin-bottom: 18px; }
.page-head p { color: var(--muted); margin: 4px 0 0; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px;
}
.panel.tight { padding: 14px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: var(--speed);
  display: flex; flex-direction: column; gap: 8px;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card .title { font-weight: 600; }
.card .sub { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.tag.beginner { color: var(--good); border-color: var(--good); }
.tag.intermediate { color: var(--warn); border-color: var(--warn); }
.tag.advanced { color: var(--bad); border-color: var(--bad); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 9px 15px; cursor: pointer; font-size: 14px;
  transition: var(--speed);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.lg { padding: 12px 22px; font-size: 15px; }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.field .input, label.field select, label.field input, label.field textarea { color: var(--text); }

.slider { display: flex; align-items: center; gap: 10px; }
.slider input[type=range] { flex: 1; accent-color: var(--accent); }
.slider .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.data th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
table.data tr:hover td { background: var(--panel-2); }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; font-size: 13px; }
.pill.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.progress { height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ---------- Toasts ---------- */
#toast-host { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); padding: 11px 15px; min-width: 220px; max-width: 360px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35); animation: toast-in 180ms ease; font-size: 14px; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Tuner ---------- */
.tuner-wrap { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 720px; margin: 0 auto; }
.tuner-display { text-align: center; padding: 26px; }
.tuner-note { font-size: 86px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.tuner-note small { font-size: 26px; vertical-align: super; color: var(--muted); }
.tuner-freq { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
.tuner-meter { position: relative; height: 70px; margin: 22px 0 8px; }
.tuner-needle { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: var(--accent);
  transform-origin: bottom center; transition: transform 90ms linear, background 120ms; }
.tuner-scale { position: absolute; inset: auto 0 0 0; height: 2px; background: var(--line); }
.tuner-center { position: absolute; bottom: 0; left: 50%; width: 2px; height: 18px; background: var(--muted); transform: translateX(-50%); }
.tuner-verdict { font-size: 16px; font-weight: 600; }
.tuner-verdict.intune { color: var(--good); }
.tuner-verdict.flat, .tuner-verdict.sharp { color: var(--warn); }
.string-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.string-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--panel-2); cursor: pointer; font-weight: 700; font-size: 15px; transition: var(--speed); }
.string-btn.target { border-color: var(--accent); }
.string-btn.intune { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--panel-2)); }

/* ---------- Highway / Play ---------- */
.play-shell { position: relative; height: 100%; display: flex; flex-direction: column; }
/* Canvas + HUD live on a stage so (a) the overlay covers the highway and not the
   control bar, and (b) the canvas can shrink: a flex item's min-height is auto,
   which for a canvas means its own intrinsic height — the one the ResizeObserver
   keeps writing back. It could grow but never shrink, so on a short screen it
   pushed the controls off the bottom. */
.play-stage { position: relative; flex: 1; min-height: 0; }
#highway-canvas, #kara-canvas { display: block; width: 100%; height: 100%; background: var(--highway); }
.play-overlay { position: absolute; inset: 0; pointer-events: none; }
.play-hud { position: absolute; top: 14px; left: 14px; right: 14px; display: flex;
  justify-content: space-between; align-items: flex-start; pointer-events: none; }
.hud-box { background: rgba(0,0,0,.42); backdrop-filter: blur(4px); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 12px; pointer-events: auto; }
.play-avatar { width: 52px; height: 60px; flex: none; background: rgba(0,0,0,.42);
  backdrop-filter: blur(4px); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 2px; pointer-events: auto; }
.killfeed { position: absolute; right: 16px; top: 70px; display: flex; flex-direction: column;
  gap: 6px; align-items: flex-end; pointer-events: none; }
.kill { padding: 5px 11px; border-radius: 8px; font-size: 13px; font-weight: 600;
  background: rgba(0,0,0,.5); border: 1px solid var(--line); animation: toast-in 140ms; }
.kill.perfect { color: var(--j-perfect); border-color: var(--j-perfect); }
.kill.good { color: var(--j-good); border-color: var(--j-good); }
.kill.off { color: var(--j-off); border-color: var(--j-off); }
.kill.miss { color: var(--j-miss); border-color: var(--j-miss); }
.healthbar-big { height: 16px; border-radius: 10px; background: rgba(0,0,0,.4);
  border: 1px solid var(--line); overflow: hidden; width: 260px; }
.healthbar-big > i { display: block; height: 100%; transition: width 160ms;
  background: linear-gradient(90deg, var(--bad), var(--warn) 50%, var(--good)); }
.play-controls { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  border-top: 1px solid var(--line); background: var(--bg-2); flex-wrap: wrap; }
.play-bottom-fade { position:absolute; left:0; right:0; bottom:0; height:90px; pointer-events:none;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.25)); }
.lyric-line { position:absolute; left:0; right:0; bottom:18px; text-align:center; font-size:22px;
  font-weight:700; text-shadow: 0 2px 10px rgba(0,0,0,.8); pointer-events:none; --kw-future: var(--muted); }
.lyric-line .kw { color: var(--kw-future); transition: color 90ms; }
.lyric-line .kw.done { color: var(--accent); }
.lyric-line .kw.cur { -webkit-background-clip: text; background-clip: text; color: transparent; }
.banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.banner .panel { text-align:center; max-width: 480px; }
.big-grade { font-size: 64px; font-weight: 800; }

/* ---------- Karaoke ---------- */
.view-pad { padding: 22px; }
.kara-pick { cursor: pointer; transition: transform 120ms, border-color 120ms; }
.kara-pick:hover { transform: translateY(-2px); border-color: var(--accent); }
.kara-stage { position:absolute; left:0; right:0; top:46%; transform: translateY(-50%);
  text-align:center; pointer-events:none; padding: 0 6%; --kw-future: var(--muted); }
.kara-stage > div { text-shadow: 0 2px 14px rgba(0,0,0,.85); line-height: 1.18; }
.kara-countin { height: 26px; letter-spacing: 8px; color: var(--accent); font-size: 18px; opacity: .85; }
.kara-prev { font-size: 20px; opacity: .4; min-height: 24px; }
.kara-cur { font-size: clamp(28px, 5vw, 54px); font-weight: 800; margin: 6px 0 10px; min-height: 60px; }
.kara-next { font-size: 24px; opacity: .62; min-height: 28px; }
.kara-next2 { font-size: 19px; opacity: .34; min-height: 22px; }
.kara-cur .kw { color: var(--kw-future); transition: color 90ms; }
.kara-cur .kw.done { color: var(--accent); }
.kara-cur .kw.cur { -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Editor / piano roll ---------- */
.roll-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--highway); }
#roll-canvas { display: block; width: 100%; cursor: crosshair; }

/* ---------- Charts ---------- */
.chart { width: 100%; height: 220px; display: block; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color: var(--muted); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align: middle; }

/* ---------- Minigame ---------- */
.quiz-choices { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quiz-choice { padding: 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; font-size: 16px; text-align:center; transition: var(--speed); }
.quiz-choice:hover { border-color: var(--accent); }
.quiz-choice.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 20%, var(--panel-2)); }
.quiz-choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 20%, var(--panel-2)); }

/* ---------- Fretboard / capo ---------- */
.capo-note { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- Mobile vs desktop ----------
   Three switches, each keyed to what it actually detects:
     width   -> how much layout fits (rail, then bottom tab bar)
     pointer -> finger or mouse (touch target size)
     height  -> landscape phone, where the note highway wants the whole screen
   ponytail: no JS device sniffing and no manual mode toggle — the browser already
   knows all three, and "Request desktop site" is a built-in browser menu item.
   Add a stored override only if someone actually wants mobile layout on a desktop. */

/* Tablet / narrow: collapse the sidebar to a centered icon rail. */
@media (max-width: 820px) {
  #app { grid-template-columns: 60px 1fr; }
  .brand-text, .nav-item span:not(.ico), .io-indicator { display: none; }
  #sidebar { padding: 14px 6px; }
  .brand { justify-content: center; padding: 6px 0 14px; }
  .nav-item { justify-content: center; padding: 11px 0; gap: 0; }
  .nav-item .ico { font-size: 19px; }
  .nav-sep { text-align: center; padding: 12px 0 4px; font-size: 8px; letter-spacing: .6px; }
}

/* Phones: trim chrome and stack every multi-column form grid to one column.
   ponytail: one rule collapses all .grid form layouts instead of editing ~9 inline
   styles across views; the locker swatch grid uses a raw inline display:grid (no .grid
   class) so it stays multi-column, which is what we want there. */
@media (max-width: 560px) {
  #view { padding: 14px; }
  #topbar { padding: 10px 14px; }
  #crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-right { gap: 8px; }
  /* Give the title the width back: the play view already draws its own health bar,
     and the theme picker lives in Settings. */
  #health-mini, #theme-quick { display: none; }
  .panel { padding: 14px; overflow-x: auto; }       /* wide tables scroll in-panel, not off-page */
  .grid { grid-template-columns: 1fr !important; }   /* beat inline gridTemplateColumns on phones */
  .quiz-choices { grid-template-columns: 1fr; }
  .healthbar-big { width: 100%; }
  #toast-host { left: 14px; right: 14px; bottom: 78px; }  /* clear of the tab bar */
  .toast { min-width: 0; max-width: none; }

  /* The rail becomes a thumb-reachable bottom tab bar: the note highway scrolls
     right-to-left, so every pixel of width is lookahead time. */
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  #sidebar { order: 2; flex-direction: row; padding: 2px 0;
    border-right: 0; border-top: 1px solid var(--line); }
  .brand, .nav-sep, .sidebar-foot { display: none; }
  #nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #nav::-webkit-scrollbar { display: none; }
  .nav-item { flex: none; min-width: 58px; }
  /* Without this the icon row's content width wins and stretches the whole app
     wider than the screen — grid/flex items default to min-width:auto. */
  #sidebar, #nav, #main { min-width: 0; }

  /* One scrollable row of controls instead of four wrapped ones — the rows it
     saves go to the highway. */
  .play-controls { flex-wrap: nowrap; overflow-x: auto; gap: 10px; padding: 8px 12px; }
  .play-controls > * { flex: none; }
  .play-hud { top: 8px; left: 8px; right: 8px; }
  .lyric-line { font-size: 17px; }
}

/* Phone portrait, play view: reclaim the top third of the highway for notes. */
@media (max-width: 560px) {
  .play-avatar { display: none; }
  .play-hud { gap: 8px; }
  .play-hud .hud-box { padding: 6px 10px; }
  .play-hud > .row .hud-box { max-width: 56vw; min-width: 0; }
  .play-hud .hud-box > div:nth-child(n+3) { display: none; }   /* keep title + key/BPM line */
  .play-hud .hud-box b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .healthbar-big { width: min(150px, 34vw); height: 12px; }
  .killfeed { top: 92px; right: 8px; }
  .kill { font-size: 12px; padding: 3px 8px; }
}

/* Touch: fingers need ~44px, and manipulation drops the 300ms double-tap delay. */
@media (pointer: coarse) {
  .btn, .nav-item, .quiz-choice, select.input, input.input { min-height: 44px; }
  /* iOS Safari zooms the page on focus of any field under 16px — keep inputs at 16px. */
  input, select, textarea { font-size: 16px; }
  button, a, select, input, .card, .quiz-choice { touch-action: manipulation; }
}

/* No hover (touch): a tapped card would otherwise keep its hover lift stuck on. */
@media (hover: none) {
  .card:hover, .kara-pick:hover { transform: none; }
}

/* Landscape phone (short screen, any width): the 248px sidebar + tall top bar would eat a
   third of a 390px-high screen — use the slim icon rail and a compact top bar everywhere. */
@media (max-height: 500px) and (orientation: landscape) {
  #app { grid-template-columns: 56px 1fr; }
  .brand-text, .nav-item span:not(.ico), .io-indicator, .sidebar-foot { display: none; }
  #sidebar { padding: 6px 4px; }
  .brand { justify-content: center; padding: 2px 0 8px; }
  .brand-mark img { width: 28px; height: 28px; }
  .nav-item { justify-content: center; padding: 8px 0; gap: 0; min-height: 40px; }
  .nav-sep { text-align: center; padding: 8px 0 2px; font-size: 7px; letter-spacing: .4px; }
  #topbar { padding: 6px 16px; }
  #view { padding: 12px 18px; }
  .killfeed { top: 118px; }
  .play-hud .hud-box > div:nth-child(n+3) { display: none; }
}

/* Landscape phone on the immersive routes (play/karaoke): give them the whole
   screen. Both views carry their own "← Songs" button, so nothing is trapped. */
@media (max-height: 500px) and (orientation: landscape) {
  #app:has(#view.no-pad) { grid-template-columns: 1fr; }
  #app:has(#view.no-pad) #sidebar,
  #main:has(#view.no-pad) #topbar { display: none; }
  /* One swipeable row, not two wrapped ones — 97px of controls out of 390 was
     a quarter of the screen. */
  #view.no-pad .play-controls { flex-wrap: nowrap; overflow-x: auto; padding: 5px 10px; gap: 8px; }
  #view.no-pad .play-controls > * { flex: none; }
  #view.no-pad .play-avatar { display: none; }
}

/* Portrait phone: the highway is only as wide as the screen, so say so once and
   fade out. Pure CSS — no element, no timer, gone the moment you rotate. */
@media (max-width: 700px) and (orientation: portrait) {
  .play-shell::after {
    content: "↻ Rotate for more of the note highway";
    position: absolute; left: 50%; top: 42%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 15px; font-size: 13px; white-space: nowrap; pointer-events: none;
    animation: hint-fade 7s forwards;
  }
}
@keyframes hint-fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

// yourself. Sample-accurate — notes are scheduled ahead into the AudioContext
// clock rather than fired from requestAnimationFrame.

const LOOKAHEAD = 0.4;   // seconds of notes to queue ahead of the transport clock

class Band {
  /** parts: [{ instrument, name?, notes:[{time,dur,midi[],gain?}], gain? }]
   *  `ctx` overrides the shared AudioContext — only the test harness passes it. */
  constructor(parts, { a4 = 440, volume = 0.7, ctx = null } = {}) {
    this.parts = (parts || []).filter((p) => p && p.notes?.length).map((p) => ({
      instrument: p.instrument,
      name: p.name || p.instrument,
      voice: p.voice || voiceFor(p.instrument),
      gain: p.gain ?? 1,
      notes: [...p.notes].sort((a, b) => a.time - b.time),
      i: 0,
    }));
    this.a4 = a4;
    this.volume = volume;
    this._ctxOverride = ctx;
    this._live = [];
    this._g = null;
  }

  get empty() { return this.parts.length === 0; }
  get names() { return this.parts.map((p) => p.name); }

  _ctx() { return this._ctxOverride || Audio.ctx(); }

  _dest() {
    if (!this._g) {
      const ctx = this._ctx();
      this._g = ctx.createGain();
      this._g.gain.value = this.volume;
      this._g.connect(ctx.destination);
    }
    return this._g;
  }

  setVolume(v) { this.volume = v; if (this._g) this._g.gain.value = v; }

  /** Move the playhead; anything already queued is dropped. */
  seek(sec) {
    for (const p of this.parts) {

      while (i < p.notes.length && p.notes[i].time < sec) i++;

  /** Call once per frame with the transport clock (seconds, may be negative). */
  schedule(clock) {
    if (this.empty) return;
    const ctx = this._ctx();
    const dest = this._dest();
    const base = ctx.currentTime - clock;   // context time of transport zero
    const horizon = clock + LOOKAHEAD;
    for (const p of this.parts) {
      while (p.i < p.notes.length && p.notes[p.i].time < horizon) {
        const n = p.notes[p.i++];
        const at = base + n.time;
        if (at < ctx.currentTime) continue;   // late (clock jumped) — skip, don't pile up
        const dur = n.dur || 0.4;

  silence() {
    if (!this._live.length) return;
    const t = this._ctx().currentTime;

  stop() {
    this.silence();

// Monophonic pitch detection via normalized autocorrelation.
// Returns the fundamental frequency in Hz, an RMS level, and a clarity score (0..1).
const { freqToMidiFloat } = __req("src/music/notes.js");

const MIN_FREQ = 60;    // a bit below low bass B/E
const MAX_FREQ = 1400;  // high fretted notes

/** @param {Float32Array} buf time-domain samples in [-1,1]
 *  @param {number} sampleRate
 *  @param {number} gate RMS noise gate */
function detectPitch(buf, sampleRate, gate = 0.012) {
  const n = buf.length;
  // RMS
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n);
  if (rms < gate) return { freq: -1, rms, clarity: 0 };

  // Trim quiet ends to reduce noise impact
  const minLag = Math.floor(sampleRate / MAX_FREQ);
  const maxLag = Math.min(Math.floor(sampleRate / MIN_FREQ), Math.floor(n / 2));

  // Normalized square difference (McLeod-style) for robust peak selection
  let bestLag = -1, bestVal = 0;
  let prevCorr = 0, ascending = false;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let corr = 0, normA = 0, normB = 0;
    for (let i = 0; i < n - lag; i++) {
      corr += buf[i] * buf[i + lag];
      normA += buf[i] * buf[i];
      normB += buf[i + lag] * buf[i + lag];
    }
    const nsdf = (2 * corr) / (normA + normB || 1); // -1..1
    if (nsdf > prevCorr) ascending = true;
    if (ascending && nsdf < prevCorr) {
      // we just passed a local peak at lag-1
      const peakLag = lag - 1;
      if (prevCorr > bestVal) { bestVal = prevCorr; bestLag = peakLag; }
      ascending = false;
      // first strong peak (>0.9 of running best) is usually the fundamental
      if (bestVal > 0.92) break;
    }
    prevCorr = nsdf;
  }

  if (bestLag < 0 || bestVal < 0.5) return { freq: -1, rms, clarity: bestVal };

  // parabolic interpolation around bestLag using NSDF neighbours
  const y0 = nsdfAt(buf, n, bestLag - 1), y1 = nsdfAt(buf, n, bestLag), y2 = nsdfAt(buf, n, bestLag + 1);
  const denom = (y0 - 2 * y1 + y2);
  const shift = denom ? 0.5 * (y0 - y2) / denom : 0;
  const refinedLag = bestLag + shift;
  const freq = sampleRate / refinedLag;
  if (freq < MIN_FREQ || freq > MAX_FREQ) return { freq: -1, rms, clarity: bestVal };
  return { freq, rms, clarity: bestVal };
}

function nsdfAt(buf, n, lag) {
  if (lag < 1) lag = 1;
  let corr = 0, normA = 0, normB = 0;
  for (let i = 0; i < n - lag; i++) {
    corr += buf[i] * buf[i + lag];
    normA += buf[i] * buf[i];
    normB += buf[i + lag] * buf[i + lag];
  }
  return (2 * corr) / (normA + normB || 1);
}

  constructor() { this.last = -1; this.lastMidi = -1; this.holds = 0; }

      if (this.holds > 4) { this.last = -1; this.lastMidi = -1; }
      return this.last;

    this.holds = 0;
    // octave correction toward previous reading
    if (this.last > 0) {
      const candidates = [freq, freq / 2, freq * 2];
      candidates.sort((a, b) => Math.abs(a - this.last) - Math.abs(b - this.last));
      freq = candidates[0];
    }
    // light smoothing
    this.last = this.last > 0 ? this.last * 0.4 + freq * 0.6 : freq;
    this.lastMidi = freqToMidiFloat(this.last, a4);
    return this.last;
  }
}

    this.vocal = null;

    const audioEl = new window.Audio();

    audioEl.crossOrigin = "anonymous";

    gain.gain.value = volume;
    src.connect(gain); gain.connect(ctx.destination);

    if (a.vocal)   { const r = this._make(a.vocal, s.vocalVolume);   this.vocal = r.audioEl;   this._gainV = r.gain; }
  }

  setBackingVolume(v) { if (this._gainB) this._gainB.gain.value = v; }
  setVocalVolume(v) { if (this._gainV) this._gainV.gain.value = v; }

  async play(fromSec = 0) {
    await Audio.resume();
    for (const el of [this.backing, this.vocal]) {
      if (el) { try { el.currentTime = fromSec; await el.play(); } catch (e) { console.warn("play blocked", e); } }

    this.backing = this.vocal = this._gainB = this._gainV = null;
  }
  hasAudio() { return !!(this.backing || this.vocal); }
}

});

// One-shot synth: note previews, tuning reference tones, and the metronome.
// Timbres live in voices.js — pass `instrument` (or `voice`) to hear a note the
// way that instrument would actually sound.
const { Audio } = __req("src/audio/engine.js");
const { playVoice, voiceFor } = __req("src/audio/voices.js");

const Synth = {
  /** Play a midi note in an instrument's voice. Returns kill(when). */
  playMidi(midi, { dur = 0.7, gain = 0.25, a4 = 440, instrument = null, voice = null } = {}) {
    const ctx = Audio.ctx(); Audio.resume();
    return playVoice(ctx, ctx.destination, voice || voiceFor(instrument), midi, { dur, gain, a4 });
  },

  /** Sustained reference tone for tuning a single string. Returns a stop() fn. */
  reference(freq, { gain = 0.18 } = {}) {
    const ctx = Audio.ctx(); Audio.resume();
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 0.05);
    osc.connect(g); g.connect(ctx.destination); osc.start();
    return () => {
      g.gain.cancelScheduledValues(ctx.currentTime);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.08);
      osc.stop(ctx.currentTime + 0.1);
    };
  },

  click({ accent = false } = {}) {
    const ctx = Audio.ctx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.frequency.value = accent ? 1500 : 900;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + 0.06);
  },
};

    if ((Date.parse(s.createdAt) || 0) > (Date.parse(prev.createdAt) || 0)) byId.set(s.id, s);

  "top", "topColor", "tattoo", "glasses", "hat", "hatColor", "jewelry", "frame",
];

const DEFAULT_AVATAR = {
  skinTone: "light", expression: "neutral", hair: "short", hairColor: "black",
  facialHair: "none", top: "tee", topColor: "indigo", tattoo: "none",
  glasses: "none", hat: "none", hatColor: "crimson", jewelry: "none", frame: "none",
};

// ---- composition -----------------------------------------------------------

function ctxFor(lo, accent) {
  const skin = pickById(SKIN_TONES, lo.skinTone);
  const top = pickById(CLOTH_COLORS, lo.topColor).hex;
  const hat = pickById(CLOTH_COLORS, lo.hatColor).hex;
  return {
    lo,
    accent: accent || "#6ea8fe",
    skin: skin.hex, skinShade: skin.shade,
    hair: pickById(HAIR_COLORS, lo.hairColor).hex,
    top, topShade: shadeColor(top, -0.22), topLight: shadeColor(top, 0.2),
    hat,
  };
}

function part(items, id) { for (const i of items) if (i.id === id) return i; return items[0]; }

/** Compose a full avatar SVG string from a loadout. `accent` tints frames/flair. */
function composeAvatar(loadout = {}, accent) {
  const lo = { ...DEFAULT_AVATAR, ...loadout };
  const c = ctxFor(lo, accent);
  const layers = [];
  layers.push(part(FRAMES, lo.frame).draw(c));
  // torso skin base (so tanks / open collars show skin)
  layers.push(`<path d="M22 140 q-1 -30 20 -40 q8 9 18 9 q10 0 18 -9 q21 10 20 40 z" fill="${c.skin}"/>`);
  // neck
  layers.push(`<path d="M52 74 h16 v18 q-8 6 -16 0 z" fill="${c.skin}"/><path d="M52 88 q8 5 16 0 v4 q-8 5 -16 0 z" fill="${c.skinShade}"/>`);
  // clothing
  layers.push(part(TOPS, lo.top).draw(c));
  // head + ears
  layers.push(
    `<ellipse cx="36" cy="52" rx="4.5" ry="6.5" fill="${c.skin}"/>` +
    `<ellipse cx="84" cy="52" rx="4.5" ry="6.5" fill="${c.skin}"/>` +
    `<ellipse cx="60" cy="48" rx="24" ry="27" fill="${c.skin}"/>` +
    `<path d="M82 44 q4 8 0 18 q-4 -2 -4 -9 q0 -7 4 -9 z" fill="${c.skinShade}" opacity="0.5"/>`
  );
  // tattoo (on skin), face, facial hair, hair, glasses, jewelry, hat
  layers.push(part(TATTOOS, lo.tattoo).draw(c));
  layers.push(part(EXPRESSIONS, lo.expression).draw(c));
  layers.push(part(FACIAL_HAIR, lo.facialHair).draw(c));
  layers.push(part(HAIRSTYLES, lo.hair).draw(c));
  layers.push(part(GLASSES, lo.glasses).draw(c));
  layers.push(part(JEWELRY, lo.jewelry).draw(c));
  layers.push(part(HATS, lo.hat).draw(c));
  return svgDoc(VB, layers.join(""), "cos-avatar");
}

// ---- small shared shape helpers -------------------------------------------

function tattooInk(c) { return shadeColor(c.skin, -0.55); }

// A 5-point star path centred at (cx,cy) with outer radius r.
function star(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.45 : r;
    const a = (Math.PI / 5) * i - Math.PI / 2;
    pts.push(`${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`);
  }
  return `<polygon points="${pts.join(" ")}"/>`;
}

"use strict";
Object.defineProperties(__exp, {
    "PRICES": { enumerable: true, get: () => PRICES },
    "priceOf": { enumerable: true, get: () => priceOf },
    "unlockKey": { enumerable: true, get: () => unlockKey }
  });
// Cosmetics economy: coins + rarity-based pricing for unlocking items.
// Pure pricing / key helpers (no DOM, no Store) so this is safe everywhere.
// Persistence of coins + unlocks lives in state.js (Store.coins / Store.unlock).

// Price by rarity tier. Common items are always free (owned by default).
const PRICES = {
  common: 0,
  uncommon: 60,
  rare: 180,
  epic: 450,
  legendary: 1200,
};

function priceOf(rarityId) {
  return PRICES[rarityId] ?? 0;
}

// Stable unlock key for an item. `catKey` may be "" (e.g. for skins).
//   unlockKey("avatar", "hair", "mohawk") -> "avatar:hair:mohawk"
//   unlockKey("skin", "", "neon")         -> "skin:neon"
function unlockKey(kind, catKey, id) {
  return [kind, catKey, id].filter(Boolean).join(":");
}

/** Derived facts for one instrument: strings table, range, tunings, song count, app support. */
function instrumentFacts(id) {
  const inst = INSTRUMENTS[id];
  const g = GUIDE[id] || {};
  const strings = inst.strings.map((m, i) => ({
    label: (STRING_LABELS[id] || [])[i] || midiToName(m).name,
    note: midiToName(m).full, midi: m, freq: midiToFreq(m),
  }));
  const range = g.range || (inst.strings.length
    ? `${midiToName(Math.min(...inst.strings)).full} – ${midiToName(Math.max(...inst.strings) + inst.frets).full}`
    : id === "harmonica" ? `${midiToName(HARMONICA_BLOW[0]).full} – ${midiToName(HARMONICA_BLOW[9]).full}` : "—");
  const tunings = Object.entries(ALT_TUNINGS[id] || {}).map(([name, t]) =>
    ({ name, notes: t.map((m) => midiToName(m).full).join(" ") }));
  const songs = builtinSongs().filter((s) => (s.instrument || "acoustic-guitar") === id).length;
  const panel = inst.kind === "fretted" ? "fretboard dots" : id === "harmonica" ? "hole + breath strip" : null;
  return { inst, strings, range, tunings, songs, panel, tuner: inst.strings.length > 0 };
}

/** Richter C-diatonic hole chart rows: { hole, blow, draw } note names. */
function harmonicaChart() {
  return HARMONICA_BLOW.map((b, i) => ({ hole: i + 1, blow: midiToName(b).full, draw: midiToName(HARMONICA_DRAW[i]).full }));
}

// ---------- Markdown rendering (docs/INSTRUMENTS.md — regenerate with `node gen-docs.mjs`) ----------
const anchor = (s) => s.toLowerCase().replace(/[^\w\s-]/g, "").replace(/\s/g, "-");

function buildInstrumentsMarkdown() {
  const ids = Object.keys(GUIDE);
  const L = [];
  L.push("# GuitarPicker instrument guide", "");
  L.push("Every instrument the app models: what it is, how to play it, and how GuitarPicker supports it.");
  L.push("Hard facts (tunings, ranges, hole charts, song counts) are generated from the app's own data,");
  L.push("so this guide always matches what the app actually plays. Also readable in-app under **Instruments**.");
  L.push("", "Any built-in song can be copied in the Song Editor and switched to another instrument.");
  L.push("Ranges are **sounding** pitch throughout — a microphone hears what leaves the instrument, not what is");
  L.push("written on the page, so a B♭ trumpet playing a written C registers here as B♭.", "");
  L.push("## Contents", "");
  for (const id of ids) L.push(`- [${INSTRUMENTS[id].name}](#${anchor(INSTRUMENTS[id].name)})`);
  L.push("");

  for (const id of ids) {
    const g = GUIDE[id], f = instrumentFacts(id);
    L.push(`## ${INSTRUMENTS[id].name}`, "", `*${g.tagline}*`, "", g.overview, "");

    L.push("**At a glance**", "", "| | |", "|---|---|", `| Family | ${g.family} |`, `| Range (as modeled) | ${f.range} |`);
    if (f.strings.length) L.push(`| Strings | ${f.strings.length} — ${f.strings.map((s) => s.note).join(" ")} |`);
    if (f.inst.frets) L.push(`| Frets modeled | ${f.inst.frets} |`);
    L.push(`| Tuner | ${f.tuner ? "yes" + (f.tunings.length > 1 ? ` (${f.tunings.map((t) => t.name).join(", ")})` : "") : "—"} |`);
    L.push(`| Play-view fingering hint | ${f.panel || "—"} |`);
    L.push(`| Built-in songs written for it | ${f.songs} |`, "");

    if (f.strings.length) {
      L.push("**Strings** (low string first)", "", "| String | Note | MIDI | Frequency |", "|---|---|---|---|");
      for (const s of f.strings) L.push(`| ${s.label} | ${s.note} | ${s.midi} | ${s.freq.toFixed(1)} Hz |`);
      L.push("");
      const alts = f.tunings.filter((t) => t.name !== "standard");
      if (alts.length) L.push("**Alternate tunings:** " + alts.map((t) => `${t.name} = ${t.notes}`).join(" · "), "");
    }
    if (id === "harmonica") {
      const ch = harmonicaChart();
      L.push("**Hole chart (Richter-tuned C diatonic)**", "");
      L.push("| Hole | " + ch.map((h) => h.hole).join(" | ") + " |");
      L.push("|---|" + ch.map(() => "---").join("|") + "|");
      L.push("| Blow ↑ | " + ch.map((h) => h.blow).join(" | ") + " |");
      L.push("| Draw ↓ | " + ch.map((h) => h.draw).join(" | ") + " |", "");
    }

    const section = (title, items, ordered) => {
      if (!items || !items.length) return;
      L.push(`### ${title}`, "");
      items.forEach((t, i) => L.push(`${ordered ? `${i + 1}.` : "-"} ${t}`));
      L.push("");
    };
    section("Anatomy", g.anatomy);
    section("How to play", g.playing, true);
    section("Techniques", g.techniques);
    section("Beginner tips", g.tips);
    if (g.care) L.push("### Care", "", g.care, "");
    const app = [
      f.tuner ? `Tuner: supported${f.tunings.length > 1 ? ` — tunings: ${f.tunings.map((t) => t.name).join(", ")}` : ""}.`
              : "Tuner: not applicable (nothing to tune string-by-string).",
      f.panel ? `Play view shows a ${f.panel} fingering hint for every note.`
              : "Play view grades by pitch alone — no fingering hint for this instrument.",
      `${f.songs} built-in song${f.songs === 1 ? "" : "s"} written for it${id === "acoustic-guitar" ? " (plus every drill)" : ""}.`,
      ...(id === "voice" ? [`${builtinSongs().filter((s) => (s.lyrics || []).length).length} built-in songs carry singalong lyrics for Karaoke.`] : []),
      ...(g.inApp || []),
    ];
    section("In GuitarPicker", app);
  }
  return L.join("\n");
}

// LRC karaoke-lyric parsing and serialization.
//
// Supports two flavours, both common in the wild:
//   - Standard LRC: line timestamps        [mm:ss.xx]Line text
//   - Enhanced LRC: inline word timestamps  [mm:ss.xx]<mm:ss.xx>Word <mm:ss.xx>word
// A single line may carry several leading time tags (repeated lines), which we
// expand into one entry per tag. ID-tag metadata ([ti:], [ar:], ...) is ignored,
// except [offset:N] (milliseconds) which is applied to every timestamp.
//
// Output matches the song-format lyric shape:
//   { time, dur, text, words?: [{ t, d, text }] }
// Durations are filled from the following timestamp so the persisted song is
// self-contained; the karaoke timeline tolerates them being absent too.

const LEADING_TIME_TAG = /^\s*\[(\d+):(\d+(?:[.:]\d+)?)\]/;
const OFFSET_TAG = /^\s*\[offset:\s*(-?\d+)\s*\]/i;
const WORD_TAG = /<(\d+):(\d+(?:[.:]\d+)?)>([^<]*)/g;

function tagToSeconds(min, sec) {
  return parseInt(min, 10) * 60 + parseFloat(String(sec).replace(":", "."));
}

// "mm:ss.xx" (or "m:ss") -> seconds, or null when it isn't a timestamp.
function parseLRCTime(str) {
  const m = /^\s*(\d+):(\d+(?:[.:]\d+)?)\s*$/.exec(str || "");
  return m ? tagToSeconds(m[1], m[2]) : null;
}

function parseEnhancedLine(rest) {
  if (!/<\d+:\d+(?:[.:]\d+)?>/.test(rest)) return { text: rest.trim(), words: null };
  const words = [];
  let plain = "";
  WORD_TAG.lastIndex = 0;
  let m;
  while ((m = WORD_TAG.exec(rest))) {
    const t = tagToSeconds(m[1], m[2]);
    plain += m[3];
    const text = m[3].trim();
    if (text) words.push({ t: +t.toFixed(3), text });
  }
  return { text: plain.trim(), words: words.length ? words : null };
}

function fillDurations(lines, defaultLineDur = 3) {
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    const lineEnd = i + 1 < lines.length ? lines[i + 1].time : L.time + defaultLineDur;
    if (L.dur == null) L.dur = +Math.max(0.1, lineEnd - L.time).toFixed(3);
    if (L.words) {
      for (let j = 0; j < L.words.length; j++) {
        const w = L.words[j];
        const wEnd = j + 1 < L.words.length ? L.words[j + 1].t : lineEnd;
        if (w.d == null) w.d = +Math.max(0.05, wEnd - w.t).toFixed(3);
      }
    }
  }
}

function parseLRC(text) {
  const out = [];
  let offset = 0;
  for (const raw of String(text || "").split(/\r?\n/)) {
    if (!raw.trim()) continue;
    const off = OFFSET_TAG.exec(raw);
    if (off) { offset = parseInt(off[1], 10) / 1000; continue; }
    // Strip and collect all leading [mm:ss.xx] tags.
    const times = [];
    let rest = raw, m;
    while ((m = LEADING_TIME_TAG.exec(rest))) {
      times.push(tagToSeconds(m[1], m[2]));
      rest = rest.slice(m[0].length);
    }
    if (!times.length) continue; // metadata tag or untimed line — skip
    const { text: lineText, words } = parseEnhancedLine(rest);
    for (const t0 of times) {
      const entry = { time: +(t0 + offset).toFixed(3), text: lineText };
      if (words) entry.words = words.map((w) => ({ t: +(w.t + offset).toFixed(3), text: w.text }));
      out.push(entry);
    }
  }
  out.sort((a, b) => a.time - b.time);
  fillDurations(out);
  return out;
}

function fmtTime(sec) {
  const s = Math.max(0, sec);
  const mm = Math.floor(s / 60);
  const ss = (s - mm * 60).toFixed(2);
  return `${String(mm).padStart(2, "0")}:${ss.padStart(5, "0")}`;
}

// Serialize a song-format lyric array back to LRC. `enhanced` emits inline word
// timestamps when a line carries word timing.
function toLRC(lyrics, { enhanced = true } = {}) {
  const lines = [];
  for (const L of lyrics || []) {
    if (typeof L.time !== "number") continue;
    let line = `[${fmtTime(L.time)}]`;
    if (enhanced && Array.isArray(L.words) && L.words.length) {
      line += L.words.map((w) => `<${fmtTime(w.t)}>${w.text}`).join(" ");
    } else {
      line += L.text || "";
    }
    lines.push(line);
  }
  return lines.join("\n");
}

  const grid = (60 / bpm) * gridBeats;

    .map((n) => ({
      time: +(Math.round(n.time / grid) * grid).toFixed(4),
      dur: +(Math.max(grid, Math.round(n.dur / grid) * grid) * 0.92).toFixed(4),
      midi: n.midi,

    .filter((n) => n.dur >= grid * 0.5);

    notes.push({ time: n.start, dur, midi: [n.midi] });

  }
  root.appendChild(el("div.panel", {}, [
    el("div.spread", {}, [
      el("h2", { text: "Vocal melody (Karaoke scoring)" }),
      el("div.row", { style: { gap: "6px", flexWrap: "wrap" } }, [
        el("button.btn", { onclick: () => { (song.voice ||= { notes: [] }).notes = cloneNotes(song.notes); setLayer("voice"); toast("Copied the melody to the vocal line — now editing the Vocal layer", "good"); } }, ["⎘ Copy from notes"]),
        el("button.btn", { onclick: startHum }, ["🎙️ Hum to capture"]),
        el("button.btn", { title: "Singers often sit an octave above the guitar", onclick: () => shiftVoice(12) }, ["8va ▲"]),
        el("button.btn", { title: "Shift the vocal line down an octave", onclick: () => shiftVoice(-12) }, ["8vb ▼"]),

  ]));

      .forEach((tok, w) => tapFlat.push({ line, text: tok, first: w === 0 })));

      ]),

      el("p.muted", { style: { fontSize: "12px", marginTop: "6px" }, text: "Play along and tap on each word as you sing it. The backing track (if attached) plays automatically." }),
    );
  }

  renderLyrics();
  redraw();

  // ---------- actions ----------
  function applyNotation() {
    const txt = notation.value.trim();
    if (!txt) return;
    try {
      const parsed = parseMelody(song.bpm, txt);
      if (editLayer === "voice") (song.voice ||= { notes: [] }).notes = parsed; else song.notes = parsed;

    const safe = (song.title || "song").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "_") || "song";

  }

  // stop tap-to-time and hum-capture (timers/listeners/mic) when leaving the view

}

function notesToNotation(notes, bpm) {
  const spb = 60 / bpm;
  return notes.slice().sort((a, b) => a.time - b.time).map((n) => {
    const beats = Math.round((n.dur / spb / 0.92) * 4) / 4 || 1;
    const pitches = n.midi.map((m) => midiToName(m).full).join("+");

  }).join(" ");
}

    summary.append(
      stat(rows.length, "Sessions"),
      stat(avgAcc + "%", "Avg accuracy"),
      stat(passes, "Passes"),
      stat(best, "Best streak"),
      stat(fmtTime(totalTime), "Time played"),
      stat("🪙 " + coinsThis, "Coins earned"),
    );

    // charts (chronological)
    const chrono = rows.slice().sort((a, b) => a.ts - b.ts);
    const accPts = chrono.map((h, i) => ({ x: i, y: h.accuracy }));
    const scorePts = chrono.map((h, i) => ({ x: i, y: Math.min(100, h.score / 50) }));
    requestAnimationFrame(() => {
      lineChart(accCanvas, [{ color: getVar("--good"), points: accPts }], { minY: 0, maxY: 100 });
      lineChart(scoreCanvas, [{ color: getVar("--accent"), points: scorePts }], { minY: 0, maxY: 100 });
    });

    // table
    clear(table);
    let display = rows.slice().sort((a, b) => b.ts - a.ts);
    if (viewMode === "bysong") {
      const bySong = new Map();
      for (const h of rows) {
        const cur = bySong.get(h.songId);
        if (!cur || h.score > cur.score) bySong.set(h.songId, h);
      }
      display = [...bySong.values()].sort((a, b) => b.score - a.score);
    }
    const t = el("table.data", {}, [
      el("tr", {}, ["When", "Song", "Instrument", "Score", "Accuracy", "Streak", "Result"].map((h) => el("th", { text: h }))),
      ...display.slice(0, 200).map((h) => el("tr", {}, [
        el("td", { text: new Date(h.ts).toLocaleString() }),
        el("td", { text: h.songTitle || h.songId }),
        el("td", { text: INSTRUMENTS[h.instrument]?.name || h.instrument }),
        el("td", { text: h.score.toLocaleString() }),
        el("td", { text: h.accuracy + "%" }),
        el("td", { text: h.maxStreak }),
        el("td", { html: h.passed ? `<span style="color:${getVar("--good")}">Pass</span>` : `<span style="color:${getVar("--bad")}">—</span>` }),
      ])),
    ]);
    table.appendChild(t);
  }

  // re-draw charts on resize
  const onResize = () => renderAll();
  window.addEventListener("resize", onResize);
  return () => window.removeEventListener("resize", onResize);
}

// Markdown practice report for AI analysis (Claude / Claude Cowork). Plain
// tables, newest first — no app knowledge needed to read it.
function buildProgressReport(all) {
  const rows = all.slice().sort((a, b) => b.ts - a.ts);
  const day = (ts) => new Date(ts).toISOString().slice(0, 10);
  const avgAcc = Math.round(rows.reduce((a, h) => a + h.accuracy, 0) / rows.length);
  const totalTime = rows.reduce((a, h) => a + (h.durationSec || 0), 0);
  const streak = Store.settings().streak || { count: 0, best: 0 };

  const bySong = new Map();
  for (const h of rows) {
    const s = bySong.get(h.songId) || { title: h.songTitle || h.songId, inst: h.instrument, attempts: 0, passes: 0, bestScore: 0, bestAcc: 0 };
    s.attempts++; if (h.passed) s.passes++;
    s.bestScore = Math.max(s.bestScore, h.score); s.bestAcc = Math.max(s.bestAcc, h.accuracy);
    bySong.set(h.songId, s);
  }
  const songRows = [...bySong.values()].sort((a, b) => b.attempts - a.attempts)
    .map((s) => `| ${s.title} | ${INSTRUMENTS[s.inst]?.name || s.inst} | ${s.attempts} | ${s.passes} | ${s.bestAcc}% | ${s.bestScore.toLocaleString()} |`);

  const sessionRows = rows.map((h) => {
    const n = h.notes || {};
    return `| ${new Date(h.ts).toISOString().slice(0, 16).replace("T", " ")} | ${h.songTitle || h.songId} | ${h.accuracy}% | ${h.score.toLocaleString()} | ${h.maxStreak} | ${h.passed ? "pass" : "fail"} | ${n.perfect ?? ""}/${n.good ?? ""}/${n.off ?? ""}/${n.miss ?? ""} |`;
  });

  return `# GuitarPicker practice report

Generated ${new Date().toISOString().slice(0, 10)} · exported from GuitarPicker (accuracy = pitch-detection grading of real playing).

> **Suggested prompt:** Act as my guitar teacher. Analyze this practice log: accuracy and score trends over time, consistency of practice, which songs need the most work, and where I plateau. Finish with a focused practice plan for the next week.

## Summary

- Sessions: ${rows.length} (${day(rows[rows.length - 1].ts)} → ${day(rows[0].ts)})
- Average accuracy: ${avgAcc}% · passes: ${rows.filter((h) => h.passed).length}/${rows.length}
- Total time played: ${fmtTime(totalTime)}
- Daily practice streak: ${streak.count} (best ${streak.best})

## Per song

| Song | Instrument | Attempts | Passes | Best accuracy | Best score |
|---|---|---|---|---|---|
${songRows.join("\n")}

## Sessions (newest first — Notes column is perfect/good/off/miss counts)

| When (UTC) | Song | Accuracy | Score | Best streak | Result | Notes |
|---|---|---|---|---|---|---|
${sessionRows.join("\n")}
`;
}

// Cosmetics collection summary: coin balance, overall completion bar, and a

// Date-seeded daily practice checklist with per-day completion tracking.
// Each activity pays a few coins the first time it's checked off today, with a
// bonus when the whole list is finished. `reward` records what's been paid so
// re-checking can't farm coins.
const DAILY_COIN = 12, DAILY_BONUS = 40;
function buildDailyPanel(navigate, instrument) {
  const today = todayKey();
  const acts = dailyActivities(today, instrument);
  const saved = Store.settings().daily;
  const fresh = saved && saved.date === today;
  const done = new Set(fresh ? (saved.done || []) : []);
  const rewarded = new Set(fresh ? (saved.rewarded || []) : []);
  let bonusPaid = !!(fresh && saved.bonusPaid);

  const counter = el("span.muted");
  const bar = progressBar(0);
  const list = el("div.col", { style: { gap: "10px", marginTop: "12px" } });
  const streakChip = el("span.streak-chip");

  function paintStreak() {
    const ss = streakStatus(Store.settings().streak, today);
    streakChip.innerHTML = ss.count > 0
      ? `🔥 <b>${ss.count}</b>-day streak${ss.best > ss.count ? ` · best ${ss.best}` : ""}`
      : "🔥 Start your streak today!";
    streakChip.title = ss.practicedToday
      ? "Practiced today — streak secured! Come back tomorrow to extend it."
      : "Play a song today — even a failed run counts — to keep your streak alive. Ticking activities doesn't.";
    streakChip.classList.toggle("cold", ss.count === 0);
  }

  function persist() { Store.setSetting("daily", { date: today, done: [...done], rewarded: [...rewarded], bonusPaid }); }
  function refresh() {
    // Count only today's actual activities: switching instrument can drop "Tune up"
    // from the list while it's still ticked in storage, which would read "5 / 4".
    const n = acts.filter((a) => done.has(a.id)).length;
    counter.textContent = `${n} / ${acts.length} done`;
    if (bar.firstChild) bar.firstChild.style.width = (acts.length ? n / acts.length : 0) * 100 + "%";
    paintStreak();
  }
  function toggle(a, paint) {
    if (done.has(a.id)) { done.delete(a.id); }
    else {
      done.add(a.id);
      // NB: ticking an activity gives coins but does NOT touch the streak — only
      // actually playing a song does (Store.addHistory). Keeps it un-gameable.
      if (!rewarded.has(a.id)) { rewarded.add(a.id); Store.addCoins(DAILY_COIN); toast(`+${DAILY_COIN} 🪙 — ${a.title}`, "good"); }
      if (acts.every((x) => done.has(x.id)) && !bonusPaid) { bonusPaid = true; Store.addCoins(DAILY_BONUS); toast(`Daily complete! +${DAILY_BONUS} 🪙 bonus`, "good"); }
    }
    persist(); paint(); refresh();
  }

  for (const a of acts) {
    const check = el("button.btn");
    const paint = () => { check.textContent = done.has(a.id) ? "✓ Done" : `Mark done +${DAILY_COIN}🪙`; check.classList.toggle("primary", done.has(a.id)); };
    check.addEventListener("click", () => toggle(a, paint));
    paint();
    list.appendChild(el("div.row", { style: { alignItems: "center", gap: "12px" } }, [
      el("div", { style: { flex: "1", minWidth: "180px" } }, [
        el("div", { html: `${a.icon} <b>${a.title}</b>` }),
        el("div.muted", { style: { fontSize: "12px" }, text: a.desc }),
      ]),
      el("button.btn.primary", { onclick: () => navigate(a.hash) }, ["Go"]),
      check,
    ]));
  }
  refresh();

  return el("div.panel", { style: { marginBottom: "16px" } }, [
    el("div.spread", {}, [
      el("div.row", { style: { alignItems: "center", gap: "10px" } }, [
        el("h2", { text: "🗓️ Today's Practice", style: { margin: "0" } }), streakChip,
      ]),
      el("span.muted", {}, [counter, el("span", { html: ` · complete all for +${DAILY_BONUS} 🪙` })]),
    ]),
    bar, list,
  ]);
}

      el("div.spread", {}, [el("h2", { text: song.title }), el("button.btn.ghost", { onclick: close }, ["✕"])]),
      el("div.muted", { text: `${song.artist} · ${INSTRUMENTS[song.instrument]?.name || song.instrument}` }),
      keyLine,
      el("div.row", { style: { margin: "10px 0" } }, [
        tag(song.difficulty, song.difficulty),
        song.audio?.backing ? tag("has backing") : tag("🎺 synth band"),
        song.audio?.vocal ? tag("has vocal") : null,
        song.lyrics?.length ? tag("🎤 karaoke") : null,
        ...(song.parts || []).map((p) => tag("+ " + (INSTRUMENTS[p.instrument]?.name || p.instrument))),
      ]),

        el("div.spread", {}, [
          el("span.muted", { text: "Transpose (creates a copy in a new key):" }),
          el("div.row", { style: { gap: "6px" } }, [
            el("button.btn", { onclick: () => doTranspose(-1) }, ["♭ −1"]),
            el("button.btn", { onclick: () => doTranspose(1) }, ["♯ +1"]),
            el("button.btn", { onclick: () => Synth.playMidi((song.notes[0]?.midi[0]) || 60, { instrument: song.instrument }) }, ["🔊 Preview"]),
          ]),
        ]),
      ]),
      el("div.row", { style: { marginTop: "14px" } }, [
        el("button.btn.primary", { onclick: () => navigate(`#/play/${working.id}`) }, ["▶ Play"]),
        song.lyrics?.length ? el("button.btn", { onclick: () => navigate(`#/karaoke/${working.id}`) }, ["🎤 Karaoke"]) : null,
        el("button.btn", { onclick: () => navigate(`#/editor/${working.id}`) },
          [isBuiltin(working.id) ? "✏ Edit a copy" : "✏ Edit"]),
        el("button.btn", { onclick: () => exportSong(working) }, ["⬆ Export"]),

        parts: (working.parts || []).map((p) => ({ ...p, notes: transposeSong(p.notes, semi) })),
        voice: working.voice?.notes?.length ? { ...working.voice, notes: transposeSong(working.voice.notes, semi) } : working.voice,

      const song = parse(picked.text);
      song.id = uid(); song.source = "import";
      Store.saveSong(song);
      toast(`Imported "${song.title}" (from ${picked.name})`, "good");
    } catch (e) { toast("Import failed: " + e.message, "bad"); }
  }

  return () => off();

function noteToPc(key) {
  const m = String(key).match(/^([A-Ga-g])([#b]?)/);
  if (!m) return 0;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];

  let taps = [];

    if (taps.length >= 2) {
      const intervals = []; for (let i = 1; i < taps.length; i++) intervals.push(taps[i] - taps[i - 1]);

  const capStatus = el("span.muted", { text: "" });

  root.appendChild(el("div.panel", {}, [
    el("h2", { text: "1 · Set up" }),
    el("div.grid", { style: { gridTemplateColumns: "2fr 1fr" } }, [bpmSlider, el("div.col", { style: { justifyContent: "flex-end" } }, [tapBtn])]),
    el("div.row", { style: { marginTop: "10px", alignItems: "center" } }, [capToggle, capStatus]),
    el("p.muted", { style: { fontSize: "12px" }, html: "Screen capture is optional — when on, GuitarPicker snapshots the region you share into a slideshow that plays behind the notes. You choose the region in the browser's share dialog." }),
  ]));

  // record panel
  const liveNote = el("div.tuner-note", { html: "—", style: { fontSize: "54px" } });

  }

      id: uid(), title: `Recording ${new Date().toLocaleString()} (${lv.label})`,
      artist: "You", instrument: s.instrument, bpm, difficulty: lv.id, source: "listen",
      background: chosenBg, notes,

  // ---------- screen capture ----------

}

__def("src/views/minigames.js", function (__exp, __req) {

const { el, pageHead, clear, toast } = __req("src/ui/components.js");

const { NOTE_SHARP, KEY_SIGNATURES, scaleNotes, nameToMidi } = __req("src/music/notes.js");

const rand = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((p) => p[1]);

const GAMES = {
  interval_ear: {
    title: "Interval Ear Training", icon: "👂", desc: "Hear two notes — name the interval.",
    gen() {
      const base = 55 + Math.floor(Math.random() * 8);
      const iv = rand(INTERVALS.filter((i) => i.semitones > 0));
      const wrong = shuffle(INTERVALS.filter((i) => i.short !== iv.short)).slice(0, 3);
      return {
        prompt: "Which interval did you hear?",
        choices: shuffle([iv, ...wrong].map((i) => i.name)),
        answer: iv.name,
        audio: () => { Synth.playMidi(base, { dur: 0.6 }); setTimeout(() => Synth.playMidi(base + iv.semitones, { dur: 0.6 }), 500); },
      };
    },
  },

    title: "Chord Quality", icon: "🎹", desc: "Hear a chord — is it major, minor…?",
    gen() {
      const types = ["maj", "min", "dim", "aug", "dom7", "min7"];
      const t = rand(types), root = 52 + Math.floor(Math.random() * 8);
      const labels = { maj: "Major", min: "Minor", dim: "Diminished", aug: "Augmented", dom7: "Dominant 7th", min7: "Minor 7th" };

        prompt: "What quality is this chord?",
        choices: shuffle([t, ...wrong].map((x) => labels[x])),
        answer: labels[t],
        audio: () => chordMidis(root, t).forEach((m) => Synth.playMidi(m, { dur: 1.2 })),
      };
    },
  },
  interval_name: {
    title: "Interval Spelling", icon: "📐", desc: "From note to note — name the interval.",
    gen() {
      const base = rand(NOTE_SHARP);
      const iv = rand(INTERVALS.filter((i) => i.semitones > 0 && i.semitones <= 12));
      const target = NOTE_SHARP[(NOTE_SHARP.indexOf(base) + iv.semitones) % 12];
      const wrong = shuffle(INTERVALS.filter((i) => i.short !== iv.short)).slice(0, 3);
      return {
        prompt: `What is the interval from ${base} up to ${target}?`,
        choices: shuffle([iv, ...wrong].map((i) => i.name)),

    },
  },

      const n = KEY_SIGNATURES[key];
      const desc = n === 0 ? "No sharps or flats" : `${Math.abs(n)} ${n > 0 ? "sharp" : "flat"}${Math.abs(n) > 1 ? "s" : ""}`;
      const opts = new Set([desc]);
      while (opts.size < 4) {
        const m = Math.floor(Math.random() * 8) - 0, sharp = Math.random() > 0.5;
        opts.add(m === 0 ? "No sharps or flats" : `${m} ${sharp ? "sharp" : "flat"}${m > 1 ? "s" : ""}`);
      }
      return { prompt: `How many sharps/flats in ${key} major?`, choices: shuffle([...opts]), answer: desc };
    },
  },

    title: "Scale Degrees", icon: "🪜", desc: "Find the right note in a scale.",
    gen() {

      const pcs = scaleNotes(NOTE_SHARP.indexOf(root), "major");
      const answer = NOTE_SHARP[pcs[degree]];
      const ordinals = ["root", "2nd", "3rd", "4th", "5th", "6th", "7th"];
      const wrong = shuffle(NOTE_SHARP.filter((n) => n !== answer)).slice(0, 3);
      return { prompt: `What is the ${ordinals[degree]} of the ${root} major scale?`, choices: shuffle([answer, ...wrong]), answer };
    },
  },

function minigames(ctx) {
  const { el: root } = ctx;
  clear(root);
  root.appendChild(pageHead("Theory Games", "Bite-sized quizzes to sharpen your ear and theory. Beat your high score!"));

  const menu = el("div.grid.cards");
  root.appendChild(menu);
  const prog = Store.progressFor("theory");
  for (const [id, g] of Object.entries(GAMES)) {
    const best = prog.drills?.[id] || 0;
    menu.appendChild(el("div.card", { onclick: () => runGame(id) }, [
      el("div.title", { html: `${g.icon} ${g.title}` }),
      el("div.sub", { text: g.desc }),
      el("div.muted", { style: { fontSize: "12px", marginTop: "auto" }, text: `High score: ${best}/${QUESTIONS}` }),
    ]));
  }

  function runGame(id) {
    const g = GAMES[id];
    let qi = 0, correct = 0, locked = false;
    clear(root);
    const stage = el("div.panel", { style: { maxWidth: "640px", margin: "0 auto" } });
    root.appendChild(pageHead(g.title, g.desc, [el("button.btn.ghost", { onclick: () => minigames(ctx) }, ["← Games"])]));
    root.appendChild(stage);
    next();

    function next() {
      if (qi >= QUESTIONS) return finish();
      locked = false;
      const q = g.gen();
      clear(stage);
      stage.appendChild(el("div.spread", {}, [
        el("div.muted", { text: `Question ${qi + 1} / ${QUESTIONS}` }),
        el("div.muted", { text: `Score: ${correct}` }),
      ]));
      stage.appendChild(el("h2", { style: { margin: "12px 0" }, text: q.prompt }));
      if (q.audio) {
        stage.appendChild(el("div.center", { style: { marginBottom: "14px" } }, [
          el("button.btn.lg.primary", { onclick: q.audio }, ["🔊 Play again"]),
        ]));
        q.audio();
      }
      const choices = el("div.quiz-choices");
      q.choices.forEach((ch) => choices.appendChild(el("div.quiz-choice", { text: ch, onclick: (e) => answer(e.currentTarget, ch, q) })));
      stage.appendChild(choices);
    }

    function answer(node, choice, q) {
      if (locked) return; locked = true;
      const right = choice === q.answer;
      node.classList.add(right ? "correct" : "wrong");
      if (right) correct++;
      else {
        [...node.parentElement.children].forEach((c) => { if (c.textContent === q.answer) c.classList.add("correct"); });

      qi++;
      setTimeout(next, right ? 650 : 1200);
    }

    function finish() {
      const prev = Store.progressFor("theory").drills?.[id] || 0;
      Store.recordDrill("theory", id, correct);
      clear(stage);
      const pct = Math.round((correct / QUESTIONS) * 100);
      stage.appendChild(el("div.center", {}, [
        el("div.big-grade", { text: pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "📚" }),
        el("h2", { text: `${correct} / ${QUESTIONS} correct (${pct}%)` }),
        correct > prev ? el("p", { style: { color: "var(--good)" }, text: "New high score!" }) : el("p.muted", { text: `High score: ${Math.max(prev, correct)}` }),
        el("div.row", { style: { justifyContent: "center", marginTop: "10px" } }, [
          el("button.btn.primary", { onclick: () => runGame(id) }, ["Play again"]),
          el("button.btn", { onclick: () => minigames(ctx) }, ["← Games"]),
        ]),
      ]));
      if (correct > prev) toast("New high score!", "good");
    }
  }
}

      html: "I'm a software developer — <b>not a doctor, music teacher, coach, or lawyer</b>. Nothing here is professional instruction or medical, hearing, or legal advice. Play at a comfortable volume and protect your hearing. Not affiliated with or endorsed by Yousician or any other company." }),
    el("p.muted", { style: { margin: "0 0 8px", fontSize: "13px", lineHeight: "1.5" },

        "<b>Cloud sync is optional and off by default</b> — if you enable it and sign in with Google, your songs/history/progress sync to a private folder in <i>your own</i> Google Drive (minimal <code>drive.appdata</code> scope, plus your name and email so this page can show which account is connected); sign out anytime. Otherwise your data lives only in this browser." }),
    el("p.muted", { style: { margin: "0 0 10px", fontSize: "13px", lineHeight: "1.5" },
      html: "Built-in songs are traditional / public-domain works and the glossary is original. No third-party code, fonts, images, or audio are bundled." }),

const { el, pageHead, stat, tag, progressBar, slider } = __req("src/ui/components.js");
const { Store } = __req("src/state.js");

function training(ctx) {

    stat(prog.xp || 0, "XP"),
    stat(Object.values(prog.drills || {}).length || hist.filter((h) => h.songId?.startsWith("drill-")).length, "Drills tried"),
    stat(hist.filter((h) => h.passed).length, "Passes"),
  ]));

  // ---------- Courses ----------
  root.appendChild(el("h2", { text: "Courses" }));
  for (const course of COURSES) {
    const done = course.steps.filter((st) => bestFor(st.ref)?.passed).length;

        el("div", {}, [el("h3", { text: course.title }), el("div.muted", { text: course.desc })]),

    ]);

      const locked = i > 0 && !bestFor(course.steps[i - 1].ref)?.passed;
      stepList.appendChild(el("div.spread", { style: { padding: "8px 10px", border: "1px solid var(--line)", borderRadius: "9px",
        opacity: locked ? 0.55 : 1, background: b?.passed ? "color-mix(in srgb, var(--good) 10%, var(--panel-2))" : "var(--panel-2)" } }, [

    let bpm = d.bpm;
    const best = bestFor(d.id);
    const bpmCtl = slider({ label: "Tempo", min: 50, max: 180, step: 5, value: bpm, fmt: (v) => v + " BPM", oninput: (v) => bpm = v });

    ]));
  }
  root.appendChild(grid);

  function launch(refId) {

    navigate(`#/play/${refId}`);

  function launchDrill(drill, bpm) {
    const song = buildDrillSong(drill, bpm);
    Store.saveSong(song);
    navigate(`#/play/${song.id}`);
  }
}

__def("src/views/tuner.js", function (__exp, __req) {

Object.defineProperties(__exp, {
    "default": { enumerable: true, get: () => tuner }
  });
const { el, pageHead, select, toast } = __req("src/ui/components.js");
const { Store } = __req("src/state.js");

const { detectPitch, PitchTracker } = __req("src/audio/pitch.js");

async function tuner(ctx) {
  const { el: root } = ctx;
  const s = Store.settings();

  let tuningName = "standard";
  let tuning = (ALT_TUNINGS[instrument] || {})[tuningName] || INSTRUMENTS[instrument].strings;

  let refStop = null;
  let running = false;

  const buf = new Float32Array(2048);

  root.appendChild(pageHead("Tuner", "Play one string at a time. GuitarPicker detects pitch and tells you when you're out of tune."));

  // controls
  const instSel = select({ label: "Instrument", value: instrument,
    options: instrumentOptions((i) => i.strings.length),
    onchange: (v) => { instrument = v; tuningName = "standard"; rebuildTuning(); } });
  const tuningSel = select({ label: "Tuning", value: tuningName, options: tuningOptions(),
    onchange: (v) => { tuningName = v; rebuildTuning(); } });

  const startBtn = el("button.btn.primary", { onclick: toggle }, ["Start tuning"]);
  root.appendChild(el("div.panel", {}, [
    el("div.grid", { style: { gridTemplateColumns: "1fr 1fr auto" } }, [instSel, tuningSel,
      el("div.col", { style: { justifyContent: "flex-end" } }, [startBtn])]),
  ]));

  // display
  const noteEl = el("div.tuner-note", { html: "—" });
  const freqEl = el("div.tuner-freq", { text: "Play a note…" });
  const needle = el("div.tuner-needle");
  const verdict = el("div.tuner-verdict", { text: "" });
  const meter = el("div.tuner-meter", {}, [
    needle, el("div.tuner-scale"), el("div.tuner-center"),
    scaleTick(-50), scaleTick(-25), scaleTick(25), scaleTick(50),
  ]);
  const strings = el("div.string-row");

  root.appendChild(el("div.panel.tuner-display", {}, [noteEl, freqEl, meter, verdict,
    el("p.muted", { style: { marginTop: "14px" }, text: "Select a string to lock the target, or leave on Auto." }),
    strings,
  ]));

  function tuningOptions() {
    return Object.keys(ALT_TUNINGS[instrument] || { standard: 1 }).map((k) => ({ value: k, label: k }));

      width: "1px", height: "10px", background: "var(--line)" } });
  }

}
