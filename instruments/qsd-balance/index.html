<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FIND BALANCE W/ QSD</title>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QSD Balance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">FIND BALANCE <span>W/ QSD</span></div>
    <div class="stats">
      <span id="statusLabel">LOADING</span>
      <span id="timeLabel">0.0s</span>
    </div>
    <div class="buttons">
      <button id="boardsBtn" class="btn">Boards</button>
      <button id="tiltBtn" class="btn">Enable Tilt</button>
      <button id="sensBtn" class="btn">Sens: Med</button>
      <button id="restartBtn" class="btn">Reset</button>
      <button id="soundBtn" class="btn icon" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game" aria-label="Find Balance with QSD marble board"></canvas>

    <div id="overlay" class="overlay">
      <div class="card">
        <div class="card-head">
          <div class="eyebrow">QSD</div>
          <h1>FIND BALANCE</h1>
          <h2>W/ QSD</h2>
        </div>
        <div class="card-body">
          <p id="boardBlurb" class="blurb">Roll the marble around the open space without crossing the solid artwork.</p>
          <div class="picker-label">CHOOSE YOUR BOARD</div>
          <div id="boardGrid" class="board-grid" role="listbox" aria-label="Game boards"></div>
          <p class="small controls-note">Arrow keys / WASD, drag the board, or enable device tilt on mobile.</p>
          <div class="actions">
            <button id="startBtn" class="btn primary">LOADING BOARD…</button>
            <button id="resumeBtn" class="btn secondary hidden">RESUME</button>
          </div>
        </div>
      </div>
    </div>

    <div id="pauseHint" class="pause-hint hidden">PAUSED &middot; TAP TO RESUME</div>
  </main>

  <footer id="hint"></footer>
</div>
<noscript>This game needs JavaScript.</noscript>
<script src="boards.js"></script>
<script src="game.js"></script>
</body>
</html>
